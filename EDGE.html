<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#08090C" />
<title>LOCKBOT Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   LOCKBOT EDGE — theme tokens
   "Volt" dark (default) + "Paper" light
   ============================================================ */
:root {
  --bg: #08090C; --surface: #0F1116; --surface-2: #141720; --surface-3: #1B1F2A;
  --line: #232734; --line-soft: #191C25;
  --text: #ECEEF3; --muted: #8A90A0; --dim: #5C6272;
  --accent: #D4FF3A; --accent-ink: #0B0D05; --accent-soft: rgba(212,255,58,.10); --accent-line: rgba(212,255,58,.38);
  --fair: #A496FF; --fair-soft: rgba(164,150,255,.12);
  --neg: #FF5C72; --neg-soft: rgba(255,92,114,.12);
  --warn: #FFB547; --warn-soft: rgba(255,181,71,.12);
  --live: #FF4D4D;
  --chart-1: #7A9A10; --chart-2: #7E6CF0;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F3EE; --surface: #FFFFFF; --surface-2: #F7F8F3; --surface-3: #ECEEE6;
    --line: #DCDFD4; --line-soft: #E9EBE3;
    --text: #111318; --muted: #5A606C; --dim: #8A8F99;
    --accent: #4D6B00; --accent-ink: #FFFFFF; --accent-soft: rgba(110,150,0,.12); --accent-line: rgba(77,107,0,.38);
    --fair: #5B45E0; --fair-soft: rgba(91,69,224,.10);
    --neg: #C92A45; --neg-soft: rgba(201,42,69,.10);
    --warn: #A86400; --warn-soft: rgba(168,100,0,.10);
    --live: #D92D2D;
    --chart-1: #4D6B00; --chart-2: #5B45E0;
    --shadow: 0 10px 40px rgba(20,24,10,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F3EE; --surface: #FFFFFF; --surface-2: #F7F8F3; --surface-3: #ECEEE6;
  --line: #DCDFD4; --line-soft: #E9EBE3;
  --text: #111318; --muted: #5A606C; --dim: #8A8F99;
  --accent: #4D6B00; --accent-ink: #FFFFFF; --accent-soft: rgba(110,150,0,.12); --accent-line: rgba(77,107,0,.38);
  --fair: #5B45E0; --fair-soft: rgba(91,69,224,.10);
  --neg: #C92A45; --neg-soft: rgba(201,42,69,.10);
  --warn: #A86400; --warn-soft: rgba(168,100,0,.10);
  --live: #D92D2D;
  --chart-1: #4D6B00; --chart-2: #5B45E0;
  --shadow: 0 10px 40px rgba(20,24,10,.12);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; }
body { min-height: 100vh; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
input, select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; min-width: 0; }
input:focus, select:focus { border-color: var(--accent-line); }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; padding: 0; }
input[type="range"] { accent-color: var(--accent); padding: 0; border: 0; background: none; }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.pos { color: var(--accent); } .neg { color: var(--neg); } .fairc { color: var(--fair); }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 18px; padding: 10px 20px; padding-top: max(10px, env(safe-area-inset-top)); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; transform: rotate(-6deg); }
.brand small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav button { padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.nav button:hover { color: var(--text); background: var(--surface-2); }
.nav button.on { color: var(--text); background: var(--surface-3); }
.nav button .count { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.status { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.pill.live .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 1.8s infinite; }
.pill.demo { border-color: var(--warn-soft); color: var(--warn); }
.pill.demo .dot { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); }
.icon-btn:hover { color: var(--text); border-color: var(--dim); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- generic ---------- */
.wrap { padding: 18px 20px 60px; max-width: 1680px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn svg { width: 14px; height: 14px; flex: none; }
.btn.ghost { background: none; }
.btn.danger { color: var(--neg); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; border-radius: 9px; }
.seg button { flex: 1; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent-line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 9px; border-radius: 7px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { color: var(--text); border-color: var(--accent-line); background: var(--accent-soft); }
.label { font-size: 11px; font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.h-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.h-sub { color: var(--muted); margin-top: 2px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }

/* book chip */
.bk { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.bk-logo { width: 26px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-family: var(--mono); font-size: 9px; font-weight: 700; color: #fff; letter-spacing: -.02em; flex: none; }
.bk-name { font-weight: 500; font-size: 13px; }

/* ev badge */
.evb { display: inline-flex; align-items: center; justify-content: center; min-width: 66px; padding: 5px 8px; border-radius: 7px; font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); }
.evb.hot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.evb.low { color: var(--muted); background: var(--surface-2); border-color: var(--line); }
.evb.negb { color: var(--neg); background: var(--neg-soft); border-color: transparent; }
.lg-tag { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; background: var(--surface-3); color: var(--muted); }
.live-tag { font-family: var(--mono); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { padding: 12px 14px; }
.kpi .v { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- EV layout ---------- */
.ev-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.filters { position: sticky; top: 70px; max-height: calc(100vh - 86px); overflow-y: auto; padding: 4px 14px 16px; scrollbar-width: thin; }
.filters .fs { padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.filters .fs:last-child { border-bottom: 0; }
.filters .fs > .label { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.filters .fs > .label button { color: var(--muted); font-size: 10px; letter-spacing: .08em; }
.frow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.frow > span { flex: 1; font-size: 13px; color: var(--muted); }
.frow input[type="number"], .frow input[type="text"] { width: 92px; text-align: right; font-family: var(--mono); }
.sharp-row { display: grid; grid-template-columns: 1fr 90px 34px; align-items: center; gap: 8px; margin-top: 8px; }
.sharp-row .w { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); }
.filters-close { display: none; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar .search { flex: 1; min-width: 180px; }
.toolbar .search input { width: 100%; }
.mobile-only { display: none !important; }

/* ev table */
.tbl { overflow: hidden; }
.ev-grid { display: grid; grid-template-columns: 82px minmax(150px, 1.4fr) minmax(140px, 1.2fr) minmax(140px, 1fr) 84px 78px minmax(104px, .8fr) 34px 96px; align-items: center; gap: 10px; padding: 10px 14px; }
.ev-grid > div { min-width: 0; }
.ev-row .bet, .ev-row .mk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-head { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.ev-head button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; text-align: left; }
.ev-head button.on { color: var(--text); }
.ev-row { border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background .12s; }
.ev-row:hover { background: var(--surface-2); }
.ev-row.open { background: var(--surface-2); }
.ev-row .teams { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-row .meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; }
.ev-row .bet { font-weight: 600; }
.ev-row .mk { font-size: 12px; color: var(--muted); }
.ev-row .odds { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.ev-row .also { font-size: 11px; color: var(--dim); margin-top: 2px; }
.ev-row .fair { font-family: var(--mono); color: var(--fair); font-weight: 600; }
.ev-row .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.ev-row .stake { font-family: var(--mono); font-weight: 600; }
.ev-row .sharp { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ev-row .age { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.acts { display: flex; gap: 4px; justify-content: flex-end; }
.acts button { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); }
.acts button:hover { color: var(--text); border-color: var(--dim); }
.acts button.trk { color: var(--accent); border-color: var(--accent-line); }
.acts button.trk.done { background: var(--accent); color: var(--accent-ink); }
.acts svg { width: 14px; height: 14px; }
.flash-up { animation: fup 1.6s; } .flash-dn { animation: fdn 1.6s; }
@keyframes fup { 0% { background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-line); } 100% { background: transparent; } }
@keyframes fdn { 0% { background: var(--neg-soft); } 100% { background: transparent; } }
.chev { transition: transform .15s; } .open .chev { transform: rotate(180deg); }

/* detail panel */
.detail { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 4px 14px 18px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.dbox { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px; min-width: 0; }
.dbox h4 { font-size: 12px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini th { text-align: right; font-family: var(--mono); font-size: 10px; color: var(--dim); font-weight: 500; padding: 4px 6px; letter-spacing: .06em; text-transform: uppercase; }
.mini th:first-child, .mini td:first-child { text-align: left; }
.mini td { text-align: right; padding: 5px 6px; border-top: 1px solid var(--line-soft); font-family: var(--mono); white-space: nowrap; }
.mini td:first-child { font-family: var(--font); }
.mini tr.sel td { background: var(--fair-soft); }
.mini td.best { color: var(--accent); font-weight: 700; }
.mini td.evp { background: var(--accent-soft); }
.mini .tagsharp { font-size: 9px; font-family: var(--mono); color: var(--fair); border: 1px solid var(--fair-soft); padding: 0 4px; border-radius: 3px; margin-left: 4px; }
.scroll-x { overflow-x: auto; }
.explain { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
.explain b { color: var(--text); font-weight: 600; }
.formula { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 7px; padding: 8px 10px; margin-top: 8px; color: var(--text); overflow-x: auto; white-space: nowrap; }
.spark { width: 100%; height: 64px; margin-top: 6px; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

.empty { padding: 50px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
.banner { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); margin-bottom: 14px; font-size: 13px; flex-wrap: wrap; }
.banner .btn { margin-left: auto; }
.banner.err { background: var(--neg-soft); color: var(--neg); }

/* ---------- odds screen ---------- */
.os-wrap { overflow: auto; max-height: calc(100vh - 220px); }
.os { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.os th, .os td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; text-align: center; }
.os thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-family: var(--mono); font-size: 10px; color: var(--dim); font-weight: 500; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
.os .stick { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; min-width: 210px; border-right: 1px solid var(--line); }
.os thead .stick { z-index: 3; background: var(--surface-2); }
.os tr.ev-h td { background: var(--surface-2); text-align: left; font-weight: 600; padding-top: 10px; }
.os tr.ev-h td.stick { background: var(--surface-2); }
.os td.px { font-family: var(--mono); min-width: 64px; }
.os td.px.best { color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent-line); border-radius: 6px; }
.os td.px.evp { background: var(--accent-soft); }
.os td.px .e { display: block; font-size: 10px; color: var(--accent); }
.os td.fairc { color: var(--fair); font-family: var(--mono); font-weight: 600; }
.os th .bk-logo { margin: 0 auto 3px; }
.os td.na { color: var(--dim); }

/* ---------- arbitrage ---------- */
.arb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.arb { padding: 14px; }
.arb-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.arb-legs { display: grid; gap: 6px; }
.leg { display: grid; grid-template-columns: minmax(0, 1fr) 70px 80px; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; }
.leg .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leg .o { font-family: var(--mono); font-weight: 700; text-align: right; }
.leg .st { font-family: var(--mono); text-align: right; }
.arb-foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.sec-title { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
.sec-title h3 { font-size: 15px; }

/* ---------- tracker ---------- */
.chart-card { padding: 14px 16px; margin-bottom: 14px; position: relative; }
.chart { width: 100%; height: 220px; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); display: none; z-index: 5; min-width: 150px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); }
.bets { width: 100%; border-collapse: collapse; font-size: 13px; }
.bets th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 500; padding: 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.bets td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.bets td.n { font-family: var(--mono); text-align: right; } .bets th.n { text-align: right; }
.bets select, .bets input { padding: 4px 6px; font-size: 12px; }
.bets input.stk { width: 70px; text-align: right; font-family: var(--mono); }
.st-won { color: var(--accent); } .st-lost { color: var(--neg); } .st-push, .st-void { color: var(--muted); } .st-pending { color: var(--warn); }

/* ---------- calculators ---------- */
.calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.calc { padding: 16px; }
.calc h3 { font-size: 15px; margin-bottom: 2px; }
.calc p.d { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 4px; }
.field span { font-size: 11px; color: var(--muted); }
.field input, .field select { width: 100%; font-family: var(--mono); }
.out { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.out > div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.out .k { font-size: 10px; color: var(--dim); font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.out .v { font-family: var(--mono); font-weight: 700; font-size: 16px; margin-top: 2px; }

/* ---------- modal / drawer / toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: none; }
.scrim.on { display: block; }

  BOOKS[key] = { name: title || key, abbr, color: `hsl(${h % 360} 55% 38%)` };
}

const METHODS = ["multiplicative", "additive", "power", "shin"];
const METHOD_LABELS = { worst: "Worst case", multiplicative: "Multiplicative", additive: "Additive", power: "Power", shin: "Shin" };

/* ---------------- storage ---------------- */

const DEFAULT_SETTINGS = {

const S = {

/* ---------------- odds math ---------------- */
const amToDec = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
const decToAm = (d) => (d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1)));
const amToProb = (a) => 1 / amToDec(a);
const probToAm = (p) => decToAm(1 / p);
const fmtAm = (a) => (a == null || !isFinite(a) ? "—" : a > 0 ? "+" + a : String(a));
const fmtPct = (x, d = 1) => (x == null || !isFinite(x) ? "—" : (x * 100).toFixed(d) + "%");
const fmtEV = (x) => (x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "%";
const fmtMoney = (x, d = 0) => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPt = (p) => (p > 0 ? "+" + p : p === 0 ? "PK" : String(p));
const sum = (a) => a.reduce((x, y) => x + y, 0);

/* devig: q = implied probabilities of every outcome in one market (with vig) */
function bisect(f, lo, hi, it = 60) {
  for (let i = 0; i < it; i++) { const m = (lo + hi) / 2; if (f(m) > 0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const DEVIG = {
  multiplicative(q) { const s = sum(q); return q.map((x) => x / s); },
  additive(q) {
    const s = sum(q), n = q.length;
    const p = q.map((x) => x - (s - 1) / n);
    return p.some((x) => x <= 0.001) ? DEVIG.multiplicative(q) : p;
  },
  power(q) {
    if (sum(q) <= 1) return DEVIG.multiplicative(q);
    const k = bisect((k) => sum(q.map((x) => Math.pow(x, k))) - 1, 1, 6);
    return q.map((x) => Math.pow(x, k));
  },
  shin(q) {
    const s = sum(q);
    if (s <= 1) return DEVIG.multiplicative(q);
    const at = (z) => q.map((x) => (Math.sqrt(z * z + 4 * (1 - z) * x * x / s) - z) / (2 * (1 - z)));
    const z = bisect((z) => sum(at(z)) - 1, 0, 0.5);
    const p = at(z), t = sum(p);
    return p.map((x) => x / t);
  },
};

/* Kelly fraction of bankroll for win prob p at decimal odds d */
const kellyFrac = (p, d) => Math.max(0, (p * d - 1) / (d - 1));
const stakeFor = (p, d) => {
  const raw = F.bankroll * kellyFrac(p, d) * F.kelly;
  return Math.min(raw, F.bankroll * F.maxStakePct / 100);
};

/* ---------------- time ---------------- */
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function fmtStart(t) {
  const d = new Date(t), now = new Date();
  const tm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const sameDay = d.toDateString() === now.toDateString();
  const tmr = new Date(now.getTime() + 864e5).toDateString() === d.toDateString();
  return (sameDay ? "Today" : tmr ? "Tmrw" : DAYS[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate()) + " " + tm;
}
function fmtAge(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + "s"; if (s < 3600) return Math.round(s / 60) + "m"; return Math.round(s / 3600) + "h";
}
const isLive = (ev) => ev.start <= Date.now();

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = {

  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

/* ============================================================
   DATA — normalized model
   event  { id, league, home, away, start, markets: [market] }
   market { id, key, cat, line, player, order: [names], out: { name: { name, point, prices: { book: { price, t } } } } }
   One market = one exact line, so sharp and soft prices always compare like for like.
   ============================================================ */
function groupKey(mkey, o, ev) {
  if (mkey.endsWith("_lay")) return null;
  if (mkey === "h2h") return { gid: "h2h" };
  if (mkey === "spreads") {
    if (o.point == null) return null;
    const hp = o.name === ev.home ? o.point : -o.point;
    return { gid: "spreads|" + hp, line: hp };
  }
  if (mkey === "totals") return o.point == null ? null : { gid: "totals|" + o.point, line: o.point };
  if (o.point == null || !o.description || !/^(Over|Under)$/.test(o.name)) return null; // two-sided O/U props only
  return { gid: `${mkey}|${o.description}|${o.point}`, line: o.point, player: o.description };
}
function ingestApiEvent(e, league, existing) {
  const ev = existing || { id: e.id, league, home: e.home_team, away: e.away_team, start: Date.parse(e.commence_time), mmap: new Map() };
  for (const bk of e.bookmakers || []) {
    registerBook(bk.key, bk.title);
    for (const m of bk.markets || []) {
      const t = Date.parse(m.last_update || bk.last_update) || Date.now();
      for (const o of m.outcomes || []) {
        const g0 = groupKey(m.key, o, ev); if (!g0) continue;
        let g = ev.mmap.get(g0.gid);
        if (!g) { g = { id: g0.gid, key: m.key, cat: marketCat(m.key), line: g0.line, player: g0.player, order: [], out: {} }; ev.mmap.set(g0.gid, g); }
        if (!g.out[o.name]) { g.out[o.name] = { name: o.name, point: o.point, prices: {} }; g.order.push(o.name); }
        g.out[o.name].prices[bk.key] = { price: o.price, t };
      }
    }
  }
  return ev;
}
function finalizeEvent(ev) {
  if (ev.mmap) { ev.markets = [...ev.mmap.values()]; delete ev.mmap; }
  for (const g of ev.markets) {
    const rank = (n) => (n === ev.away || n === "Over" ? 0 : n === "Draw" ? 1 : n === ev.home || n === "Under" ? 2 : 3);
    g.order.sort((a, b) => rank(a) - rank(b));
  }
  return ev;
}

/* ---------------- live fetch: The Odds API v4 ---------------- */
async function oddsApi(path, params) {
  const qs = new URLSearchParams({ apiKey: S.settings.apiKey, oddsFormat: "american", ...params });
  const r = await fetch(`https://api.the-odds-api.com/v4/${path}?${qs}`);
  const rem = r.headers.get("x-requests-remaining"), used = r.headers.get("x-requests-used");
  if (rem != null) S.credits = { rem: +rem, used: +used };
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { const j = await r.json(); if (j.message) msg = j.message; } catch {}
    throw new Error(msg);
  }
  return r.json();
}
async function fetchLive() {
  const st = S.settings;
  if (!st.apiKey) throw new Error("Add your The Odds API key in Settings to load live odds.");
  const regions = st.regions.join(",");
  const events = [], errors = [];
  await Promise.all(st.leagues.map(async (lg) => {
    try {
      const data = await oddsApi(`sports/${lg}/odds`, { regions, markets: "h2h,spreads,totals" });
      const list = data.map((e) => ingestApiEvent(e, lg));
      if (st.props && PROP_MARKETS[lg]) {
        const upcoming = list.filter((e) => e.start > Date.now()).sort((a, b) => a.start - b.start).slice(0, st.propEvents);
        await Promise.all(upcoming.map(async (ev) => {
          try { ingestApiEvent(await oddsApi(`sports/${lg}/events/${ev.id}/odds`, { regions, markets: PROP_MARKETS[lg] }), lg, ev); }
          catch (e) { errors.push(leagueShort(lg) + " props: " + e.message); }
        }));
      }
      events.push(...list.map(finalizeEvent));
    } catch (e) { errors.push(leagueShort(lg) + ": " + e.message); }
  }));
  if (!events.length && errors.length) throw new Error(errors[0]);
  S.error = errors.length ? "Some requests failed — " + errors.slice(0, 3).join(" · ") : "";
  return events;
}
function creditEstimate() {

function round5(a) { return Math.abs(a) < 100 ? a : Math.round(a / 5) * 5; }

function demoFill(ev, g, p, isProp) {

function buildDemo() {
  seed = 20261030;

    americanfootball_nfl: { n: 8, sd: 13.5, spr: [1.5, 10.5], tot: [38.5, 51.5], kick: [0.2, 76] },
    americanfootball_ncaaf: { n: 6, sd: 16, spr: [2.5, 21.5], tot: [44.5, 64.5], kick: [-1, 30] },
    basketball_nba: { n: 8, sd: 12, spr: [1.5, 12.5], tot: [212.5, 238.5], kick: [-0.8, 50] },
    icehockey_nhl: { n: 6, hockey: true, kick: [1, 50] },
    soccer_epl: { n: 5, soccer: true, kick: [20, 70] },

  for (const [lg, c] of Object.entries(cfg)) {
    const teams = [...DEMO_TEAMS[lg]].sort(() => rnd() - 0.5);
    for (let i = 0; i < c.n && i * 2 + 1 < teams.length; i++) {
      const away = teams[i * 2], home = teams[i * 2 + 1];
      const startH = c.kick[0] + rnd() * (c.kick[1] - c.kick[0]);
      const ev = { id: `demo-${lg}-${i}`, league: lg, home, away, start: Math.round((now + startH * 3600e3) / 300e3) * 300e3, markets: [] };
      const mk = (key, gid, names, line, player, p) => { const g = { id: gid, key, cat: marketCat(key), line, player, order: names, out: {} }; names.forEach((n) => (g.out[n] = { name: n, point: null, prices: {} })); ev.markets.push(g); demoFill(ev, g, p, marketCat(key) === "props"); return g; };
      if (c.soccer) {
        const ph = 0.25 + rnd() * 0.4, pd = 0.22 + rnd() * 0.06;

        mk("totals", "totals|2.5", ["Over", "Under"], 2.5, null, [0.5 + gauss() * 0.06, 0]).truth;
        const t = ev.markets[ev.markets.length - 1]; t.truth[1] = 1 - t.truth[0]; demoFill(ev, t, t.truth, false);
      } else if (c.hockey) {
        const ph = 0.38 + rnd() * 0.28;

        const fav = ph > 0.5 ? home : away, favP = Math.max(ph, 1 - ph);
        const pl = -1.5 * (fav === home ? 1 : -1);
        const cover = 0.12 + (favP - 0.5) * 1.1;
        const g = mk("spreads", "spreads|" + pl, [away, home], pl, null, fav === home ? [1 - cover, cover] : [cover, 1 - cover]);
        g.out[home].point = pl; g.out[away].point = -pl;
        const tl = pick([5.5, 6.5]);

function thin(g) { for (const n of g.order) for (const b of Object.keys(g.out[n].prices)) if (b !== "pinnacle" && rnd() < 0.55) g.order.forEach((m) => delete g.out[m].prices[b]); }

/* live-feel: re-price a handful of book/markets every few seconds */
function demoTick() {
  const evs = S.events; if (!evs.length) return;
  const changed = {};
  for (let i = 0; i < 18; i++) {
    const ev = pick(evs), g = pick(ev.markets); if (!g.truth) continue;
    const books = Object.keys(g.out[g.order[0]].prices); if (!books.length) continue;
    const book = pick(books), sharp = SHARP_DEMO[book], isProp = g.cat === "props";
    if (sharp && rnd() < 0.3) { const d = gauss() * 0.006; g.truth = g.truth.map((x, j) => (j === 0 ? x + d : x - d / (g.truth.length - 1))); }

/* fair probabilities for one market from the weighted sharp books */
function fairFor(g) {
  const used = [];
  for (const [book, w] of Object.entries(F.sharp)) {
    if (!(w > 0)) continue;
    const prices = g.order.map((n) => g.out[n].prices[book]?.price);
    if (prices.some((p) => p == null)) continue;
    const q = prices.map(amToProb);
    used.push({ book, w, prices, q, hold: sum(q) - 1, m: Object.fromEntries(METHODS.map((m) => [m, DEVIG[m](q)])) });
  }
  if (!used.length || g.order.length < 2) return null;
  const W = sum(used.map((u) => u.w));
  const methods = {};
  for (const m of METHODS) methods[m] = g.order.map((_, i) => sum(used.map((u) => u.m[m][i] * u.w)) / W);
  const worst = g.order.map((_, i) => Math.min(...METHODS.map((m) => methods[m][i])));
  const hold = sum(used.map((u) => u.hold * u.w)) / W;
  return { used, methods, worst, hold, p: F.devig === "worst" ? worst : methods[F.devig] };
}

let OPPS = [], ARBS = [], LOWHOLD = [];
function analyze() {
  const opps = [], arbs = [], low = [];
  const mine = new Set(F.books);
  const leagueOk = (lg) => !F.leagues.length || F.leagues.includes(lg);
  const q = F.search.trim().toLowerCase();
  for (const ev of S.events) {
    const live = isLive(ev);
    for (const g of ev.markets) {
      const fair = fairFor(g);
      g.fair = fair;
      /* arbitrage / low hold across books (independent of fair odds) */
      if (g.order.length >= 2 && !(F.hideStarted && live)) {
        const legs = g.order.map((n) => {
          let best = null;
          for (const [b, v] of Object.entries(g.out[n].prices)) {
            if (F.arbMine && !mine.has(b)) continue;
            if (!best || amToDec(v.price) > amToDec(best.price)) best = { book: b, price: v.price, name: n };
          }
          return best;
        });
        if (legs.every(Boolean)) {
          const inv = sum(legs.map((l) => 1 / amToDec(l.price)));
          const item = { ev, g, legs, inv, roi: 1 / inv - 1 };
          if (inv < 1) arbs.push(item); else if (inv - 1 <= F.lowHold / 100) low.push(item);
        }
      }
      if (!fair) continue;
      g.order.forEach((name, i) => {
        const p = fair.p[i];
        const key = `${ev.id}|${g.id}|${name}`;
        let best = null; const all = [];
        for (const [b, v] of Object.entries(g.out[name].prices)) {
          if (!mine.has(b)) continue;
          const d = amToDec(v.price), e = p * d - 1;
          all.push({ book: b, price: v.price, ev: e, t: v.t });
          if (!best || d > amToDec(best.price)) best = { book: b, price: v.price, ev: e, t: v.t };
        }
        if (best) recordHist(key, p, best.price);
        if (!best) return;
        if (!leagueOk(ev.league) || !F.cats[g.cat] || (F.hideStarted && live)) return;

        if (best.ev * 100 < F.minEV || best.price < F.minOdds || best.price > F.maxOdds) return;
        if (S.hidden.has(key)) return;
        const label = betLabel(ev, g, name);
        if (q && !`${ev.home} ${ev.away} ${label} ${marketLabel(g.key)} ${leagueShort(ev.league)}`.toLowerCase().includes(q)) return;

          key, ev, g, name, i, label, p, fairAm: probToAm(p), book: best.book, price: best.price, dec: d, evp: best.ev,

}
function betLabel(ev, g, name) {
  const pt = g.out[name].point;

function devigNote(m) {

function detailHTML(o) {

    const pr = g.order.map((n) => g.out[n].prices[b]?.price);
    const hold = pr.every((x) => x != null) ? sum(pr.map(amToProb)) - 1 : null;

    return `<tr class="${b === o.book ? "sel" : ""}"><td>${bookChip(b)}${sharpSet.has(b) ? '<span class="tagsharp">SHARP</span>' : ""}${F.books.includes(b) ? "" : ' <span class="dim" style="font-size:10px">not yours</span>'}</td>
      ${pr.map((x, j) => `<td class="${x != null && amToDec(x) === bestByOut[j] ? "best" : ""} ${j === o.i && e > 0 ? "evp" : ""}">${fmtAm(x)}</td>`).join("")}
      <td class="dim">${hold == null ? "—" : fmtPct(hold)}</td><td class="${e > 0 ? "pos" : "neg"}">${e == null ? "—" : fmtEV(e)}</td></tr>`;
  }).join("");
  const short = (n) => (n === ev.home || n === ev.away ? n.split(" ").pop() : n);
  const mt = METHODS.map((m) => {
    const p = fair.methods[m][o.i];
    return `<tr class="${F.devig === m ? "sel" : ""}"><td>${METHOD_LABELS[m]}</td><td class="fairc">${fmtAm(probToAm(p))}</td><td>${fmtPct(p)}</td><td class="${p * o.dec - 1 > 0 ? "pos" : "neg"}">${fmtEV(p * o.dec - 1)}</td></tr>`;
  }).join("") + `<tr class="${F.devig === "worst" ? "sel" : ""}"><td><b>Worst case</b></td><td class="fairc">${fmtAm(probToAm(fair.worst[o.i]))}</td><td>${fmtPct(fair.worst[o.i])}</td><td class="${fair.worst[o.i] * o.dec - 1 > 0 ? "pos" : "neg"}">${fmtEV(fair.worst[o.i] * o.dec - 1)}</td></tr>`;
  const sharpDesc = fair.used.map((u) => `${bookName(u.book)} (${u.prices.map(fmtAm).join("/")}, w${u.w})`).join(", ");
  const full = F.bankroll * o.kelly;
  return `
  <div class="detail">
    <div class="dbox scroll-x">
      <h4><span>Market · ${esc(marketLabel(g.key))}${g.line != null && g.cat !== "h2h" ? " " + esc(g.cat === "spreads" ? fmtPt(g.line) + " (home)" : g.line) : ""}${g.player ? " · " + esc(g.player) : ""}</span><span>${books.size} books</span></h4>
      <table class="mini"><thead><tr><th>Book</th>${g.order.map((n) => `<th>${esc(short(n))}</th>`).join("")}<th>Hold</th><th>EV ${esc(short(o.name))}</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="dbox">
      <h4><span>Why it's +EV</span><span>${esc(METHOD_LABELS[F.devig])}</span></h4>
      <table class="mini"><thead><tr><th>Method</th><th>Fair</th><th>Win %</th><th>EV</th></tr></thead><tbody>${mt}</tbody></table>
      <p class="explain">Sharp source: <b>${esc(sharpDesc)}</b>. ${esc(bookName(o.book))} pays <b>${fmtAm(o.price)}</b> (implied ${fmtPct(1 / o.dec)}) on a bet the market says wins <b>${fmtPct(o.p)}</b> of the time.</p>
      <div class="formula">EV = ${o.p.toFixed(4)} × ${o.dec.toFixed(3)} − 1 = <span class="pos">${fmtEV(o.evp)}</span></div>
      <div class="formula">Kelly = (p·d − 1)/(d − 1) = ${fmtPct(o.kelly, 2)} → ${F.kelly}× = ${fmtMoney(full * F.kelly, 2)}${full * F.kelly > F.bankroll * F.maxStakePct / 100 ? ` <span class="dim">(capped ${F.maxStakePct}%)</span>` : ""}</div>
      ${sparkHTML(o.key)}
    </div>
  </div>`;
}
function sparkHTML(key) {
  const h = S.hist[key] || [];
  if (h.length < 2) return `<p class="note" style="margin-top:10px">Line movement appears here as prices update.</p>`;
  const vals = h.flatMap((x) => [probToAm(x.p), x.price]).map(amToDec);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 0.01;
  const W = 300, H = 60, pad = 4;
  const X = (i) => pad + (i / (h.length - 1)) * (W - pad * 2), Y = (d) => H - pad - ((d - lo) / span) * (H - pad * 2);
  const line = (f) => h.map((x, i) => `${X(i).toFixed(1)},${Y(f(x)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Price vs fair line movement">
    <polyline points="${line((x) => amToDec(probToAm(x.p)))}" fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" />
    <polyline points="${line((x) => amToDec(x.price))}" fill="none" stroke="var(--chart-1)" stroke-width="2" vector-effect="non-scaling-stroke" />
  </svg>
  <div class="legend"><span><i style="background:var(--chart-1)"></i>Best price at your books</span><span><i style="background:var(--chart-2)"></i>Fair line (dashed)</span><span>${h.length} updates</span></div>`;
}

function oddsTable() {
  const q = S.os.search.toLowerCase();
  const evs = S.events.filter((e) => e.league === S.os.league).sort((a, b) => a.start - b.start);
  const bookSet = new Set();
  const blocks = [];
  for (const ev of evs) {
    let gs = ev.markets.filter((g) => g.cat === S.os.cat);
    if (S.os.cat === "spreads" || S.os.cat === "totals") {
      const count = (g) => Object.keys(g.out[g.order[0]].prices).length;
      gs = gs.length ? [gs.reduce((a, b) => (count(b) > count(a) ? b : a))] : [];
    }
    for (const g of gs) {
      if (q && !`${ev.home} ${ev.away} ${g.player || ""}`.toLowerCase().includes(q)) continue;
      for (const n of g.order) for (const b in g.out[n].prices) bookSet.add(b);
      blocks.push({ ev, g });
    }
  }
  if (!blocks.length) return `<div class="empty"><b>Nothing to show</b>No ${S.os.cat === "props" ? "player props" : "markets"} for this league in the current data.</div>`;
  const sharp = new Set(Object.keys(F.sharp).filter((k) => F.sharp[k] > 0));
  const books = [...bookSet].sort((a, b) => (F.books.includes(b) - F.books.includes(a)) || (sharp.has(a) - sharp.has(b)) || bookName(a).localeCompare(bookName(b)));
  let html = `<table class="os"><thead><tr><th class="stick">${S.os.cat === "props" ? "Player · line" : "Event"}</th><th>BEST</th><th>FAIR</th>${books.map((b) => `<th title="${esc(bookName(b))}">${bookChip(b, false)}</th>`).join("")}</tr></thead><tbody>`;
  for (const { ev, g } of blocks) {
    const head = g.cat === "props" ? `${g.player} · ${marketLabel(g.key)} ${g.line}` : evTitle(ev);
    html += `<tr class="ev-h"><td class="stick"><span class="lg-tag">${esc(leagueShort(ev.league))}</span> ${esc(head)}</td><td colspan="${books.length + 2}" class="muted" style="font-weight:400;font-size:12px">${isLive(ev) ? '<span class="live-tag">LIVE</span> ' : ""}${fmtStart(ev.start)}${g.cat === "props" ? " · " + esc(evTitle(ev)) : ""}${g.fair ? ` · sharp hold ${fmtPct(g.fair.hold)}` : ""}</td></tr>`;
    g.order.forEach((n, i) => {
      const prices = g.out[n].prices;
      let best = null; for (const b in prices) if (!best || amToDec(prices[b].price) > amToDec(prices[best].price)) best = b;
      const p = g.fair?.p[i];
      html += `<tr><td class="stick">${esc(g.cat === "props" ? n + " " + g.line : betLabel(ev, g, n))}</td>
        <td class="px best">${best ? fmtAm(prices[best].price) : "—"}<span class="e" style="color:var(--muted)">${best ? esc(BOOKS[best]?.abbr || best) : ""}</span></td>
        <td class="fairc">${p ? fmtAm(probToAm(p)) : "—"}</td>
        ${books.map((b) => {
          const v = prices[b]; if (!v) return `<td class="px na">—</td>`;
          const e = p ? p * amToDec(v.price) - 1 : null;
          const fl = S.flash[`${ev.id}|${g.id}|${n}|${b}`];
          return `<td class="px ${b === best || amToDec(v.price) === amToDec(prices[best].price) ? "best" : ""} ${e > 0 ? "evp" : ""} ${fl === "up" ? "flash-up" : fl === "dn" ? "flash-dn" : ""}">${fmtAm(v.price)}${e > 0 ? `<span class="e">${fmtEV(e)}</span>` : ""}</td>`;
        }).join("")}</tr>`;
    });
  }
  return html + "</tbody></table>";
}

let chartPts = [];
function chartSVG(settled) {
  const s = settled.slice().sort((a, b) => (a.settledAt || a.t) - (b.settledAt || b.t));
  if (s.length < 2) return `<div class="empty" style="padding:40px 10px">Settle at least two bets to chart results.</div>`;
  let a = 0, x = 0;
  chartPts = [{ i: 0, a: 0, x: 0, b: null }].concat(s.map((b, i) => ({ i: i + 1, a: (a += profitOf(b)), x: (x += b.stake * b.evAtBet), b })));
  const W = 800, H = 220, L = 52, R = 12, T = 12, B = 24;
  const vals = chartPts.flatMap((p) => [p.a, p.x, 0]);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1) hi = lo + 1;
  const padv = (hi - lo) * 0.08; lo -= padv; hi += padv;
  const X = (i) => L + (i / (chartPts.length - 1)) * (W - L - R), Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi].map((v) => Math.round(v));
  const path = (k) => chartPts.map((p, j) => `${j ? "L" : "M"}${X(p.i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join("");
  return `<svg class="chart" id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative profit compared with expected profit">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-soft)" /><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--dim)" font-family="var(--mono)">${fmtMoney(v)}</text>`).join("")}
    <line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--dim)" stroke-width="1" />
    <path d="${path("x")}" fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke" />
    <path d="${path("a")}" fill="none" stroke="var(--chart-1)" stroke-width="2" vector-effect="non-scaling-stroke" />
    <line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none" />
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--dim)" font-family="var(--mono)">bet 1</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--dim)" font-family="var(--mono)">bet ${s.length}</text>
  </svg>`;
}
function bindChart() {
  const svg = $("#chart"), tip = $("#tip"), xh = $("#xh"); if (!svg) return;
  const move = (e) => {
    const r = svg.getBoundingClientRect(), W = 800, L = 52, R = 12;
    const vx = ((e.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(chartPts.length - 1, Math.round(((vx - L) / (W - L - R)) * (chartPts.length - 1))));
    const p = chartPts[i], px = L + (i / (chartPts.length - 1)) * (W - L - R);

      <div class="fgrid">${f("k-odds", "Odds", "+120")}${f("k-p", "Win probability %", "48.5")}${f("k-bank", "Bankroll $", F.bankroll)}${f("k-frac", "Kelly fraction", F.kelly)}</div><div class="out" id="k-out"></div></div>

const num = (id) => { const v = $("#" + id)?.value.trim(); return v === "" || v == null ? null : Number(v); };
const validAm = (a) => a != null && isFinite(a) && (a >= 100 || a <= -100);
const outs = (items) => items.map(([k, v, c]) => `<div><div class="k">${k}</div><div class="v ${c || ""}">${v}</div></div>`).join("");
function runCalcs(only) {
  const run = (k, fn) => { if (!only || only === k) fn(); };
  run("ev", () => {
    const o = num("ev-odds"), s1 = num("ev-s1"), s2 = num("ev-s2"), br = num("ev-bank") || 0;
    if (!validAm(o) || !validAm(s1) || !validAm(s2)) return ($("#ev-out").innerHTML = outs([["EV", "—"]]));
    const q = [amToProb(s1), amToProb(s2)], ps = METHODS.map((m) => DEVIG[m](q)[0]), p = Math.min(...ps), d = amToDec(o), e = p * d - 1;
    $("#ev-out").innerHTML = outs([["EV (worst)", fmtEV(e), e >= 0 ? "pos" : "neg"], ["Fair odds", fmtAm(probToAm(p)), "fairc"], ["Win prob", fmtPct(p)], ["Sharp hold", fmtPct(sum(q) - 1)], ["Quarter Kelly", fmtMoney(br * kellyFrac(p, d) * 0.25, 2)], ["EV per $100", fmtMoney(e * 100, 2)]]);
  });

    const os = [num("dv-1"), num("dv-2"), num("dv-3")].filter((x) => x != null);
    if (os.length < 2 || !os.every(validAm)) return ($("#dv-out").innerHTML = `<p class="note">Enter at least two valid American odds.</p>`);
    const q = os.map(amToProb);

      ${METHODS.map((m) => `<tr><td>${METHOD_LABELS[m]}</td>${DEVIG[m](q).map((p) => `<td><span class="fairc">${fmtAm(probToAm(p))}</span> <span class="dim">${fmtPct(p)}</span></td>`).join("")}</tr>`).join("")}
      </tbody></table><p class="note" style="margin-top:8px">Hold (vig): <b class="mono">${fmtPct(sum(q) - 1, 2)}</b></p>`;
  });
  run("kelly", () => {
    const o = num("k-odds"), p = (num("k-p") || 0) / 100, br = num("k-bank") || 0, fr = num("k-frac") || 0;
    if (!validAm(o) || !(p > 0 && p < 1)) return ($("#k-out").innerHTML = outs([["Stake", "—"]]));
    const d = amToDec(o), k = kellyFrac(p, d), e = p * d - 1;
    $("#k-out").innerHTML = outs([["Full Kelly", fmtPct(k, 2)], ["Your stake", fmtMoney(br * k * fr, 2), "pos"], ["EV", fmtEV(e), e >= 0 ? "pos" : "neg"], ["Break-even", fmtPct(1 / d)]]);

  });
}
function convFrom(src) {
  let d = null;

  if (src === "c-dec") { const x = num("c-dec"); if (x > 1) d = x; }
  if (src === "c-prob") { const p = num("c-prob"); if (p > 0 && p < 100) d = 100 / p; }
  if (!d) return;

  if (src !== "c-dec") $("#c-dec").value = d.toFixed(3);
  if (src !== "c-prob") $("#c-prob").value = (100 / d).toFixed(2);
  const gcd = (a, b) => (b ? gcd(b, a % b) : a); const n = Math.round((d - 1) * 100), g = gcd(n, 100);
  $("#c-frac").value = `${n / g}/${100 / g}`;
}

        <label class="field"><span>Player props (extra calls per event)</span><select id="set-props"><option value="0" ${!st.props ? "selected" : ""}>Off</option><option value="1" ${st.props ? "selected" : ""}>On</option></select></label>
        <label class="field"><span>Prop events per league</span><input id="set-pe" type="number" min="1" max="20" value="${st.propEvents}" /></label>
        <label class="field"><span>Auto-refresh (sec, 0 = off, min 30)</span><input id="set-ref" type="number" min="0" step="15" value="${st.refreshSec}" /></label>
        <label class="field"><span>Demo live ticks</span><select id="set-tick"><option value="1" ${st.liveTick ? "selected" : ""}>On</option><option value="0" ${!st.liveTick ? "selected" : ""}>Off</option></select></label>
      </div>
      <p class="note" id="credit-note"></p>
      <div><div class="label" style="margin-bottom:8px">Data</div><div class="toolbar" style="margin:0"><button class="btn sm danger" data-act="wipe">Clear tracked bets</button><button class="btn sm" data-act="reset-all">Reset all settings</button></div></div>
    </div>
    <div class="modal-f"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="save-settings">Save &amp; reload</button></div>`;
  S._draft = clone(st);
  updateCreditNote();
  $("#modal").classList.add("on"); $("#scrim").classList.add("on");
}
function updateCreditNote() {
  const n = $("#credit-note"); if (!n) return;
  const keep = S.settings; S.settings = S._draft; const c = creditEstimate(); S.settings = keep;
  n.innerHTML = `Estimated cost: <b class="mono">${c}</b> API credits per refresh (markets × regions per league${S._draft.props ? ", plus props per event" : ""}).`;
}
function closeModal() { $("#modal").classList.remove("on"); $("#scrim").classList.remove("on"); $("#filters")?.classList.remove("on"); }

/* ---------------- theme ---------------- */
function applyTheme() {
  const t = S.settings.theme;
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
}

/* ============================================================
   EVENTS
   ============================================================ */
function refilter(rerenderFilters) {
  saveF(); analyze();
  if (rerenderFilters) { const f = $("#filters"); if (f) { const sc = f.scrollTop, on = f.classList.contains("on"); f.innerHTML = filtersHTML(); f.scrollTop = sc; f.classList.toggle("on", on); } }
  renderNav();
  if (S.view === "ev") renderResults(); else if (S.view === "arb") $("#arb-body").innerHTML = arbBody();
}
const toggleIn = (arr, k) => (arr.includes(k) ? arr.filter((x) => x !== k) : [...arr, k]);
const oppByKey = (k) => OPPS.find((o) => o.key === k);

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (el.tagName === "INPUT" || el.tagName === "SELECT") return;
  switch (act) {
    case "view": S.view = el.dataset.v; LS.set("lbe.view", S.view); S.open.clear(); render(); window.scrollTo(0, 0); break;
    case "refresh": load(); break;
    case "theme": {
      const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      S.settings.theme = dark ? "light" : "dark"; saveS(); applyTheme(); renderStatus(); break;
    }
    case "settings": openSettings(); break;
    case "close-modal": closeModal(); break;
    case "filters": $("#filters").classList.toggle("on"); $("#scrim").classList.toggle("on", $("#filters").classList.contains("on")); break;
    case "expand": {
      e.stopPropagation();
      const key = el.dataset.key; S.open.has(key) ? S.open.delete(key) : S.open.add(key); renderResults(); break;
    }
    case "track": { e.stopPropagation(); const o = oppByKey(el.dataset.key); if (o) { trackOpp(o); renderResults(); renderNav(); } break; }
    case "hide": { e.stopPropagation(); S.hidden.add(el.dataset.key); LS.set("lbe.hidden", [...S.hidden]); analyze(); render(); toast("Hidden — restore from the toolbar"); break; }
    case "unhide": S.hidden.clear(); LS.set("lbe.hidden", []); analyze(); render(); break;
    case "sort": F.sort = k; saveF(); analyze(); render(); break;
    case "fset": { const f = el.dataset.f, v = el.dataset.val; F[f] = f === "kelly" ? Number(v) : v; refilter(true); break; }
    case "cat": F.cats[k] = !F.cats[k]; refilter(true); break;
    case "lg": {
      const present = [...new Set(S.events.map((x) => x.league))];
      let cur = F.leagues.length ? F.leagues : present;
      cur = toggleIn(cur, k); F.leagues = cur.length === present.length ? [] : cur; refilter(true); break;
    }
    case "lg-all": F.leagues = []; refilter(true); break;
    case "book": F.books = toggleIn(F.books, k); refilter(true); break;
    case "books-all": F.books = Object.keys(BOOKS).filter((b) => !(b in F.sharp) || F.books.includes(b)); refilter(true); break;
    case "books-none": F.books = []; refilter(true); break;
    case "reset-filters": Object.assign(F, clone(DEFAULT_FILTERS)); refilter(true); break;
    case "os-cat": S.os.cat = k; render(); break;
    case "tf": S.trackFilter = k; render(); break;
    case "del-bet": S.bets = S.bets.filter((b) => b.id !== el.dataset.id); saveBets(); render(); break;
    case "clear-close": { const b = S.bets.find((x) => x.id === el.dataset.id); if (b) { b.closeFair = null; b.manualClose = true; saveBets(); render(); } break; }
    case "export": exportCSV(); break;
    case "add-bet": openAddBet(); break;
    case "save-bet": saveManualBet(); break;
    case "mode": S._draft.mode = el.dataset.val; el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === el)); break;
    case "region": S._draft.regions = toggleIn(S._draft.regions, k); el.classList.toggle("on"); updateCreditNote(); break;
    case "set-league": S._draft.leagues = toggleIn(S._draft.leagues, k); el.classList.toggle("on"); updateCreditNote(); break;
    case "save-settings": {
      const d = S._draft;
      d.apiKey = $("#set-key").value.trim(); d.props = $("#set-props").value === "1"; d.propEvents = Math.max(1, +$("#set-pe").value || 4);
      d.refreshSec = Math.max(0, +$("#set-ref").value || 0); d.liveTick = $("#set-tick").value === "1";
      if (d.mode === "live" && !d.apiKey) { toast("Add an API key for live mode"); return; }
      S.settings = d; saveS(); closeModal(); S.hist = {}; load(); break;
    }
    case "wipe": if (confirm("Delete all tracked bets?")) { S.bets = []; saveBets(); closeModal(); render(); } break;
    case "reset-all": if (confirm("Reset settings and filters to defaults? Tracked bets are kept.")) { S.settings = clone(DEFAULT_SETTINGS); Object.assign(F, clone(DEFAULT_FILTERS)); saveS(); saveF(); applyTheme(); closeModal(); load(); } break;
  }
});
$("#scrim").addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "search") { F.search = el.value; saveF(); analyze(); renderResults(); renderNav(); return; }
  if (el.id === "os-search") { S.os.search = el.value; $("#os-body").innerHTML = oddsTable(); return; }
  if (el.dataset.f === "sharp") { F.sharp[el.dataset.b] = Number(el.value); el.nextElementSibling.textContent = Number(el.value).toFixed(1); refilter(false); return; }
  if (el.dataset.f && el.type === "number") {
    if (el.value === "" || isNaN(+el.value)) return;
    F[el.dataset.f] = Number(el.value); refilter(false); return;
  }
  const calc = el.closest("[data-calc]");
  if (calc) { if (calc.dataset.calc === "conv") convFrom(el.id); else runCalcs(calc.dataset.calc); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "sort") { F.sort = el.value; saveF(); analyze(); render(); return; }
  if (el.id === "os-league") { S.os.league = el.value; render(); return; }
  if (el.dataset.f && el.type === "checkbox") { F[el.dataset.f] = el.checked; refilter(false); if (S.view === "arb") render(); return; }
  if (el.id === "set-props" || el.id === "set-pe") { S._draft.props = $("#set-props").value === "1"; S._draft.propEvents = +$("#set-pe").value || 4; updateCreditNote(); return; }
  if (el.dataset.bf) {
    const b = S.bets.find((x) => x.id === el.dataset.id); if (!b) return;
    if (el.dataset.bf === "stake") b.stake = Math.max(0, +el.value || 0);
    if (el.dataset.bf === "status") { b.status = el.value; b.settledAt = el.value === "pending" ? null : Date.now(); }
    if (el.dataset.bf === "closeFair") { const v = +el.value; if (validAm(v)) b.closeFair = v; }
    saveBets(); render();
  }
});

/* manual bet entry */
function openAddBet() {
  const f = (id, l, v = "", t = "text") => `<label class="field"><span>${l}</span><input id="${id}" type="${t}" value="${v}" /></label>`;
  $("#modal").innerHTML = `
    <div class="modal-h"><b style="font-size:16px">Add bet</b><button class="icon-btn" data-act="close-modal" aria-label="Close">${ICON.x}</button></div>
    <div class="modal-b"><div class="fgrid">
      ${f("mb-event", "Event", "", "text")}${f("mb-league", "League", "NFL")}
      ${f("mb-bet", "Bet", "")}${f("mb-market", "Market", "Moneyline")}
      <label class="field"><span>Book</span><select id="mb-book">${Object.keys(BOOKS).map((k) => `<option value="${k}">${esc(bookName(k))}</option>`).join("")}</select></label>
      ${f("mb-stake", "Stake $", "10", "number")}${f("mb-odds", "Odds", "-110")}${f("mb-fair", "Fair odds (optional)", "")}
    </div></div>
    <div class="modal-f"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="save-bet">Add bet</button></div>`;
  $("#modal").classList.add("on"); $("#scrim").classList.add("on");
}
function saveManualBet() {
  const odds = num("mb-odds"), fair = num("mb-fair");
  if (!validAm(odds)) { toast("Enter valid American odds"); return; }
  const fa = validAm(fair) ? fair : odds;
  S.bets.push({ id: Math.random().toString(36).slice(2, 10), t: Date.now(), league: $("#mb-league").value || "—", event: $("#mb-event").value || "—", start: 0,
    market: $("#mb-market").value, bet: $("#mb-bet").value || "—", book: $("#mb-book").value, odds, fairAtBet: fa, evAtBet: amToProb(fa) * amToDec(odds) - 1,
    stake: Math.max(0, num("mb-stake") || 0), status: "pending", closeFair: null });
  saveBets(); closeModal(); render(); toast("Bet added");
}

/* keep the "updated Xs ago" pill and row ages honest */
setInterval(() => { const a = $("#age"); if (a && S.updated) a.textContent = "updated " + fmtAge(S.updated) + " ago" + (S.credits ? " · " + S.credits.rem + " credits" : ""); }, 5000);

/* ---------------- boot ---------------- */
applyTheme();
render();
load();
</script>
</body>
