<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RUGGED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0a0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to corners; the PC is a full-screen OS window. */
:root {
  --bg: #0c0a0f; --panel: #15121a; --panel-2: #1d1924; --line: #2c2634; --line-2: #3a3244;
  --text: #efe6da; --mut: #a0958a; --dim: #6c635c;
  --bulb: #ffb547; --bulb-ink: #2a1a05; --up: #2fd082; --down: #f04a5c; --chirp: #5aa9ff; --violet: #b07cff;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
kbd { font-family: var(--mono); font-size: 0.8em; background: var(--panel-2); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }
.mut { color: var(--mut); } .up { color: var(--up); } .down { color: var(--down); }
.hint { color: var(--mut); font-size: 0.86rem; line-height: 1.45; margin: 8px 0 0; }
.warn { color: #ffcf7a; background: #3a2a10; border: 1px solid #5a4218; padding: 8px 10px; border-radius: 6px; font-size: 0.88rem; }
.logo { font-family: var(--display); font-weight: 400; letter-spacing: 0.04em; color: var(--bulb); text-shadow: 0 0 24px rgba(255,181,71,0.35), 0 4px 0 #6a3b00; margin: 0; }

/* buttons */
.btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 0.92rem; transition: background .12s, border-color .12s, transform .06s; }
.btn:hover:not(:disabled) { border-color: var(--bulb); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--bulb); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--bulb); color: var(--bulb-ink); border-color: var(--bulb); }
.btn.good { background: #123524; border-color: #1f6a43; color: #c9f5dc; }
.btn.sell { background: #2a1418; border-color: #5a2a33; color: #ffd0d6; }
.btn.rug { background: #b8263a; border-color: #e0475b; color: #fff; }
.btn.ghost { background: transparent; }
.btn.big { padding: 13px 18px; font-size: 1.05rem; }
.btn.small { padding: 6px 9px; font-size: 0.8rem; }
.btn.wide { width: 100%; margin-top: 8px; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
body:not(.playing) #hud, body.in-pc #hud > :not(#toasts) { display: none; }
.hud-tl { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 8px; max-width: min(340px, 60vw); padding: 10px 12px; border-radius: 10px; background: linear-gradient(180deg, rgba(8,7,10,0.62), rgba(8,7,10,0.35)); backdrop-filter: blur(3px); }
.money b { font-family: var(--mono); font-size: 1.55rem; font-weight: 600; text-shadow: 0 2px 8px #000; }
.money span { display: block; font-family: var(--mono); color: var(--mut); font-size: 0.85rem; }
.social { display: flex; gap: 12px; font-size: 0.82rem; color: var(--mut); text-shadow: 0 1px 4px #000; }
.social b { color: var(--text); font-family: var(--mono); }
#h-cred[data-level=bad] { color: var(--down); } #h-cred[data-level=warn] { color: #ffcf7a; }
.energy label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--mut); }
.bar { height: 6px; width: 160px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #7dff3a, #2fd082); transition: width .3s; }
#objective { font-size: 0.86rem; background: rgba(12,10,15,0.72); border-left: 3px solid var(--bulb); padding: 7px 10px; border-radius: 0 6px 6px 0; line-height: 1.35; }
#objective:empty { display: none; }
#objective span { display: block; font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bulb); }
.hud-tr { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); text-align: right; text-shadow: 0 2px 6px #000; }
.hud-tr b { font-family: var(--display); font-weight: 400; display: block; font-size: 1.05rem; color: var(--bulb); }
.hud-tr span { font-family: var(--mono); color: var(--mut); font-size: 0.85rem; }
#coinbar { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.tick { display: flex; align-items: center; gap: 6px; background: rgba(12,10,15,0.8); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px 3px 4px; font-family: var(--mono); font-size: 0.78rem; }
.tick .ci { border-radius: 50%; }
.tick i { font-style: normal; } .tick.up i { color: var(--up); } .tick.down i { color: var(--down); }
#crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
#prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); background: rgba(12,10,15,0.82); border: 1px solid var(--line-2); padding: 7px 12px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
#subtitle { position: absolute; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); transform: translateX(-50%); max-width: min(720px, 88vw); background: rgba(12,10,15,0.85); padding: 10px 16px; border-radius: 8px; text-align: center; line-height: 1.4; }
#subtitle b { color: var(--bulb); margin-right: 6px; }
#toasts { position: absolute; top: max(70px, calc(env(safe-area-inset-top) + 60px)); right: max(16px, env(safe-area-inset-right)); display: grid; gap: 8px; width: min(360px, 70vw); z-index: 40; }
body.in-pc #toasts { top: auto; bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px)); right: max(28px, calc(env(safe-area-inset-right) + 18px)); }
.toast { background: rgba(21,18,26,0.95); border: 1px solid var(--line-2); border-left: 3px solid var(--chirp); padding: 9px 12px; border-radius: 6px; font-size: 0.86rem; line-height: 1.35; animation: tin .25s ease-out; }
.toast.good { border-left-color: var(--up); } .toast.bad { border-left-color: var(--down); }
.toast.out { opacity: 0; transform: translateX(20px); transition: all .5s; }
@keyframes tin { from { opacity: 0; transform: translateX(20px); } }

/* touch */
#touch { position: absolute; inset: 0; touch-action: none; }
body:not(.playing) #touch, body.in-pc #touch { display: none; }
#stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.35); transform: translate(-50%,-50%); }
.tbtns { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); display: flex; gap: 10px; align-items: flex-end; }
.tbtns button { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(21,18,26,0.85); font-size: 1.3rem; }
#use-btn { width: 78px; height: 78px; background: var(--bulb); color: var(--bulb-ink); font-weight: 700; font-size: 1rem; }

/* PC */
#pc { position: absolute; inset: 0; z-index: 20; background: radial-gradient(ellipse at 50% 40%, #1a1622 0%, #08070a 75%); padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); animation: pcin .3s ease-out; }
@keyframes pcin { from { opacity: 0; transform: scale(0.98); } }
.pc-frame { height: 100%; display: flex; flex-direction: column; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 6px #050407, 0 30px 80px rgba(0,0,0,0.6); }
.pc-bar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.os { font-family: var(--display); color: var(--bulb); font-size: 1rem; }
.os span { color: var(--mut); font-size: 0.7em; margin-left: 2px; }
#pc-bal { display: flex; gap: 12px; font-family: var(--mono); font-size: 0.85rem; color: var(--mut); flex-wrap: wrap; }
#pc-bal b { color: var(--text); }
#pc-clock { margin-left: auto; font-family: var(--mono); color: var(--mut); font-size: 0.85rem; }
.pc-body { flex: 1; display: flex; min-height: 0; }
#pc-dock { width: 92px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; overflow-y: auto; }
.dock-btn { background: transparent; border: 0; border-radius: 8px; padding: 8px 4px; cursor: pointer; display: grid; justify-items: center; gap: 3px; color: var(--mut); }
.dock-btn span { font-size: 1.35rem; } .dock-btn em { font-style: normal; font-size: 0.72rem; font-weight: 600; }
.dock-btn.on, .dock-btn:hover { background: var(--panel-2); color: var(--text); }
.dock-btn.on em { color: var(--bulb); }
#pc-main { flex: 1; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right)) 24px 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card h4 { margin: 0 0 8px; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
.card h4 + h4, .card .row4 + h4, .card .row2 + h4, .card .btn.wide + h4 { margin-top: 12px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 0.9rem; }
.kv:last-of-type { border-bottom: 0; }
.kv b { font-family: var(--mono); font-weight: 600; text-align: right; }
.kv small { color: var(--mut); font-weight: 400; margin-left: 4px; }
.kv .hi { color: var(--bulb); }
.row2, .row3, .row4 { display: grid; gap: 6px; margin-top: 6px; }
.row2 { grid-template-columns: repeat(2, 1fr); } .row3 { grid-template-columns: repeat(3, 1fr); } .row4 { grid-template-columns: repeat(4, 1fr); }
.empty { text-align: center; padding: 50px 16px; display: grid; justify-items: center; gap: 10px; }
.empty h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--bulb); }
.ci { border-radius: 50%; flex: none; }
.coin-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.ctab { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px 4px 4px; cursor: pointer; font-family: var(--mono); font-size: 0.85rem; }
.ctab.on { border-color: var(--bulb); }

/* terminal */
.term { display: grid; gap: 10px; }
.term-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tname { min-width: 0; } .tname b { display: block; font-size: 1.2rem; } .tname span { color: var(--mut); font-size: 0.85rem; }
.tstats { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.tstats label { display: block; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.tstats b { font-family: var(--mono); font-size: 1.02rem; }
.risk { padding: 1px 8px; border-radius: 10px; font-size: 0.9rem; }
.r1 { background: #12351f; color: var(--up); } .r2 { background: #3a2a10; color: #ffcf7a; } .r3 { background: #3d1218; color: var(--down); }
.curve { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--mut); }
.curve-bar { flex: 1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.curve-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--bulb), var(--up)); }
.term-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 10px; }
.chart-box { position: relative; background: #0b0d12; border: 1px solid var(--line); border-radius: 10px; min-height: 320px; overflow: hidden; }
#t-chart { position: absolute; inset: 0; width: 100%; height: 100%; }
.mood { position: absolute; left: 10px; top: 8px; font-size: 0.8rem; color: var(--mut); background: rgba(11,13,18,0.8); padding: 2px 8px; border-radius: 10px; }
.side { display: grid; gap: 10px; align-content: start; }
.rugmeter { margin-top: 10px; }
.rugmeter > div { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.rugmeter i { display: block; height: 100%; background: var(--up); }
.rugmeter > div[data-level=warn] i { background: #ffcf7a; } .rugmeter > div[data-level=bad] i { background: var(--down); }
.rugmeter span { font-size: 0.78rem; color: var(--mut); }
.feed #t-trades { display: grid; gap: 2px; font-family: var(--mono); font-size: 0.8rem; }
.trade { display: grid; grid-template-columns: 44px minmax(0, 1.2fr) minmax(0, 1fr) 90px 70px; gap: 8px; padding: 3px 4px; border-radius: 4px; align-items: center; }
.trade b, .trade em { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; font-style: normal; }
.trade em { color: var(--chirp); font-size: 0.75rem; }
.trade.buy span { color: var(--up); } .trade.sell span { color: var(--down); }
.trade.dev { background: #2d220e; } .trade.dev b { color: var(--bulb); font-weight: 600; }
.trade i { font-style: normal; text-align: right; } .trade small { color: var(--dim); text-align: right; }

/* pumpbin */
.pb-head h2, .shop h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--bulb); font-size: 1.5rem; }
.pb-head p { margin: 4px 0 12px; color: var(--mut); }
.meta { color: var(--violet); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 12px; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--mut); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.seg button:disabled { opacity: 0.5; cursor: not-allowed; }
.seg.small { margin: 10px 0 0; }
.pb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pb-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 10px 0; }
.memes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
.meme { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.meme img { width: 42px; height: 42px; }
.meme em { font-style: normal; font-size: 0.68rem; color: var(--mut); }
.meme i { position: absolute; top: -6px; right: -4px; font-style: normal; font-size: 0.58rem; background: var(--violet); color: #fff; padding: 1px 4px; border-radius: 4px; font-weight: 700; }
.meme.on { border-color: var(--bulb); background: #2a2010; }
.fld { display: grid; gap: 5px; font-size: 0.85rem; color: var(--mut); margin-top: 10px; }
.fld b { color: var(--text); font-family: var(--mono); }
.fld input:not([type=range]), .fld select { background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 9px 10px; color: var(--text); font: 600 1rem var(--ui); }
.fld input:focus, .fld select:focus { outline: 2px solid var(--bulb); outline-offset: 1px; }
input[type=range] { width: 100%; accent-color: var(--bulb); }
.launch { display: grid; gap: 6px; align-content: start; }
.preview { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.preview img { width: 64px; height: 64px; }
.preview b { display: block; font-size: 1.1rem; } .preview span { font-family: var(--mono); color: var(--mut); }

/* chirp */
.chirp { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.chirp .profile, .chirp .compose { grid-column: span 1; }
.profile { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-size: 1.5rem; }
.profile b { display: block; } .profile span { font-size: 0.85rem; color: var(--mut); }
.reach { margin-left: auto; text-align: right; } .reach label { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); display: block; } .reach b { font-family: var(--mono); font-size: 1.3rem; color: var(--chirp); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 5px 11px; cursor: pointer; font-size: 0.84rem; font-weight: 600; }
.chip.on { border-color: var(--chirp); color: #cfe5ff; background: #142438; }
.compose .btn.primary { margin-top: 8px; background: var(--chirp); border-color: var(--chirp); color: #04121f; }
.kols { display: grid; gap: 6px; }
.kol { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kol span { grid-column: 1; font-size: 0.78rem; color: var(--mut); }
.kol em { font-style: normal; font-family: var(--mono); grid-row: 1 / span 2; grid-column: 2; }
.kol .btn { grid-row: 1 / span 2; grid-column: 3; }
.kol.locked { opacity: 0.55; }
.timeline > div { display: grid; gap: 8px; }
.post, .fpost { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--panel-2); }
.post.viral { border-color: var(--bulb); } .post.ratio { border-color: #5a2a33; }
.post .ph { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; } .post .ph span { color: var(--mut); }
.post p, .fpost p { margin: 5px 0; line-height: 1.4; }
.eng { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 0.76rem; color: var(--mut); }
.fpost b { color: var(--chirp); font-size: 0.82rem; } .fpost.bad b { color: var(--down); } .fpost.good b { color: var(--up); }

/* tele / radar / wallet / shop / wiki / history */
.tele { display: grid; gap: 10px; }
.msgs { height: 46vh; min-height: 220px; overflow-y: auto; display: grid; align-content: start; gap: 4px; font-size: 0.9rem; }
.msg { display: flex; gap: 8px; } .msg b { color: var(--chirp); flex: none; } .msg.dev b { color: var(--bulb); }
.radar { display: grid; gap: 10px; }
.score { display: flex; gap: 16px; align-items: center; }
.score h3 { margin: 0 0 4px; } .score p { margin: 0; color: var(--mut); }
.dial { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--line-2); display: grid; place-items: center; align-content: center; flex: none; }
.dial b { font-family: var(--mono); font-size: 1.9rem; padding: 0 10px; border-radius: 10px; } .dial span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mut); }
.flag { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.flag i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--up); }
.flag.warn i { background: #ffcf7a; } .flag.bad i { background: var(--down); }
.flag p { margin: 2px 0 0; color: var(--mut); font-size: 0.85rem; }
.bal { display: flex; flex-wrap: wrap; gap: 22px; }
.bal label { display: block; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.bal b { font-family: var(--mono); font-size: 1.25rem; } .bal span { display: block; color: var(--mut); font-size: 0.8rem; }
.logl { font-size: 0.86rem; padding: 4px 0; border-bottom: 1px dashed var(--line); } .logl span { color: var(--dim); font-family: var(--mono); margin-right: 8px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 8px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: space-between; }
.item .ih { display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.item .cat { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

  liquiditySol() { return this.phase === 'curve' ? this.realSol : this.poolSol; }
  isLive() { return this.phase === 'curve' || this.phase === 'dex'; }
  devTokens() { return this.dev.main.tokens; }

  quoteSell(tokIn) {
    if (tokIn <= 0) return 0;
    if (this.phase === 'curve') {
      const k = this.vSol * this.vTok;
      return Math.min(this.vSol - k / (this.vTok + tokIn), this.realSol) * (1 - CURVE_FEE);
    }
    if (this.phase === 'dex' && this.poolTok > 0) {
      const k = this.poolSol * this.poolTok;
      return (this.poolSol - k / (this.poolTok + tokIn)) * (1 - DEX_FEE);
    }
    return 0;
  }
  quoteBuy(solIn) {
    if (this.phase === 'curve') {
      const net = solIn * (1 - CURVE_FEE), k = this.vSol * this.vTok;
      return Math.min(this.vTok - k / (this.vSol + net), this.curveTokLeft);
    }
    if (this.phase === 'dex') {
      const net = solIn * (1 - DEX_FEE), k = this.poolSol * this.poolTok;
      return this.poolTok - k / (this.poolSol + net);
    }
    return 0;
  }

  // ---------- core swaps ----------
  _buy(solIn) {
    if (solIn <= 0) return { tokens: 0, sol: 0 };
    if (this.phase === 'curve') {
      let net = solIn * (1 - CURVE_FEE);
      const k = this.vSol * this.vTok;
      let out = this.vTok - k / (this.vSol + net);
      if (out >= this.curveTokLeft) {
        out = this.curveTokLeft;
        net = k / (this.vTok - out) - this.vSol;
        solIn = net / (1 - CURVE_FEE);
      }
      this.vSol += net; this.vTok -= out; this.realSol += net; this.curveTokLeft -= out;
      this.volume += solIn;
      if (this.curveTokLeft <= 1) this._graduate();
      return { tokens: out, sol: solIn };
    }
    if (this.phase === 'dex') {
      const net = solIn * (1 - DEX_FEE);
      const k = this.poolSol * this.poolTok;
      const out = this.poolTok - k / (this.poolSol + net);
      this.poolSol += net; this.poolTok -= out;
      this.volume += solIn;
      return { tokens: out, sol: solIn };
    }
    return { tokens: 0, sol: 0 };
  }
  _sell(tokIn) {
    if (tokIn <= 0) return 0;
    if (this.phase === 'curve') {
      const k = this.vSol * this.vTok;
      const out = Math.min(this.vSol - k / (this.vTok + tokIn), this.realSol);
      this.vSol -= out; this.vTok += tokIn; this.realSol -= out; this.curveTokLeft += tokIn;
      this.volume += out;
      return out * (1 - CURVE_FEE);
    }
    if (this.phase === 'dex' && this.poolTok > 0) {
      const k = this.poolSol * this.poolTok;
      const out = this.poolSol - k / (this.poolTok + tokIn);
      this.poolSol -= out; this.poolTok += tokIn;
      this.volume += out;
      return out * (1 - DEX_FEE);
    }
    return 0;
  }

  _graduate() {
    this.phase = 'dex'; this.graduated = true;
    this.poolSol = Math.max(1, this.realSol - MIGRATION_FEE);
    this.poolTok = LP_TOK;
    this.realSol = 0;
    this.lp = 'burned';
    this.attnImp += 1.1;
    this._event('graduated', `$${this.ticker} graduated! ${fmtSOL(this.poolSol)} SOL + ${fmtNum(LP_TOK)} tokens seeded a DEX pool. LP tokens burned.`);
    this._burstChat('grad', 4);
  }

  // ---------- bookkeeping ----------
  _event(type, text, data = {}) { this.events.push({ type, text, t: this.t, ...data }); }
  _trade(side, sol, tokens, who) {
    const mc = this.mcapSol();
    this.trades.push({ t: this.t, side, sol, tokens, who: who.handle || shortAddr(who.addr || fakeAddr()), type: who.type || '', via: who.via || '', dev: !!who.dev, mcap: mc });
    if (this.trades.length > 80) this.trades.splice(0, this.trades.length - 80);
    this.recentVol.push([this.t, sol]);
    if (!who.dev) this.creatorFees += sol * CREATOR_FEE;
    if (side === 'buy' && !who.dev) this.recentBuys.push([this.t, sol]);
    this.lastTradeT = this.t;
    this._mark(mc, sol);
  }
  _mark(mc, vol = 0) {
    const ci = Math.floor(this.t / CANDLE_SEC);
    let c = this.candles[this.candles.length - 1];
    if (!c || c.i !== ci) {
      const o = c ? c.c : mc;
      // fill gaps so the chart has a continuous time axis
      if (c) for (let i = c.i + 1; i < ci; i++) this.candles.push({ i, o: c.c, h: c.c, l: c.c, c: c.c, v: 0 });
      c = { i: ci, o, h: Math.max(o, mc), l: Math.min(o, mc), c: mc, v: 0 };
      this.candles.push(c);
      if (this.candles.length > 400) this.candles.splice(0, this.candles.length - 400);
    }
    c.c = mc; c.h = Math.max(c.h, mc); c.l = Math.min(c.l, mc); c.v += vol;
    if (mc > this.athMcap) this.athMcap = mc;
  }
  _say(who, text, kind = 'holder') {
    this.chat.push({ t: this.t, who, text, kind });
    if (this.chat.length > 120) this.chat.splice(0, this.chat.length - 120);
  }
  _burstChat(mood, n, extra) {
    for (let i = 0; i < n; i++) {
      const txt = chatFill(pick(CHAT[mood]), this, extra);
      setTimeoutSim(this, rand(0.2, 4), () => this._say(pick(HANDLES), txt));
    }
  }

  _newHolder(type, r, extra = {}) {
    const cfg = TT[type];
    const h = {
      addr: fakeAddr(), handle: chance(0.55) ? pick(HANDLES) : null, type,
      tokens: r.tokens, cost: r.sol, proceeds: 0, avg: r.sol / r.tokens,
      tp: rand(cfg.tp[0], cfg.tp[1]), sl: rand(cfg.sl[0], cfg.sl[1]),
      hold: rand(cfg.hold[0], cfg.hold[1]), paper: cfg.paper, born: this.t, failed: false, ...extra,
    };
    this.holders.push(h);
    return h;
  }
  _spawnBuyer(type, sol, extra) {
    if (!this.isLive()) return null;
    const r = this._buy(sol);
    if (r.tokens <= 0) return null;
    const h = this._newHolder(type, r, extra);
    this._trade('buy', r.sol, r.tokens, h);
    if (type === 'whale') this._event('whale', `🐋 Whale bought ${fmtSOL(r.sol)} SOL of $${this.ticker}`);
    return h;
  }
  _holderSell(h, frac) {
    const tk = h.tokens * frac;
    const sol = this._sell(tk);
    h.tokens -= tk; h.proceeds += sol;
    this._trade('sell', sol, tk, h);
    if (h.tokens < 1) {
      h.tokens = 0;
      const pnl = h.proceeds - h.cost;
      this.exited.count++;
      if (pnl < 0) { this.exited.lossCount++; this.exited.lossSol -= pnl; } else this.exited.gainSol += pnl;
    }
  }

  // ---------- RugRadar ----------
  risk() {
    const flags = [];
    let s = 0;
    const add = (pts, level, label, detail) => { s += pts; flags.push({ level, label, detail }); };
    add(0, 'ok', 'Mint authority', 'Revoked: nobody can print more tokens.');
    if (this.phase === 'curve') add(0, 'ok', 'Liquidity', 'On bonding curve. LP will be burned automatically at graduation.');
    else if (this.lp === 'burned') add(0, 'ok', 'Liquidity: BURNED', 'LP tokens were sent to a burn address. Liquidity can never be pulled.');
    else if (this.lp === 'locked') {
      const left = this.lockUntil - this.t;
      add(left < 120 ? 18 : 8, left < 120 ? 'warn' : 'warn', `Liquidity: LOCKED (${fmtDur(left)} left)`, 'LP tokens are in a time-lock. When it expires the dev can pull everything. Short locks are a red flag.');
    } else if (this.phase === 'dex') add(34, 'bad', 'Liquidity: NOT LOCKED', 'The dev holds the LP tokens and can remove all liquidity at any moment (a "hard rug").');
    const devPct = this.dev.main.tokens / this.supply;
    if (devPct > 0.1) add(18, 'bad', `Dev holds ${fmtPct(devPct, false)}`, 'A big dev bag can be dumped on buyers.');
    else if (devPct > 0.04) add(9, 'warn', `Dev holds ${fmtPct(devPct, false)}`, 'Moderate dev holdings.');
    else add(0, 'ok', `Dev holds ${fmtPct(devPct, false)}`, 'Small or no dev bag.');
    const top = this.top10Pct();
    if (top > 0.4) add(14, 'bad', `Top 10 holders: ${fmtPct(top, false)}`, 'Supply is concentrated. A few wallets can crash the price.');
    else if (top > 0.25) add(7, 'warn', `Top 10 holders: ${fmtPct(top, false)}`, 'Somewhat concentrated supply.');
    else add(0, 'ok', `Top 10 holders: ${fmtPct(top, false)}`, 'Healthy distribution.');
    if (this.dev.soldAny) add(16, 'bad', `Dev sold ${fmtPct(Math.min(1, this.dev.soldFrac), false)} of bag`, 'The creator wallet is selling.');
    if (this.devHistory > 0) add(Math.min(36, 12 * this.devHistory), 'bad', `Dev wallet linked to ${this.devHistory} previous rug${this.devHistory > 1 ? 's' : ''}`, 'On-chain history never forgets.');
    if (this.t < 60 && this.isLive()) add(4, 'warn', 'Brand new token', 'Launched less than a minute ago.');
    return { score: clamp(Math.round(s), 0, 100), flags };
  }
  top10Pct() {
    const bags = this.holders.map((h) => h.tokens);
    bags.push(this.dev.main.tokens);
    bags.sort((a, b) => b - a);
    let s = 0; for (let i = 0; i < 10 && i < bags.length; i++) s += bags[i];
    return s / this.supply;
  }
  holderCount() {
    let n = 0; for (const h of this.holders) if (h.tokens > 0) n++;
    if (this.dev.main.tokens > 0) n++;
    return n;
  }

  // ---------- tick ----------
  tick(dt, env) {
    if (this.ended) return;
    this.t += dt;
    runSimTimers(this);
    const price0 = this.price();

    // price history (1s samples) for momentum
    this._phTimer -= dt;
    if (this._phTimer <= 0) {
      this._phTimer = 1; this.priceHist.push(price0);
      if (this.priceHist.length > 90) this.priceHist.shift();
      this._mark(this.mcapSol(), 0);
      const cut = this.t - 30;
      while (this.recentVol.length && this.recentVol[0][0] < cut) this.recentVol.shift();
      while (this.recentBuys.length && this.recentBuys[0][0] < cut) this.recentBuys.shift();
      const bh = this.holderCount(); if (bh > this.peakHolders) this.peakHolders = bh;
    }

    // lock expiry
    if (this.lp === 'locked' && this.t >= this.lockUntil) {
      this.lp = 'dev'; this.panic = Math.min(1, this.panic + 0.35);
      this._event('unlock', `LP lock on $${this.ticker} expired. You control the liquidity again.`);
      this._burstChat('unlock', 3);
    }
    if (!this.isLive()) return;

    // snipers
    while (this.snipeQueue.length && this.snipeQueue[0].at <= this.t) {
      const s = this.snipeQueue.shift();
      const h = this._spawnBuyer('sniper', s.sol);
      if (h && chance(0.6)) { h.hold = rand(2, 9); h.tp = rand(1.05, 1.35); }
    }
    // KOL pipeline
    for (const k of this.kolQueue) {
      if (k.stage === 0 && this.t >= k.buyAt) {
        k.stage = 1;
        this._spawnBuyer('kol', k.kol.bag, { handle: null, kolName: k.kol.handle });
      }
      if (k.stage === 1 && this.t >= k.postAt) {
        k.stage = 2;
        const reach = k.kol.reach * (0.75 + 0.5 * this.memeScore) * env.sentiment;
        this.attnImp += reach * 0.55; this.kolBoost += reach;
        this._event('kol', `${k.kol.handle} posted about $${this.ticker} to ${fmtNum(k.kol.followers)} followers.`);
        this._burstChat('kol', 4, { k: k.kol.handle });
      }
    }
    this.kolQueue = this.kolQueue.filter((k) => k.stage < 2);

    // attention dynamics
    this.attnImp *= Math.exp(-dt / 55);
    this.panic *= Math.exp(-dt / 16);
    this.kolBoost *= Math.exp(-dt / 22);
    this.chirpBoost *= Math.exp(-dt / 26);
    this.chirpSize = 1 + (this.chirpSize - 1) * Math.exp(-dt / 60);
    const vol30 = this.recentVol.reduce((a, v) => a + v[1], 0);
    const buy30 = this.recentBuys.reduce((a, v) => a + v[1], 0);
    const novelty = Math.exp(-this.t / 210);
    this.attnTrend = 0.32 * Math.tanh(buy30 / 70) * this.memeScore * novelty;
    if (chance(dt * Math.max(0, this.memeScore - 0.85) * 0.006 * env.sentiment)) {
      this.attnImp += rand(0.5, 1.2);
      this._event('viral', `$${this.ticker} is going viral on Chirp! Organic buyers incoming.`);
      this._burstChat('pump', 3);
    }
    if (!this.kothDone && this.phase === 'curve' && this.progress() >= 0.5) {
      this.kothDone = true; this.attnImp += 0.45;
      this._event('koth', `$${this.ticker} hit King of the Hill on PumpBin (50% of curve). Front page visibility!`);
    }

    // momentum / FOMO
    const ph = this.priceHist;
    const p20 = ph.length > 20 ? ph[ph.length - 21] : ph[0] || price0;
    const mom = price0 / Math.max(1e-18, p20);
    const fomo = clamp(1 + 0.8 * (mom - 1), 0.35, 1.9);
    const risk = this.risk().score;
    const mcNow = this.mcapSol();
    const ddF = 0.3 + 0.7 * Math.sqrt(clamp(mcNow / Math.max(1e-9, this.athMcap), 0, 1));
    let base = (this.attnImp + this.attnTrend + 0.02 * novelty) * env.sentiment * fomo * ddF * (1 - 0.85 * this.panic);
    if (this.dead) base = this.attnImp > 0.3 ? base : 0;
    const liqF = clamp(this.liquiditySol() / 80, 0.15, 2.5);

    for (const type of ['degen', 'smart', 'whale', 'diamond']) {
      const cfg = TT[type];
      const trust = clamp(1 - (risk / 100) * cfg.smart * 1.5, 0.03, 1);
      let lambda = base * cfg.w * trust * 1.25;
      if (type === 'whale') lambda *= liqF;
      const n = poisson(lambda * dt);
      for (let i = 0; i < n; i++) this._spawnBuyer(type, logRand(cfg.buy[0], cfg.buy[1]) * env.sizeMult);
    }
    if (this.kolBoost > 0.02) {
      const n = poisson(this.kolBoost * 2.0 * dt * (1 - 0.7 * this.panic));
      for (let i = 0; i < n; i++) this._spawnBuyer('follower', logRand(TT.follower.buy[0], TT.follower.buy[1]) * env.sizeMult);
    }
    // buyers arriving from your own Chirp posts
    if (this.chirpBoost > 0.02) {
      const n = poisson(this.chirpBoost * 1.9 * dt * (1 - 0.7 * this.panic) * env.sentiment);
      for (let i = 0; i < n; i++) if (this._spawnBuyer('chirp', logRand(TT.chirp.buy[0], TT.chirp.buy[1]) * env.sizeMult * this.chirpSize, { via: 'chirp' })) this.chirpBuys++;
    }
    // the occasional dip-buyer among existing holders
    if (this.panic < 0.3 && mom < 0.9 && chance(dt * 0.6 * base)) {
      const h = pick(this.holders);
      if (h && h.tokens > 0 && h.type !== 'sniper' && h.type !== 'kol') {
        const r = this._buy(logRand(0.05, 0.8) * env.sizeMult);
        if (r.tokens > 0) { h.avg = (h.cost + r.sol) / (h.tokens + r.tokens); h.tokens += r.tokens; h.cost += r.sol; this._trade('buy', r.sol, r.tokens, h); }
      }
    }

    // holder exits
    const price = this.price();
    for (const h of this.holders) {
      if (h.tokens <= 0) continue;
      const ratio = price / h.avg;
      let rate = 1 / h.hold;
      if (ratio >= h.tp) rate += 0.5;
      if (ratio <= h.sl) rate += 0.35;
      rate += this.panic * h.paper * 0.9;
      if (Math.random() < rate * dt) {
        const frac = ratio >= h.tp ? rand(0.4, 1) : (ratio <= h.sl || this.panic > 0.5 ? 1 : rand(0.5, 1));
        this._holderSell(h, frac);
        if (!this.isLive()) break;
      }
    }
    if (this.holders.length > 500) this.holders = this.holders.filter((h) => h.tokens > 0);

    // moods + chat
    const p5 = ph.length > 5 ? ph[ph.length - 6] : price0;
    const m5 = price / Math.max(1e-18, p5);
    this._mood = this.t < 25 ? 'launch' : this.panic > 0.45 ? 'devsold' : m5 > 1.08 ? 'pump' : m5 < 0.93 ? 'dip' : (this.t - this.lastTradeT > 25 ? 'dead' : 'calm');
    this._chatTimer -= dt;
    if (this._chatTimer <= 0) {
      const activity = clamp(base, 0.05, 3);
      this._chatTimer = rand(1.2, 4) / activity;
      if (this._mood !== 'devsold') this._say(pick(HANDLES), chatFill(pick(CHAT[this._mood]), this));
    }

    // death
    if (!this.dead && this.t > 90 && this.t - this.lastTradeT > 40 && this.attnImp < 0.08) {
      this.dead = true;
      this._event('dead', `$${this.ticker} died. No buyers left. Most coins end like this. You can still sell or pull, or shill hard to revive it.`);
      this._burstChat('dead', 2);
    } else if (this.dead && this.attnImp > 0.3) {
      this.dead = false; this.lastTradeT = this.t;
      this._event('revive', `$${this.ticker} is getting attention again.`);
    }
  }

  // ---------- dev actions ----------
  devSell(frac) {
    if (!this.isLive()) return 0;
    const main = this.dev.main;
    const tk = main.tokens * frac;
    if (tk <= 0) return 0;
    let sol = this._sell(tk);
    main.tokens -= tk;
    this._trade('sell', sol, tk, { handle: 'DEV', dev: true });
    sol = Math.max(0, sol - DEV_TX_FEE);
    this.devProceeds += sol;
    const f = tk / Math.max(1, main.start);
    this.dev.soldAny = true; this.dev.soldFrac += f;
    this.panic = Math.min(1, this.panic + 0.22 + f * 0.75);
    this._event('devsold', `Your dev wallet sold ${fmtNum(tk)} $${this.ticker} for ${fmtSOL(sol)} SOL. Everyone saw it.`);
    this._burstChat('devsold', 3 + Math.round(f * 4));
    this.rugMethod = this.rugMethod || 'devdump';
    return sol;
  }
  canPull() { return this.phase === 'dex' && this.type === 'custom' && this.lp === 'dev'; }
  pullLiquidity() {
    if (!this.canPull()) return 0;
    const sol = this.poolSol;
    this.poolSol = 0; this.poolTok = 0;
    this.devProceeds += sol;
    this.phase = 'rugged'; this.rugMethod = 'lp';
    this._mark(0, 0);
    this.trades.push({ t: this.t, side: 'sell', sol, tokens: 0, who: 'DEV', dev: true, mcap: 0, lp: true });
    this._event('rugged', `You pulled ${fmtSOL(sol)} SOL of liquidity from $${this.ticker}. The chart is a vertical line down.`);
    this._event('extract', null, { sol, method: 'lp' });
    this._burstChat('rug', 8);
    return sol;
  }
  lockLP(sec) {
    if (this.lp !== 'dev' || this.phase !== 'dex') return false;
    this.lp = 'locked'; this.lockUntil = this.t + sec; this.attnImp += 0.2;
    this._event('lock', `LP locked for ${fmtDur(sec)}. Buyers feel safer. When it expires you can pull.`);
    return true;
  }
  burnLP() {
    if (this.lp !== 'dev' || this.phase !== 'dex') return false;
    this.lp = 'burned'; this.attnImp += 0.35;
    this._event('burn', 'LP burned. Nobody can pull the liquidity now — including you.');
    return true;
  }
  // A Chirp post about the coin: a burst of buyers who saw it, plus lingering attention.
  shill(power, size = 1) {
    const eff = power * Math.pow(0.8, this.shills);
    this.chirpSize = Math.max(this.chirpSize, size);
    this.shills++;
    this.attnImp += eff * 0.55;
    this.chirpBoost += eff;
    if (this.dead && eff > 0.3) this.attnImp += 0.3;
    return eff;
  }
  // Bad press: a sleuth thread, getting ratioed, a "taking profits" post.
  fud(power, text) {
    this.panic = Math.min(1, this.panic + power);
    this.attnImp *= 1 - Math.min(0.6, power * 0.5);
    if (text) this._event('fud', text);
    this._burstChat('dip', 2 + Math.round(power * 4));
  }
  telePost(kind) {
    // posting in the community chat to steer the mood
    if (kind === 'calm') { this.panic *= 0.55; this._say('DEV', pick(['relax guys, just a shakeout 🫡', 'not selling, building', 'jeets out, we good']), 'dev'); }
    if (kind === 'hype') { this.attnImp += 0.12; this._say('DEV', pick(['WE ARE GOING TO 10M', 'raid time, everyone to Chirp 🚀', 'who is ready for dex?']), 'dev'); }
  }
  queueKol(kol) {
    const buyAt = this.t + rand(3, 8);
    this.kolQueue.push({ kol, stage: 0, buyAt, postAt: buyAt + rand(4, 9) });
  }

  // ---------- end of life ----------
  close(solUsd) {
    if (this.ended) return this.result;
    this.ended = true; this.closedAt = this.t;
    const pNow = this.price();
    let victims = this.exited.lossCount, loss = this.exited.lossSol;
    for (const h of this.holders) {
      if (h.tokens <= 0) continue;
      const l = h.cost - h.proceeds - h.tokens * pNow;
      if (l > 0.005) { victims++; loss += l; }
    }
    const devLeft = this.devTokens() > 0 && this.isLive() ? this.quoteSell(this.devTokens()) : 0;
    this.result = {
      id: this.id, name: this.name, ticker: this.ticker, kind: this.kind, hue: this.hue, type: this.type,
      peakMcapUsd: this.athMcap * solUsd, devCost: this.devCost, devProceeds: this.devProceeds,
      profit: this.devProceeds - this.devCost, unsold: devLeft,
      victims, victimLossSol: loss, method: this.rugMethod || (this.dead ? 'died' : 'abandoned'),
      graduated: this.graduated,
      life: this.t, volume: this.volume, holders: this.peakHolders, fees: this.creatorFees,
    };
    return this.result;
  }
}

// lightweight per-coin timers that run on sim time (so pausing works)
function setTimeoutSim(coin, sec, fn) { (coin._timers || (coin._timers = [])).push({ at: coin.t + sec, fn }); }
function runSimTimers(coin) {
  if (!coin._timers || !coin._timers.length) return;
  const due = coin._timers.filter((x) => x.at <= coin.t);
  if (!due.length) return;
  coin._timers = coin._timers.filter((x) => x.at > coin.t);
  for (const d of due) d.fn();
}

// ---------- launch helpers ----------
function launchPumpCoin(o, env) {
  const c = new Coin({ ...o, type: 'pump' });
  c.devCost += PUMP_LAUNCH_FEE;
  if (o.devBuy > 0) {
    const r = c._buy(o.devBuy);
    c.dev.main.tokens = r.tokens; c.dev.main.start = r.tokens; c.dev.main.cost = r.sol; c.devCost += r.sol;
    c._trade('buy', r.sol, r.tokens, { handle: 'DEV', dev: true });
  }
  c.attnImp = 0.11 * c.memeScore * c.metaMult;
  queueSnipers(c, env);
  c._event('launch', `$${c.ticker} is live on PumpBin. Bonding curve open. Snipers are watching.`);
  c._burstChat('launch', 3);
  return c;
}

function launchCustomCoin(o, env) {
  const c = new Coin({ ...o, type: 'custom' });
  c.phase = 'dex';
  c.poolSol = o.lpSol; c.poolTok = SUPPLY * o.lpPct; c.lpSeed = o.lpSol;
  c.dev.main.tokens = SUPPLY * (1 - o.lpPct); c.dev.main.start = c.dev.main.tokens;
  c.lp = o.lp || 'dev';
  if (c.lp === 'locked') c.lockUntil = o.lockSec || 180;
  c.devCost += CUSTOM_DEPLOY_FEE + o.lpSol;
  c.attnImp = 0.26 * c.memeScore * c.metaMult + Math.min(0.5, o.lpSol / 80);
  queueSnipers(c, env);
  c._mark(c.mcapSol(), 0);
  c._event('launch', `$${c.ticker} deployed. Pool seeded with ${fmtSOL(o.lpSol)} SOL. You hold the keys.`);
  c._burstChat('launch', 3);

}

// Sniper bots buy in the first seconds. Most are flippers: they dump within
// seconds, usually before a human dev can react.
function queueSnipers(c, env) {
  const n = Math.round(randi(0, 4) * (c.antiSnipe ? 0.25 : 1) * (env.sentiment ?? 1) * clamp(c.memeScore, 0.7, 1.2));
  for (let i = 0; i < n; i++) c.snipeQueue.push({ at: rand(0.3, 3.5), sol: logRand(TT.sniper.buy[0], TT.sniper.buy[1]) });
  c.snipeQueue.sort((a, b) => a.at - b.at);
}

// how "good" a meme is: hidden roll from the name, nudged by ticker shape
function memeScoreFor(name, ticker, kind, meta) {
  const r = mulberry32(hashStr(name.toLowerCase() + '|' + ticker.toUpperCase() + '|' + kind))();
  let s = 0.7 + r * 0.6;
  const tl = ticker.length;
  if (tl >= 3 && tl <= 5) s += 0.06;
  if (tl > 7) s -= 0.08;
  const lower = name.toLowerCase();
  const kw = { FROGS: ['frog', 'ribbit', 'toad'], DOGS: ['dog', 'inu', 'doge', 'pup', 'wif'], CATS: ['cat', 'kitty', 'meow', 'cat'], 'AI AGENTS': ['ai', 'gpt', 'agent', 'bot'], SPACE: ['moon', 'mars', 'rocket', 'space'], FOOD: ['burger', 'banana', 'pizza', 'taco'], GIGACHAD: ['chad', 'giga', 'sigma'], ANIMALS: ['frog', 'dog', 'cat', 'penguin', 'pengu'] };
  if ((kw[meta] || []).some((k) => lower.includes(k))) s += 0.12;
  return clamp(s, 0.6, 1.45);
}

// ---- 03-textures.js ----
// ============================================================
// TEXTURES — procedural, tileable canvas textures + normal maps
// Everything is generated at boot, so the game ships no image files.
// ============================================================
function ValueNoise(seed) {
  const rnd = mulberry32(seed);
  const vals = new Float32Array(256);
  const perm = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { vals[i] = rnd(); perm[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 256; i++) perm[256 + i] = perm[i];
  const lat = (ix, iy, p) => {
    ix = ((ix % p) + p) % p; iy = ((iy % p) + p) % p;
    return vals[perm[(perm[ix & 255] + (iy & 255)) & 511]];
  };
  function noise(x, y, p) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = lat(xi, yi, p), b = lat(xi + 1, yi, p), c = lat(xi, yi + 1, p), d = lat(xi + 1, yi + 1, p);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // tileable fbm on [0,1)^2; px = lattice cells per tile at the base octave
  function fbm(u, v, px = 4, oct = 5, _py = px, gain = 0.5) {
    let s = 0, amp = 0.5, n = 0, f = px;
    for (let o = 0; o < oct; o++) { s += amp * noise(u * f, v * f, f); n += amp; amp *= gain; f *= 2; }
    return s / n;
  }
  // anisotropic version with independent periods
  function fbm2(u, v, px, py, oct = 4, gain = 0.5) {
    let s = 0, amp = 0.5, n = 0, fx = px, fy = py;
    for (let o = 0; o < oct; o++) {
      s += amp * noise2(u * fx, v * fy, fx, fy); n += amp; amp *= gain; fx *= 2; fy *= 2;
    }
    return s / n;
  }
  const lat2 = (ix, iy, px, py) => {
    ix = ((ix % px) + px) % px; iy = ((iy % py) + py) % py;
    return vals[perm[(perm[ix & 255] + (iy & 255)) & 511]];
  };
  function noise2(x, y, px, py) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = lat2(xi, yi, px, py), b = lat2(xi + 1, yi, px, py), c = lat2(xi, yi + 1, px, py), d = lat2(xi + 1, yi + 1, px, py);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  return { noise, fbm, fbm2, rnd };
}

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function newCanvas(w, h = w) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}

// Build color canvas + normal canvas from per-pixel callbacks.
// fn(u, v, x, y) -> [r,g,b, height, rough]
function genTexture(w, h, fn, opts = {}) {
  const col = newCanvas(w, h), cctx = col.getContext('2d');
  const img = cctx.createImageData(w, h);
  const height = new Float32Array(w * h);
  const rough = opts.rough ? new Uint8ClampedArray(w * h) : null;
  const out = [0, 0, 0, 0, 0];
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      fn(u, v, x, y, out);
      const i = y * w + x, j = i * 4;
      img.data[j] = out[0]; img.data[j + 1] = out[1]; img.data[j + 2] = out[2]; img.data[j + 3] = 255;
      height[i] = out[3];
      if (rough) rough[i] = out[4] * 255;
    }
  }
  cctx.putImageData(img, 0, 0);
  const res = { color: col, height, w, h };
  if (opts.normal !== false) res.normal = heightToNormal(height, w, h, opts.strength ?? 2);
  if (rough) {
    const rc = newCanvas(w, h), rctx = rc.getContext('2d'), ri = rctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) { const r = rough[i]; ri.data[i * 4] = r; ri.data[i * 4 + 1] = r; ri.data[i * 4 + 2] = r; ri.data[i * 4 + 3] = 255; }
    rctx.putImageData(ri, 0, 0);
    res.rough = rc;
  }
  return res;
}

function heightToNormal(hgt, w, h, strength) {
  const c = newCanvas(w, h), ctx = c.getContext('2d'), img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const ym = ((y - 1 + h) % h) * w, yp = ((y + 1) % h) * w, y0 = y * w;
    for (let x = 0; x < w; x++) {
      const xm = (x - 1 + w) % w, xp = (x + 1) % w;
      const dx = (hgt[y0 + xp] - hgt[y0 + xm]) * strength;
      const dy = (hgt[yp + x] - hgt[ym + x]) * strength;
      let nx = -dx, ny = dy, nz = 1;
      const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      const j = (y0 + x) * 4;
      img.data[j] = (nx * 0.5 + 0.5) * 255; img.data[j + 1] = (ny * 0.5 + 0.5) * 255; img.data[j + 2] = (nz * 0.5 + 0.5) * 255; img.data[j + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function toTex(canvas, { srgb = true, repeat = [1, 1], aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = aniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}
function texSet(gen, repeat = [1, 1]) {
  return {
    map: toTex(gen.color, { repeat }),
    normalMap: gen.normal ? toTex(gen.normal, { srgb: false, repeat }) : null,
    roughnessMap: gen.rough ? toTex(gen.rough, { srgb: false, repeat }) : null,
  };
}

// ---------- surfaces ----------
function genConcrete(S) {
  const N = ValueNoise(11), N2 = ValueNoise(12);
  const g = genTexture(S, S, (u, v, x, y, o) => {
    const n1 = N.fbm(u, v, 4, 6);
    const n2 = N2.fbm(u, v, 32, 3);
    const stain = smooth(0.56, 0.74, N.fbm(u + 0.37, v + 0.11, 2, 4));
    const wet = smooth(0.6, 0.7, N2.fbm(u, v, 3, 3));
    const speck = (N2.noise(u * 512, v * 512, 512) > 0.93) ? -0.08 : 0;
    let b = 0.5 + (n1 - 0.5) * 0.12 + (n2 - 0.5) * 0.12 + speck * 0.6;
    b *= 1 - stain * 0.14 - wet * 0.05;
    o[0] = clamp(b * 255 * 1.02, 0, 255); o[1] = clamp(b * 255 * 1.0, 0, 255); o[2] = clamp(b * 255 * 0.95, 0, 255);
    o[3] = n2 * 0.7 + n1 * 0.3; o[4] = clamp(0.88 - stain * 0.25 - wet * 0.3 + (n2 - 0.5) * 0.1, 0.3, 1);
  }, { rough: true, strength: 3 });

  const ctx = g.color.getContext('2d');
  const rnd = mulberry32(7);
  ctx.strokeStyle = 'rgba(30,28,26,0.55)'; ctx.lineWidth = Math.max(1, S / 700);
  for (let k = 0; k < 4; k++) {
    let x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 0; i < 60; i++) { a += (rnd() - 0.5) * 0.9; x += Math.cos(a) * S / 120; y += Math.sin(a) * S / 120; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  return g;
}

// Painted cinder block, mapped to one full wall height (bottom grime baked in).
// tile covers 1.6m wide x 2.4m tall: 4 blocks x 12 courses, running bond.
function genCinder(W, H) {
  const N = ValueNoise(21), N2 = ValueNoise(22);
  const bw = W / 4, bh = H / 12, mort = Math.max(2, W / 110);
  return genTexture(W, H, (u, v, x, y, o) => {
    const row = Math.floor(y / bh);
    const off = (row % 2) * bw * 0.5;
    const bx = ((x + off) % bw), by = y % bh;
    const edge = Math.min(bx, bw - bx, by, bh - by);
    const isMort = edge < mort;
    const bevel = smooth(mort, mort * 2.6, edge);
    const pores = N2.fbm(u, v, 48, 3);
    const pit = pores < 0.33 ? (0.33 - pores) * 2.2 : 0;
    const paintWear = smooth(0.62, 0.78, N.fbm(u, v, 3, 5));
    const n = N.fbm(u, v, 8, 4);
    let r, gC, b;
    if (isMort) { const m = 0.56 + (n - 0.5) * 0.15; r = m * 0.97; gC = m * 0.95; b = m * 0.9; }
    else {
      const paint = 0.8 + (n - 0.5) * 0.08 - pit * 0.35;
      const raw = 0.55 + (n - 0.5) * 0.2 - pit * 0.3;
      const base = lerp(paint, raw, paintWear * 0.7);
      r = base * 0.98; gC = base * 0.97; b = base * 0.93;
    }
    // grime: darker near floor + water tide line + streaks from top
    const fromBottom = 1 - v;
    const grime = smooth(0.22, 0.0, fromBottom) * 0.38 + smooth(0.06, 0.0, Math.abs(fromBottom - 0.16)) * 0.08 * N.fbm(u, 0.5, 6, 3);
    const streak = smooth(0.7, 0.9, N.fbm2(u, v, 24, 2, 3)) * smooth(0.5, 0.0, v) * 0.15;
    const dark = 1 - grime - streak;
    o[0] = clamp(r * dark * 255, 0, 255); o[1] = clamp(gC * dark * 255, 0, 255); o[2] = clamp(b * dark * 230, 0, 255);
    o[3] = (isMort ? 0 : 0.55 * bevel + 0.45) - pit * 0.35 + pores * 0.08;
    o[4] = isMort ? 0.95 : lerp(0.72, 0.92, paintWear);
  }, { rough: true, strength: 4 });
}

function genWood(S, opts = {}) {
  const N = ValueNoise(opts.seed || 31);
  const c1 = opts.light || [196, 150, 98], c2 = opts.dark || [128, 84, 46];
  const planks = opts.planks || 1;
  return genTexture(S, S, (u, v, x, y, o) => {
    const pk = Math.floor(u * planks), pu = (u * planks) % 1;
    const seedOff = pk * 0.37;
    const warp = N.fbm(u, v + seedOff, 2, 4) * 3.0;
    const ring = 0.5 + 0.5 * Math.sin((pu * 3 + warp + seedOff * 5) * Math.PI * 2 * (opts.rings || 3));
    const fine = N.fbm2((u + seedOff) % 1, v, 64, 2, 3);
    const knot = opts.knots ? smooth(0.82, 0.9, N.fbm(u, v, 4, 3)) : 0;
    let t = clamp(ring * 0.55 + fine * 0.45 + knot * 0.8, 0, 1);
    const gap = planks > 1 ? smooth(0.0, 0.012, Math.min(pu, 1 - pu)) : 1;
    o[0] = lerp(c1[0], c2[0], t) * (0.6 + 0.4 * gap); o[1] = lerp(c1[1], c2[1], t) * (0.6 + 0.4 * gap); o[2] = lerp(c1[2], c2[2], t) * (0.6 + 0.4 * gap);
    o[3] = fine * 0.3 + (1 - ring) * 0.15 + gap * 0.6;
    o[4] = (opts.rough ?? 0.7) + (fine - 0.5) * 0.15;
  }, { rough: true, strength: 2 });
}

// greyscale fabric patterns, tinted by material.color
function genKnit(S) {
  const N = ValueNoise(41);

    const rib = Math.abs(Math.sin(u * Math.PI * 96));
    const stitch = Math.abs(Math.sin(v * Math.PI * 128 + Math.sin(u * Math.PI * 96) * 1.2));
    const fuzz = N.fbm(u, v, 64, 3);
    const h = rib * 0.6 + stitch * 0.25 + fuzz * 0.3;

    o[0] = o[1] = o[2] = clamp(b * 255, 0, 255); o[3] = h; o[4] = 0.95;

}
function genDenim(S) {

function genPaintedMetal(S, base, rust = 0.2) {

    const r = smooth(1 - rust * 0.5, 1 - rust * 0.3, N.fbm(u + 0.5, v, 6, 5)) * rust * 2;

    const f = N.fbm(u, v, 12, 6, 12, 0.6);
    const b = 0.75 + (f - 0.5) * 0.6;
    o[0] = clamp(250 * b, 0, 255); o[1] = clamp(170 * b, 0, 255); o[2] = clamp(175 * b, 0, 255);

}
function genMattress(S) {
  const N = ValueNoise(141);

    const du = (u * 6) % 1, dv = (v * 6) % 1;

  return genTexture(S, S, (u, v, x, y, o) => {
    const cx = Math.abs(u - 0.5), cy = Math.abs(v - 0.5);
    const box = Math.max(cx, cy * 1.0);
    const dia = cx + cy;
    let c = [128, 28, 36];
    if (box > 0.46) c = [210, 175, 110];
    else if (box > 0.43) c = [30, 40, 70];
    else if (box > 0.4) c = [210, 175, 110];
    else if (dia < 0.16) c = [30, 40, 70];
    else if (dia < 0.2) c = [210, 175, 110];
    else if (Math.abs(Math.sin(u * 40) * Math.sin(v * 40)) > 0.85) c = [180, 120, 60];
    const pile = N.fbm(u, v, 128, 2);
    const wear = smooth(0.55, 0.75, N.fbm(u, v, 3, 4));
    const b = 0.85 + (pile - 0.5) * 0.25 - wear * 0.2;
    o[0] = c[0] * b; o[1] = c[1] * b; o[2] = c[2] * b; o[3] = pile; o[4] = 1;
  }, { strength: 2 });
}

// ---------- posters ----------
function drawPoster(kind, W = 512, H = 720) {
  const c = newCanvas(W, H), ctx = c.getContext('2d');
  const N = ValueNoise(hashStr(kind));
  if (kind === 'hodl') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b1037'); g.addColorStop(0.55, '#e0567a'); g.addColorStop(1, '#ffb547');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(W / 2, H * 0.52, W * 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#16102a'; ctx.beginPath(); ctx.moveTo(0, H * 0.75);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H * 0.62 + Math.sin(x * 0.02) * 30 + N.noise(x / 40, 0, 64) * 60);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${W * 0.26}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('HODL', W / 2, H * 0.22);
    ctx.font = `${W * 0.045}px Georgia, serif`; ctx.fillText('Diamond hands are forged under pressure.', W / 2, H * 0.92);
  } else if (kind === 'frog') {
    ctx.fillStyle = '#e9e2cf'; ctx.fillRect(0, 0, W, H);
    const ic = newCanvas(400); drawMemeIcon(ic.getContext('2d'), 'frog', 140, 400, 3);
    ctx.drawImage(ic, W / 2 - 200, H * 0.14, 400, 400);
    ctx.fillStyle = '#141014'; ctx.font = `900 ${W * 0.13}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('FEELS GOOD', W / 2, H * 0.84);
    ctx.font = `${W * 0.05}px "Courier New", monospace`; ctx.fillText('(when number go up)', W / 2, H * 0.92);
  } else if (kind === 'chart') {
    ctx.fillStyle = '#0c0f14'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#1d2530'; ctx.lineWidth = 2;
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    let p = H * 0.8;
    for (let i = 0; i < 18; i++) {
      const x = 24 + i * 26, o = p; p -= (Math.random() - 0.25) * 40; const up = p < o;
      ctx.fillStyle = up ? '#38e08c' : '#ff4d5e';
      ctx.fillRect(x - 1, Math.min(o, p) - 14, 2, Math.abs(o - p) + 28);
      ctx.fillRect(x - 8, Math.min(o, p), 16, Math.max(4, Math.abs(o - p)));
    }
    ctx.fillStyle = '#38e08c'; ctx.font = `900 ${W * 0.12}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('NUMBER', W / 2, H * 0.12); ctx.fillText('GO UP', W / 2, H * 0.24);
  } else if (kind === 'lambo') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#08060f'); g.addColorStop(1, '#3a0d4a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#ff3fd2'; ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2, H * 0.55); ctx.lineTo(i * W / 11, H); ctx.stroke(); }
    ctx.fillStyle = '#ffb547';
    ctx.beginPath(); ctx.moveTo(W * 0.08, H * 0.6); ctx.lineTo(W * 0.3, H * 0.5); ctx.lineTo(W * 0.62, H * 0.47); ctx.lineTo(W * 0.92, H * 0.55); ctx.lineTo(W * 0.94, H * 0.62); ctx.lineTo(W * 0.08, H * 0.64); ctx.fill();
    ctx.fillStyle = '#111'; for (const x of [0.25, 0.75]) { ctx.beginPath(); ctx.arc(W * x, H * 0.64, W * 0.07, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.font = `900 ${W * 0.1}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('WEN LAMBO', W / 2, H * 0.2);
  } else if (kind === 'wagmi') {
    ctx.fillStyle = '#ffde3b'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#141014'; ctx.font = `900 ${W * 0.2}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('WAGMI', W / 2, H * 0.3);
    ctx.font = `700 ${W * 0.06}px "Arial Black", sans-serif`; ctx.fillText('WORLD TOUR', W / 2, H * 0.4);
    ctx.font = `${W * 0.045}px "Courier New", monospace`;
    ['BASEMENT — NOV 3', 'MOM\'S KITCHEN — NOV 4', 'GARAGE — CANCELLED', 'THE MOON — TBA'].forEach((s, i) => ctx.fillText(s, W / 2, H * (0.55 + i * 0.08)));
  }
  // paper wear + tape
  const img = ctx.getImageData(0, 0, W, H);
  for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
    const n = N.fbm(x / W, y / H, 8, 3);
    const k = 0.88 + n * 0.16;
    const j = (y * W + x) * 4; img.data[j] *= k; img.data[j + 1] *= k; img.data[j + 2] *= k * 0.97;
  }
  ctx.putImageData(img, 0, 0);
  ctx.fillStyle = 'rgba(240,235,200,0.55)';
  ctx.save(); ctx.translate(30, 18); ctx.rotate(-0.5); ctx.fillRect(-30, -10, 70, 22); ctx.restore();
  ctx.save(); ctx.translate(W - 30, 18); ctx.rotate(0.5); ctx.fillRect(-40, -10, 70, 22); ctx.restore();
  return c;
}

  S.cred = clamp(S.cred - 0.06 * severity, 0.3, 1.25);

let simAcc = 0;
function gameTick(dt) {
  if (!S || S.ended) return;
  simAcc += dt;
  const env = coinEnv();
  while (simAcc >= SIM_DT) {
    simAcc -= SIM_DT;
    for (const c of LIVE) {
      if (c.ended) continue;
      c.tick(SIM_DT, env);
      if (c.tweetedAt != null && !c.calledPaid && c.mcapSol() > c.tweetMcap * 3) {
        c.calledPaid = true;
        const g = Math.round(S.followers * 0.05 + 30);
        S.followers += g; S.cred = Math.min(1.25, S.cred + 0.03);
        pushFeed({ who: 'Chirp', text: `You called $${c.ticker} before a 3x. +${g} followers.`, kind: 'good' });
      }
    }
  }
  for (const c of LIVE) while (c.events.length) emit('coinevent', { coin: c, ev: c.events.shift() });
  for (const p of S.posts) if (p.age < 30) p.age += dt;
  S.clock += dt;
  if (S.clock >= 24 * 60) S.clock -= 24 * 60;
  checkObjectives();
}

  try {

    const d = JSON.parse(raw);

    S = Object.assign(newGameState(), d.S);
    LIVE = (d.LIVE || []).map((o) => Object.assign(Object.create(Coin.prototype), o));
    FOCUS = d.FOCUS; COIN_SEQ = Math.max(COIN_SEQ, d.seq || 1);
    return true;
  } catch (e) { return false; }
}

// WORLD — the basement
// Room: x [-5,5], z [-4,4], floor y=0, subfloor (ceiling) y=2.5,
// joists hang to y=2.26. Stairs climb the west wall to Mom's door.
// ============================================================
const ROOM = { x0: -5, x1: 5, z0: -4, z1: 4, h: 2.5 };

// Planar UVs in world meters (good for boxes / flat-faced meshes)
function planarUV(geo, scale = 1, grainY = false) {
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const ax = Math.abs(nor.getX(i)), ay = Math.abs(nor.getY(i)), az = Math.abs(nor.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = z; v = y; } else if (ay >= az) { u = x; v = z; } else { u = x; v = y; }
    if (grainY) { const t = u; u = v; v = t; }
    uv.setXY(i, u / scale, v / scale);
  }
  uv.needsUpdate = true;
  return geo;
}

function buildWorld(scene, Q) {
  const W = {
    colliders: [], interact: [], screens: {}, items: {}, anim: [], lights: {}, root: new THREE.Group(),
    fridgeDoor: null, bulbs: [], fans: [], blinkers: [], seats: {},
  };
  scene.add(W.root);
  const S = Q.tex;

  // ---------- textures ----------

  T.oak = texSet(oak);
  const doorPaint = genPaintedMetal(256, [236, 232, 222], 0.04); T.doorPaint = texSet(doorPaint);

  const gray = genPaintedMetal(S / 4, [120, 128, 136], 0.3); T.grayMetal = texSet(gray);
  const galv = genGalvanized(S / 4); T.galv = texSet(galv);
  const cardboard = genCardboard(S / 4); T.cardboard = texSet(cardboard);
  const insul = genInsulation(S / 4); T.insul = texSet(insul);
  const mattress = genMattress(S / 2); T.mattress = texSet(mattress);
  const rug = genRug(S / 2); T.rug = texSet(rug);
  W.textures = T;

  const M = {};
  const std = (o) => new THREE.MeshStandardMaterial(o);
  M.floor = std({ ...T.floor, roughness: 1, normalScale: new THREE.Vector2(0.6, 0.6) });
  M.wall = std({ ...T.wall, roughness: 1, normalScale: new THREE.Vector2(0.9, 0.9) });
  M.pine = std({ ...T.pine, roughness: 1 });
  M.ply = std({ ...T.ply, roughness: 1 });
  M.oak = std({ ...T.oak, roughness: 0.9 });
  M.door = std({ ...T.doorPaint, roughness: 0.7 });
  M.whiteMetal = std({ ...T.whiteMetal, metalness: 0.2 });
  M.grayMetal = std({ ...T.grayMetal, metalness: 0.4 });
  M.galv = std({ ...T.galv, metalness: 0.85 });
  M.cardboard = std({ ...T.cardboard });
  M.insul = std({ ...T.insul, roughness: 1 });
  M.black = std({ color: 0x15161a, roughness: 0.5, metalness: 0.2 });
  M.plastic = std({ color: 0x2a2c33, roughness: 0.45 });
  M.beige = std({ color: 0xd8cfb8, roughness: 0.55 });
  M.steel = std({ color: 0x8a9099, roughness: 0.35, metalness: 0.9 });
  M.chrome = std({ color: 0xdfe3ea, roughness: 0.15, metalness: 1 });
  M.copper = std({ color: 0xb36a3c, roughness: 0.35, metalness: 1 });
  M.glass = new THREE.MeshPhysicalMaterial({ color: 0x9fb7c9, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.25 });
  M.screenOff = std({ color: 0x07080a, roughness: 0.2, metalness: 0.5 });
  W.mats = M;

  const mesh = (geo, mat, x = 0, y = 0, z = 0, parent = R, cast = true, recv = true) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m;
  };
  const box = (w, h, d, mat, x, y, z, parent = R, uvScale = 0) => {
    const g = new THREE.BoxGeometry(w, h, d); if (uvScale) planarUV(g, uvScale);
    return mesh(g, mat, x, y, z, parent);
  };
  const rbox = (w, h, d, r, mat, x, y, z, parent = R, uvScale = 0) => {
    const g = new RoundedBoxGeometry(w, h, d, 3, r); if (uvScale) planarUV(g, uvScale);
    return mesh(g, mat, x, y, z, parent);
  };
  const cyl = (rt, rb, h, mat, x, y, z, parent = R, seg = 24) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, parent);
  const collide = (x0, z0, x1, z1) => W.colliders.push({ x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1) });
  const group = (x = 0, y = 0, z = 0, parent = R) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  W.helpers = { mesh, box, rbox, cyl, group, collide };

  // ---------- shell ----------
  {
    const fg = new THREE.PlaneGeometry(10, 8); fg.rotateX(-Math.PI / 2);
    const f = mesh(fg, M.floor, 0, 0, 0, R, false, true);
    // floor drain
    const drain = mesh(new THREE.CircleGeometry(0.09, 24), std({ color: 0x3b3a38, roughness: 0.6, metalness: 0.6 }), 3.6, 0.002, -2.4, R, false, true);
    drain.rotation.x = -Math.PI / 2;
    const walls = [
      { L: 10, x: 0, z: ROOM.z0, ry: 0 },
      { L: 10, x: 0, z: ROOM.z1, ry: Math.PI },
      { L: 8, x: ROOM.x0, z: 0, ry: Math.PI / 2 },
      { L: 8, x: ROOM.x1, z: 0, ry: -Math.PI / 2 },
    ];
    for (const w of walls) {
      const g = new THREE.PlaneGeometry(w.L, ROOM.h);
      const uv = g.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * w.L / 1.6);
      const m = mesh(g, M.wall, w.x, ROOM.h / 2, w.z, R, false, true);
      m.rotation.y = w.ry;
    }
    // subfloor above, with stairwell opening (x -4.95..-3.95, z 0.1..3.7)
    const sub = new THREE.Shape();
    sub.moveTo(-5, -4); sub.lineTo(5, -4); sub.lineTo(5, 4); sub.lineTo(-5, 4); sub.lineTo(-5, 3.7); sub.lineTo(-3.95, 3.7); sub.lineTo(-3.95, 0.1); sub.lineTo(-5, 0.1); sub.lineTo(-5, -4);
    const sg = new THREE.ShapeGeometry(sub); sg.rotateX(Math.PI / 2);
    planarUV(sg, 1.2);
    mesh(sg, M.ply, 0, ROOM.h, 0, R, false, true);
    // joists (run along z), 2x10 every 40cm
    for (let x = -4.8; x <= 4.8; x += 0.4) {
      const inStair = x < -3.9;
      if (inStair) {
        box(0.045, 0.24, 3.95, M.pine, x, ROOM.h - 0.12, -1.95, R, 0.9);
        box(0.045, 0.24, 0.3, M.pine, x, ROOM.h - 0.12, 3.85, R, 0.9);
      } else box(0.045, 0.24, 8, M.pine, x, ROOM.h - 0.12, 0, R, 0.9);
      // pink insulation between some joists near the rim
      if (x < 4.6 && !inStair) {
        box(0.35, 0.16, 0.6, M.insul, x + 0.2, ROOM.h - 0.08, -3.68, R, 0.5);
        box(0.35, 0.16, 0.6, M.insul, x + 0.2, ROOM.h - 0.08, 3.68, R, 0.5);
      }
    }
    // header beam (steel I-beam) across the middle
    const beam = group(0, ROOM.h - 0.24, 0.6);
    box(10, 0.012, 0.14, M.grayMetal, 0, 0.0, 0, beam);
    box(10, 0.2, 0.01, M.grayMetal, 0, -0.1, 0, beam);
    box(10, 0.012, 0.14, M.grayMetal, 0, -0.2, 0, beam);
    // steel lally column under the beam
    cyl(0.05, 0.05, ROOM.h - 0.44, M.grayMetal, 0.9, (ROOM.h - 0.44) / 2, 0.6);
    cyl(0.12, 0.12, 0.02, M.grayMetal, 0.9, ROOM.h - 0.45, 0.6);
    collide(0.82, 0.52, 0.98, 0.68);
    // sill plate on the walls top
    box(10, 0.04, 0.14, M.pine, 0, ROOM.h - 0.02, ROOM.z0 + 0.07, R, 1);
    box(10, 0.04, 0.14, M.pine, 0, ROOM.h - 0.02, ROOM.z1 - 0.07, R, 1);
  }

  // ---------- ductwork & pipes ----------
  {
    const trunk = box(7.2, 0.22, 0.42, M.galv, 0.9, ROOM.h - 0.38, -2.2, R, 0.6);
    for (const x of [-2, 0.3, 2.4]) {
      const d = cyl(0.08, 0.08, 1.6, M.galv, x, ROOM.h - 0.33, -1.2, R, 20); d.rotation.x = Math.PI / 2;
      const reg = box(0.3, 0.02, 0.14, M.whiteMetal, x, ROOM.h - 0.42, -0.42);
    }
    // copper water line + PVC drain along north wall
    const p1 = cyl(0.012, 0.012, 9.6, M.copper, 0, ROOM.h - 0.3, -3.88, R, 10); p1.rotation.z = Math.PI / 2;
    const p2 = cyl(0.04, 0.04, 9.6, std({ color: 0xe9e9e4, roughness: 0.4 }), 0, ROOM.h - 0.36, -3.82, R, 14); p2.rotation.z = Math.PI / 2;
    // electrical: armored cable + junction box
    const cable = cyl(0.008, 0.008, 6, M.steel, -1.5, ROOM.h - 0.27, 1.6, R, 6); cable.rotation.z = Math.PI / 2;
  }

  // ---------- lighting ----------
  {
    const hemi = new THREE.HemisphereLight(0x8a96b8, 0x2a1d14, 0.12);
    R.add(hemi);
    const makeBulb = (x, z, power, shadows) => {
      const g = group(x, ROOM.h - 0.24, z);
      cyl(0.04, 0.05, 0.06, M.beige, 0, -0.03, 0, g, 16);
      const glass = mesh(new THREE.SphereGeometry(0.045, 20, 14), new THREE.MeshStandardMaterial({ color: 0xfff1d6, emissive: 0xffc27a, emissiveIntensity: 6, roughness: 0.3 }), 0, -0.1, 0, g, false, false);
      const chain = cyl(0.002, 0.002, 0.45, M.chrome, 0.03, -0.3, 0, g, 4);
      const pull = mesh(new THREE.SphereGeometry(0.008, 8, 6), M.chrome, 0.03, -0.53, 0, g);
      const pl = new THREE.PointLight(0xffd3a3, power, 9, 2);
      pl.position.set(x, ROOM.h - 0.36, z);
      R.add(pl);
      let spot = null;
      if (shadows) {
        spot = new THREE.SpotLight(0xffd3a3, power * 1.6, 10, 1.25, 0.65, 2);
        spot.position.set(x, ROOM.h - 0.36, z);
        spot.target.position.set(x, 0, z);
        spot.castShadow = true;
        spot.shadow.mapSize.set(Q.shadow, Q.shadow);
        spot.shadow.bias = -0.0006; spot.shadow.normalBias = 0.02;
        spot.shadow.camera.near = 0.1; spot.shadow.camera.far = 8;
        R.add(spot); R.add(spot.target);
      }
      W.bulbs.push({ glass, pl, spot, base: power, flicker: 0 });
      return g;
    };
    makeBulb(-0.4, -0.6, 2.2, true);
    makeBulb(3.4, -1.2, 1.1, Q.high);
    // desk lamp + monitor glow are added with the desk
    // moonlight through the hopper windows
    const moon = new THREE.SpotLight(0x7f9cff, 2.2, 12, 0.5, 0.8, 1.2);
    moon.position.set(1.8, 3.6, 6.5); moon.target.position.set(0.5, 0, 0.5);
    moon.castShadow = Q.high; moon.shadow.mapSize.set(512, 512);
    R.add(moon); R.add(moon.target);
    W.lights.moon = moon;
  }

  // ---------- hopper windows (south wall, high) ----------
  {
    const winMat = new THREE.MeshStandardMaterial({ color: 0x05070c, emissive: 0x0d1830, emissiveIntensity: 0.55, roughness: 0.15, metalness: 0.2 });
    W.windowMats = [];
    for (const x of [0.4, 2.9]) {
      const g = group(x, 2.05, ROOM.z1 - 0.01);

      const pane = mesh(new THREE.PlaneGeometry(0.74, 0.32), winMat.clone(), 0, 0, -0.065, g, false, false);

      box(0.76, 0.02, 0.02, M.whiteMetal, 0, 0, -0.07, g);
      // a few dead leaves in the window well
      box(0.8, 0.03, 0.12, std({ color: 0x3c2c1a, roughness: 1 }), 0, -0.2, -0.11, g);
    }
  }

  // ---------- stairs to Mom's door ----------
  {
    const sx0 = -4.95, sx1 = -3.97, zBottom = 3.62, zTop = 0.12;
    const steps = 13, rise = ROOM.h / steps, run = (zBottom - zTop) / steps;
    const st = group(0, 0, 0);
    for (let i = 0; i < steps; i++) {
      const y = rise * (i + 1), z = zBottom - run * (i + 0.5);
      box(sx1 - sx0, 0.03, run + 0.03, M.pine, (sx0 + sx1) / 2, y - 0.015, z, st, 0.6);
      box(sx1 - sx0, rise - 0.03, 0.015, M.ply, (sx0 + sx1) / 2, y - rise / 2 - 0.015, z + run / 2 - 0.01, st, 0.6);

    const len = Math.hypot(zBottom - zTop, ROOM.h);
    const ang = Math.atan2(ROOM.h, zBottom - zTop);
    for (const x of [sx0 + 0.03, sx1 - 0.03]) {
      const s = box(0.04, 0.24, len, M.pine, x, ROOM.h / 2 - 0.12, (zBottom + zTop) / 2, st, 0.9);
      s.rotation.x = ang;
    }
    // handrail on the open side
    const rail = cyl(0.022, 0.022, len, M.oak, sx1 + 0.02, ROOM.h / 2 + 0.85, (zBottom + zTop) / 2, st, 10);
    rail.rotation.x = Math.PI / 2 - ang;
    for (let i = 0; i < 4; i++) {
      const t = (i + 0.5) / 4;
      const z = zBottom - t * (zBottom - zTop), y = t * ROOM.h;
      box(0.04, 0.9, 0.04, M.pine, sx1 + 0.02, y + 0.45, z, st);

    // stairwell walls above the opening, door at top
    const shaftH = 2.3;

    box(1.0, 0.02, 3.6, M.door, (sx0 + sx1) / 2, ROOM.h + shaftH, (zBottom + zTop) / 2, st);
    // landing + door (faces +z, at the top of the stairs)

    W.momDoor = door; W.momLeak = leakLight;
    collide(sx0, zTop - 0.1, sx1 + 0.06, zBottom + 0.05);
    W.interact.push({ id: 'stairs', pos: new THREE.Vector3(-4.2, 1.2, 3.3), r: 1.6, label: () => 'Go upstairs', action: 'stairs' });
    // boxes under the stairs
    const labels = ['XMAS', 'TAXES 2019', "DAD'S STUFF", 'MOM - DO NOT TOUCH', 'HALLOWEEN', 'BEANIE BABIES'];
    let li = 0;
    for (const [x, y, z, w, h, d] of [[-4.55, 0.2, 2.9, 0.6, 0.4, 0.5], [-4.55, 0.6, 2.95, 0.5, 0.38, 0.45], [-4.5, 0.18, 2.3, 0.55, 0.36, 0.5], [-4.6, 0.15, 1.75, 0.5, 0.3, 0.45]]) {

        const leg = box(0.05, 0.76, 0.05, M.pine, s * 0.12, 0.36, zz, sh); leg.rotation.z = s * 0.2;
      }
    }
    collide(DESK.x - 0.97, DESK.z - 0.42, DESK.x + 0.97, DESK.z + 0.42);
    W.interact.push({ id: 'pc', pos: new THREE.Vector3(DESK.x, 1.0, DESK.z + 0.3), r: 1.7, label: () => 'Use PC', action: 'pc' });

    const makeMonitor = (key, x, rotY, parent, size = [0.53, 0.31], big = false) => {
      const g = group(x, DESK.top, 0.05, parent);

      const [w, h] = size;
      rbox(0.18, 0.012, 0.14, 0.004, M.plastic, 0, 0.006, 0, g);

      const body = rbox(w + 0.025, h + 0.025, 0.035, 0.008, M.plastic, 0, 0.08 + h / 2 + 0.02, -0.01, g);
      const cv = newCanvas(512, Math.round(512 * h / w)); const ctx = cv.getContext('2d');
      ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, cv.width, cv.height);
      const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
      const smat = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
      smat.color.setScalar(0.85);

      W.screens[key] = { canvas: cv, ctx, tex, mesh: scr, group: g };
      return g;
    };
    const mon = group(0, 0, 0, desk);
    makeMonitor('main', 0, 0, mon);
    W.items.monitor2 = makeMonitor('m2', -0.6, 0.35, mon);
    W.items.monitor3 = makeMonitor('m3', 0.6, -0.35, mon);
    // keyboard & mouse
    const kb = rbox(0.44, 0.022, 0.14, 0.006, M.plastic, -0.02, DESK.top + 0.011, 0.24, desk);
    const keyMat = std({ color: 0x3a3d46, roughness: 0.6 });
    for (let r = 0; r < 5; r++) for (let c = 0; c < 15; c++) box(0.024, 0.008, 0.022, keyMat, -0.02 - 0.2 + c * 0.0285, DESK.top + 0.026, 0.24 - 0.052 + r * 0.026, desk);
    rbox(0.06, 0.025, 0.1, 0.012, M.plastic, 0.32, DESK.top + 0.0125, 0.26, desk);
    // energy drink cans
    const canCv = newCanvas(256, 128), cc = canCv.getContext('2d');
    cc.fillStyle = '#121418'; cc.fillRect(0, 0, 256, 128); cc.fillStyle = '#7dff3a'; cc.font = '900 64px Impact, sans-serif'; cc.fillText('VOLT', 60, 90);
    cc.strokeStyle = '#7dff3a'; cc.lineWidth = 6; cc.beginPath(); cc.moveTo(10, 20); cc.lineTo(40, 64); cc.lineTo(20, 64); cc.lineTo(50, 108); cc.stroke();
    const canMat = new THREE.MeshStandardMaterial({ map: toTex(canCv), metalness: 0.6, roughness: 0.35 });
    W.cans = [];
    for (let i = 0; i < 9; i++) {
      const c = cyl(0.033, 0.033, 0.12, canMat, -0.85 + (i % 3) * 0.075, DESK.top + 0.06, -0.22 + Math.floor(i / 3) * 0.08, desk, 18);
      c.rotation.y = Math.random() * 6; c.visible = i < 2;
      W.cans.push(c);
    }
    // crushed can + pizza box on the floor
    const pz = rbox(0.42, 0.04, 0.42, 0.005, M.cardboard, 0.4, 0.02, 0.75, desk); pz.rotation.y = 0.4;
    // desk lamp
    const lamp = group(0.8, DESK.top, -0.22, desk);
    cyl(0.07, 0.08, 0.02, M.black, 0, 0.01, 0, lamp);
    const arm = cyl(0.008, 0.008, 0.38, M.black, 0, 0.2, 0, lamp, 8); arm.rotation.z = 0.25;
    const shade = mesh(new THREE.ConeGeometry(0.07, 0.1, 20, 1, true), std({ color: 0x1c1d22, side: THREE.DoubleSide, roughness: 0.4 }), -0.08, 0.38, 0.05, lamp);
    shade.rotation.z = -0.9;
    const lampBulb = mesh(new THREE.SphereGeometry(0.022, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffd9a0, emissiveIntensity: 4 }), -0.1, 0.35, 0.05, lamp, false, false);
    const lampLight = new THREE.PointLight(0xffd9a0, 0.35, 2.5, 2); lampLight.position.set(-0.12, 0.3, 0.06); lamp.add(lampLight);
    // monitor glow (color follows the chart)

  W.applyItems = (owned) => {

// paint the head's color map: skin + blush + stubble + lip tint
function paintFace(spec) {
  const W = 512, H = 256;
  const c = newCanvas(W, H), ctx = c.getContext('2d');

  const base = `rgb(${sk.r * 255 | 0},${sk.g * 255 | 0},${sk.b * 255 | 0})`;

  ctx.drawImage(charTextures().skin.color, W / 2, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // cheeks
  for (const s of [-1, 1]) {
    const g = ctx.createRadialGradient(fx + s * W * 0.055, H * 0.6, 2, fx + s * W * 0.055, H * 0.6, W * 0.05);
    g.addColorStop(0, 'rgba(200,80,80,0.22)'); g.addColorStop(1, 'rgba(200,80,80,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // eye sockets slightly darker
  for (const s of [-1, 1]) {
    const g = ctx.createRadialGradient(fx + s * W * 0.055, H * 0.47, 1, fx + s * W * 0.055, H * 0.47, W * 0.035);
    g.addColorStop(0, 'rgba(70,40,40,0.25)'); g.addColorStop(1, 'rgba(70,40,40,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // lips, mouth line, nostrils
  const lipCol = new THREE.Color(spec.skin).lerp(new THREE.Color(0x9a3a44), 0.45);
  const lc = `rgb(${lipCol.r * 255 | 0},${lipCol.g * 255 | 0},${lipCol.b * 255 | 0})`;
  const ell = (x, y, rx, ry, fill, alpha = 1) => {
    const [u, v] = headUV(x, y, W, H), [u2] = headUV(x + rx, y, W, H), [, v2] = headUV(x, y - ry, W, H);
    ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(u, v, Math.abs(u2 - u), Math.abs(v2 - v), 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  };
  ell(0, -0.0405, 0.0185, 0.0035, lc, 0.85);
  ell(0, -0.0495, 0.0155, 0.0048, lc, 0.9);
  ell(0, -0.0445, 0.0195, 0.0009, 'rgb(60,20,24)', 0.85);
  for (const sx of [-1, 1]) { ell(sx * 0.0085, -0.0228, 0.0035, 0.0018, 'rgb(40,20,18)', 0.6); ell(sx * 0.031, -0.0015, 0.012, 0.004, 'rgba(90,50,50,1)', 0.12); }
  if (spec.stubble) {
    const rnd = mulberry32(5);
    ctx.fillStyle = spec.stubbleColor || 'rgba(40,28,20,0.5)';
    for (let i = 0; i < 9000; i++) {
      const u = fx + (rnd() - 0.5) * W * 0.34, v = H * (0.6 + rnd() * 0.32);
      const du = Math.abs(u - fx) / (W * 0.17), dv = (v / H - 0.6) / 0.32;
      if (du * du + (1 - dv) * (1 - dv) * 0.8 > 1.05 && dv < 0.55) continue;
      if (Math.abs(u - fx) < W * 0.03 && v < H * 0.7) continue;
      ctx.globalAlpha = 0.25 + rnd() * 0.35;
      ctx.fillRect(u, v, 1.2, 1.2);
    }
    ctx.globalAlpha = 1;
  }
  if (spec.freckles) {
    const rnd = mulberry32(9);
    ctx.fillStyle = 'rgba(140,80,50,0.45)';
    for (let i = 0; i < 70; i++) { ctx.beginPath(); ctx.arc(fx + (rnd() - 0.5) * W * 0.16, H * (0.52 + rnd() * 0.08), 0.8 + rnd(), 0, 7); ctx.fill(); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function irisTexture(color) {
  const S = 128, c = newCanvas(S), ctx = c.getContext('2d');

  const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.12, S / 2, S / 2, S / 2);

  g.addColorStop(0.75, `rgb(${col.r * 255 | 0},${col.g * 255 | 0},${col.b * 255 | 0})`);
