<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RUGGED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas with a corner HUD. The PC is a full-screen trading
   terminal: top bar, icon rail, and a content area of panels. */
:root {
  --bg-0: #07090d; --bg-1: #0c1016; --bg-2: #11161e; --bg-3: #171e28; --bg-4: #1d2531;
  --line: #1f2733; --line-2: #2a3442; --line-3: #364253;
  --text: #e8edf4; --text-2: #a3adbd; --text-3: #687387;
  --brand: #ffb547; --brand-ink: #2a1a05; --brand-soft: rgba(255,181,71,0.12);
  --up: #1fd18a; --up-soft: rgba(31,209,138,0.12); --down: #ff4d61; --down-soft: rgba(255,77,97,0.12);
  --info: #4aa8ff; --info-soft: rgba(74,168,255,0.12); --warn: #ffc04d; --warn-soft: rgba(255,192,77,0.12);
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 6px; --r: 9px; --r-lg: 12px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg-0); color: var(--text); overflow: hidden; font: 500 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 600 11px var(--mono); background: var(--bg-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--text-2); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .mut { color: var(--text-2); } .dim { color: var(--text-3); }
.logo { font-family: var(--display); font-weight: 400; letter-spacing: 0.04em; color: var(--brand); text-shadow: 0 0 24px rgba(255,181,71,0.35), 0 4px 0 #6a3b00; margin: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg-3); color: var(--text); font-weight: 650; font-size: 13px; cursor: pointer; transition: background .12s, border-color .12s, color .12s, transform .06s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg-4); border-color: var(--line-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible, .chip:focus-visible, .nav-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover:not(:disabled) { background: #ffc266; border-color: #ffc266; }
.btn.buy { background: var(--up-soft); border-color: rgba(31,209,138,0.35); color: #7df0c0; }
.btn.buy:hover:not(:disabled) { background: rgba(31,209,138,0.2); }
.btn.sell { background: var(--down-soft); border-color: rgba(255,77,97,0.35); color: #ff9aa6; }
.btn.sell:hover:not(:disabled) { background: rgba(255,77,97,0.2); }
.btn.danger { background: #c92a42; border-color: #e0465c; color: #fff; }
.btn.info { background: var(--info-soft); border-color: rgba(74,168,255,0.35); color: #a9d3ff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }
.btn.lg { height: 46px; font-size: 15px; padding: 0 20px; }
.btn.sm { height: 30px; font-size: 12px; padding: 0 10px; }
.btn.block { width: 100%; }
.grid-btns { display: grid; gap: 6px; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text-2); font-weight: 650; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.chip:hover { color: var(--text); border-color: var(--line-3); }
.chip.on { color: var(--text); background: var(--brand-soft); border-color: rgba(255,181,71,0.5); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; background: var(--bg-4); color: var(--text-2); white-space: nowrap; }
.badge.up { background: var(--up-soft); color: var(--up); } .badge.down { background: var(--down-soft); color: var(--down); }
.badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.info { background: var(--info-soft); color: var(--info); }
.badge.brand { background: var(--brand-soft); color: var(--brand); }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
body:not(.playing) #hud, body.in-pc #hud > :not(#toasts) { display: none; }
.hud-tl { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 8px; width: min(300px, 62vw); padding: 12px 14px; border-radius: var(--r-lg); background: rgba(9,11,16,0.72); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(8px); }
.money b { font: 600 22px var(--mono); }
.money span { display: block; font: 500 12.5px var(--mono); color: var(--text-2); }
.social { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
.social b { color: var(--text); font-family: var(--mono); font-weight: 600; }
#h-cred[data-level=bad] { color: var(--down); } #h-cred[data-level=warn] { color: var(--warn); }
.energy label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-3); font-weight: 700; }
.bar { height: 5px; width: 100%; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #8af06b, var(--up)); transition: width .3s; }
#objective { font-size: 12.5px; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 8px; line-height: 1.4; }
#objective:empty { display: none; }
#objective span { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); font-weight: 800; }
.hud-tr { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); text-align: right; padding: 10px 14px; border-radius: var(--r-lg); background: rgba(9,11,16,0.6); backdrop-filter: blur(8px); }
.hud-tr b { display: block; font: 800 12px var(--ui); letter-spacing: 0.14em; color: var(--brand); }
.hud-tr span { font: 500 13px var(--mono); color: var(--text-2); }
#coinbar { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.tick { display: flex; align-items: center; gap: 7px; background: rgba(9,11,16,0.8); border: 1px solid rgba(255,255,255,0.07); border-radius: 999px; padding: 4px 11px 4px 4px; font: 500 12px var(--mono); backdrop-filter: blur(6px); }
.tick i { font-style: normal; } .tick.up i { color: var(--up); } .tick.down i { color: var(--down); }
#crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 0 0 1.5px rgba(0,0,0,0.5); }
#prompt { position: absolute; left: 50%; top: calc(50% + 32px); transform: translateX(-50%); background: rgba(9,11,16,0.85); border: 1px solid rgba(255,255,255,0.08); padding: 7px 12px; border-radius: 8px; font-weight: 650; font-size: 13px; white-space: nowrap; backdrop-filter: blur(6px); }
#subtitle { position: absolute; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); transform: translateX(-50%); max-width: min(720px, 88vw); background: rgba(9,11,16,0.86); padding: 10px 16px; border-radius: 10px; text-align: center; backdrop-filter: blur(6px); }
#subtitle b { color: var(--brand); margin-right: 6px; }
#toasts { position: absolute; top: max(74px, calc(env(safe-area-inset-top) + 64px)); right: max(16px, env(safe-area-inset-right)); display: grid; gap: 8px; width: min(360px, 72vw); z-index: 40; pointer-events: none; }
body.in-pc #toasts { top: auto; bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px)); right: max(24px, calc(env(safe-area-inset-right) + 16px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; background: rgba(17,22,30,0.97); border: 1px solid var(--line-2); padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,0.4); animation: tin .25s ease-out; }
.toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--info); margin-top: 6px; flex: none; }
.toast.good .dot { background: var(--up); } .toast.bad .dot { background: var(--down); }
.toast.msg .av { width: 26px; height: 26px; }
.toast b { display: block; font-size: 12px; color: var(--text-2); }
.toast.out { opacity: 0; transform: translateX(16px); transition: all .45s; }
@keyframes tin { from { opacity: 0; transform: translateX(16px); } }

/* touch */
#touch { position: absolute; inset: 0; touch-action: none; }
body:not(.playing) #touch, body.in-pc #touch { display: none; }
#stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.05); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.3); transform: translate(-50%,-50%); }
.tbtns { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); display: flex; gap: 10px; align-items: flex-end; }
.tbtns button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(9,11,16,0.8); display: grid; place-items: center; }
#use-btn { width: 76px; height: 76px; background: var(--brand); color: var(--brand-ink); font-weight: 800; }

/* ===================== PC: terminal OS ===================== */
#pc { position: absolute; inset: 0; z-index: 20; background: var(--bg-0); animation: pcin .25s ease-out; }
@keyframes pcin { from { opacity: 0; } }
.os { position: absolute; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: radial-gradient(1200px 600px at 80% -10%, rgba(255,181,71,0.06), transparent 60%), var(--bg-0); }
.os-top { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--line); background: rgba(12,16,22,0.9); flex: none; }
.brandmark { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; margin-right: 6px; }
.brandmark .bm { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #ffcf7a, #ff9a2e); display: grid; place-items: center; color: var(--brand-ink); font: 400 13px var(--display); box-shadow: 0 0 18px rgba(255,181,71,0.35); }
.brandmark small { color: var(--text-3); font-weight: 600; }
.os-search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); color: var(--text-3); }
.os-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 13px; }
.os-pills { display: flex; gap: 6px; margin-left: auto; }
.pill { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); font: 600 12.5px var(--mono); white-space: nowrap; }
.pill .lbl { font: 700 10px var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.os-clock { font: 500 12.5px var(--mono); color: var(--text-3); padding: 0 6px; }
.os-body { flex: 1; display: flex; min-height: 0; }
.os-nav { width: 76px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; border-right: 1px solid var(--line); background: rgba(12,16,22,0.7); overflow-y: auto; }
.nav-btn { position: relative; display: grid; justify-items: center; gap: 4px; padding: 9px 2px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--text-3); cursor: pointer; }
.nav-btn svg.i { width: 20px; height: 20px; }
.nav-btn em { font-style: normal; font-size: 10.5px; font-weight: 700; }
.nav-btn:hover { color: var(--text); background: var(--bg-2); }
.nav-btn.on { color: var(--text); background: var(--bg-3); }
.nav-btn.on::before { content: ''; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
.nav-btn .nb { position: absolute; top: 4px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--down); color: #fff; font: 700 10px var(--ui); display: grid; place-items: center; }
.os-main { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 22px 28px; scrollbar-color: var(--line-2) transparent; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.page-head p { margin: 3px 0 0; color: var(--text-2); font-size: 13px; }
.panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-h h3 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.panel-b { padding: 14px; }
.stack { display: grid; gap: 12px; align-content: start; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--text-2); }
.kv b { font: 600 13px var(--mono); text-align: right; }
.kv small { color: var(--text-3); font-weight: 500; margin-left: 4px; }
.lbl-sm { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin: 14px 0 7px; }
.lbl-sm:first-child { margin-top: 0; }
.hint { color: var(--text-3); font-size: 12.5px; line-height: 1.5; margin: 8px 0 0; }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 8px; background: var(--warn-soft); color: #ffd78a; font-size: 12.5px; line-height: 1.45; }
.note.bad { background: var(--down-soft); color: #ffb0ba; }
.ci { border-radius: 50%; flex: none; display: block; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #0c1016; flex: none; }
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 34px 16px; color: var(--text-2); }
.empty h3 { margin: 0; color: var(--text); font-size: 16px; }
.empty .icons { display: flex; margin-bottom: 4px; } .empty .icons img { margin-left: -10px; border: 2px solid var(--bg-1); border-radius: 50%; }

/* home */
.home { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.nw { padding: 18px; display: grid; gap: 4px; }
.nw .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.nw .big { font: 600 34px var(--mono); letter-spacing: -0.02em; }
.nw canvas { width: 100%; height: 84px; margin-top: 8px; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.stats4 > div { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; }
.stats4 > div:last-child { border-right: 0; }
.stats4 label, .stat label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.stats4 b, .stat b { font: 600 16px var(--mono); }
.rowlist { display: grid; }
.row { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--bg-2); }
.row .nm { min-width: 0; flex: 1; } .row .nm b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .row .nm span { font-size: 12px; color: var(--text-3); }
.row .rv { text-align: right; font: 600 13px var(--mono); } .row .rv small { display: block; font-size: 11.5px; }
.row canvas { width: 70px; height: 28px; }
.obj { padding: 14px; display: grid; gap: 8px; }
.obj b { font-size: 14.5px; }
.prog { height: 6px; background: var(--bg-3); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }

/* trenches */
.trench { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tcol .panel-h h3 { display: flex; gap: 8px; align-items: center; }
.tcol .cards { display: grid; gap: 8px; padding: 10px; max-height: calc(100vh - 230px); overflow-y: auto; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg-2); cursor: pointer; display: grid; gap: 8px; transition: border-color .12s, background .12s; }
.tcard:hover { border-color: var(--line-3); background: var(--bg-3); }
.tcard.mine { border-color: rgba(255,181,71,0.45); }
.tcard.hold { box-shadow: inset 3px 0 0 var(--up); }
.tc-top { display: flex; gap: 10px; align-items: center; }
.tc-top .nm { flex: 1; min-width: 0; } .tc-top .nm b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tc-top .nm span { font: 500 11.5px var(--mono); color: var(--text-3); }
.tc-mc { text-align: right; font: 600 13.5px var(--mono); } .tc-mc small { display: block; font-size: 11px; color: var(--text-3); font-weight: 500; }
.tc-meta { display: flex; gap: 10px; font: 500 11.5px var(--mono); color: var(--text-3); flex-wrap: wrap; align-items: center; }
.tc-meta .badge { font-family: var(--ui); }
.tc-curve { height: 4px; background: var(--bg-4); border-radius: 2px; overflow: hidden; } .tc-curve i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--up)); }
.tc-act { display: flex; gap: 6px; }
.tc-act .btn { flex: 1; height: 28px; font-size: 12px; }
.snipe { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--bg-4); border: 1px solid var(--line-2); cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-2); transition: transform .15s; }
.switch.on { background: var(--up-soft); border-color: rgba(31,209,138,0.5); } .switch.on::after { transform: translateX(16px); background: var(--up); }

/* terminal */
.tk-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.tk-name { min-width: 0; }
.tk-name h2 { margin: 0; font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; letter-spacing: -0.01em; }
.tk-name .sub { display: flex; gap: 8px; align-items: center; margin-top: 3px; color: var(--text-3); font: 500 12px var(--mono); flex-wrap: wrap; }
.ca { display: inline-flex; gap: 5px; align-items: center; padding: 1px 7px; border-radius: 5px; background: var(--bg-3); cursor: pointer; }
.tk-stats { display: flex; gap: 0; margin-left: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-1); overflow: hidden; flex-wrap: wrap; }
.tk-stats .stat { padding: 8px 14px; border-right: 1px solid var(--line); }
.tk-stats .stat:last-child { border-right: 0; }
.tk-stats .stat b { font-size: 14px; }
.tk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
.chart-panel { display: flex; flex-direction: column; min-height: 420px; }
.chart-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-3); }
.chart-bar .sp { flex: 1; }
.chart-wrap { position: relative; flex: 1; min-height: 300px; }

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const logRand = (a, b) => Math.exp(rand(Math.log(a), Math.log(b)));
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Poisson sample for small lambdas
function poisson(lambda) {
  if (lambda <= 0) return 0;
  if (lambda > 30) return Math.max(0, Math.round(lambda + Math.sqrt(lambda) * gauss()));
  const L = Math.exp(-lambda); let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function fakeAddr() {
  let s = '';
  for (let i = 0; i < 44; i++) s += B58[Math.floor(Math.random() * 58)];
  return s;
}
const shortAddr = (a) => a.slice(0, 4) + '…' + a.slice(-4);

function fmtUSD(n, opts = {}) {
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n >= 1e9) s = (n / 1e9).toFixed(2) + 'B';
  else if (n >= 1e6) s = (n / 1e6).toFixed(2) + 'M';
  else if (n >= 1e4 || (opts.compact && n >= 1e3)) s = (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K';
  else s = n.toLocaleString('en-US', { maximumFractionDigits: n < 10 ? 2 : 0, minimumFractionDigits: n < 10 && n > 0 ? 2 : 0 });
  return (neg ? '-$' : '$') + s;
}
function fmtSOL(n) {
  const a = Math.abs(n);
  const d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : 3;
  return n.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
}
function fmtNum(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(Math.round(n));
}
// 0.0000412 -> "0.0₄412" (how memecoin screeners show tiny prices)
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
function fmtPrice(p) {
  if (p <= 0) return '0';
  if (p >= 0.01) return p.toPrecision(4);
  const s = p.toExponential(3); // e.g. 4.123e-5
  const [m, e] = s.split('e');
  const zeros = -parseInt(e, 10) - 1;
  const digits = m.replace('.', '').slice(0, 4);
  const sub = String(zeros).split('').map((d) => SUBS[+d]).join('');
  return '0.0' + sub + digits;
}
function fmtPct(x, signed = true) {
  const s = (x * 100).toFixed(Math.abs(x) < 0.1 ? 1 : 0) + '%';
  return signed && x > 0 ? '+' + s : s;
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}m ${String(s).padStart(2, '0')}s` : `${s}s`;
}
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function chatFill(s, coin, extra = {}) {
  return s.replace('${t}', '$' + coin.ticker).replace('{n}', (extra.n ?? rand(0.1, 2)).toFixed(1)).replace('{k}', extra.k || '@someone');
}

let COIN_SEQ = 1;

class Coin {
  constructor(o) {
    this.id = o.id ?? COIN_SEQ++;
    this.name = o.name; this.ticker = o.ticker; this.kind = o.kind; this.hue = o.hue ?? 120;
    this.desc = o.desc || '';
    this.type = o.type || 'pump';
    this.addr = fakeAddr();
    this.devAddr = o.devAddr || fakeAddr();
    this.devHistory = o.devHistory || 0;   // previous rugs traced to this dev wallet
    this.t = 0;
    this.supply = SUPPLY;
    this.phase = 'curve';
    this.vSol = V_SOL0; this.vTok = V_TOK0; this.realSol = 0; this.curveTokLeft = CURVE_TOK;
    this.poolSol = 0; this.poolTok = 0; this.lp = 'burned'; this.lockUntil = 0; this.lpSeed = 0;
    this.holders = [];
    this.exited = { count: 0, lossCount: 0, lossSol: 0, gainSol: 0 };
    this.dev = { main: { addr: this.devAddr, tokens: 0, cost: 0, start: 0 }, soldFrac: 0, soldAny: false };
    this.devCost = 0; this.devProceeds = 0; this.creatorFees = 0; this.feesClaimed = 0;
    this.memeScore = o.memeScore ?? 1;
    this.metaMult = o.metaMult ?? 1;
    this.attnImp = 0; this.attnTrend = 0; this.panic = 0; this.kolBoost = 0; this.chirpBoost = 0; this.chirpBuys = 0; this.chirpSize = 1;
    this.shills = 0; this.lies = 0; this.antiSnipe = !!o.antiSnipe;
    this.candles = []; this.trades = []; this.chat = []; this.events = [];
    this.volume = 0; this.recentVol = [];
    this.priceHist = []; this._phTimer = 0;
    this.athMcap = 0; this.peakHolders = 0;
    this.kolQueue = []; this.snipeQueue = [];
    this.lastTradeT = 0; this.kothDone = false; this.ended = false; this.result = null;
    this._chatTimer = rand(1, 3); this._mood = 'launch';
    this.rugMethod = null; this.closedAt = null; this.graduated = false; this.dead = false; this.recentBuys = [];
  }

  // ---------- pricing ----------
  price() {
    if (this.phase === 'curve') return this.vSol / this.vTok;
    if (this.poolTok > 0 && this.poolSol > 0) return this.poolSol / this.poolTok;
    return 0;
  }
  mcapSol() { return this.price() * this.supply; }
  progress() { return this.phase === 'curve' ? (CURVE_TOK - this.curveTokLeft) / CURVE_TOK : 1; }
  liquiditySol() { return this.phase === 'curve' ? this.realSol : this.poolSol; }
  isLive() { return this.phase === 'curve' || this.phase === 'dex'; }
  devTokens() { return this.dev.main.tokens; }

  quoteSell(tokIn) {
    if (tokIn <= 0) return 0;
    if (this.phase === 'curve') {
      const k = this.vSol * this.vTok;
      return Math.min(this.vSol - k / (this.vTok + tokIn), this.realSol) * (1 - CURVE_FEE);
    }
    if (this.phase === 'dex' && this.poolTok > 0) {
      const k = this.poolSol * this.poolTok;
      return (this.poolSol - k / (this.poolTok + tokIn)) * (1 - DEX_FEE);
    }
    return 0;
  }
  quoteBuy(solIn) {
    if (this.phase === 'curve') {
      const net = solIn * (1 - CURVE_FEE), k = this.vSol * this.vTok;
      return Math.min(this.vTok - k / (this.vSol + net), this.curveTokLeft);
    }
    if (this.phase === 'dex') {
      const net = solIn * (1 - DEX_FEE), k = this.poolSol * this.poolTok;
      return this.poolTok - k / (this.poolSol + net);
    }
    return 0;
  }

  // ---------- core swaps ----------
  _buy(solIn) {
    if (solIn <= 0) return { tokens: 0, sol: 0 };
    if (this.phase === 'curve') {
      let net = solIn * (1 - CURVE_FEE);
      const k = this.vSol * this.vTok;
      let out = this.vTok - k / (this.vSol + net);
      if (out >= this.curveTokLeft) {
        out = this.curveTokLeft;
        net = k / (this.vTok - out) - this.vSol;
        solIn = net / (1 - CURVE_FEE);
      }
      this.vSol += net; this.vTok -= out; this.realSol += net; this.curveTokLeft -= out;
      this.volume += solIn;
      if (this.curveTokLeft <= 1) this._graduate();
      return { tokens: out, sol: solIn };
    }
    if (this.phase === 'dex') {
      const net = solIn * (1 - DEX_FEE);
      const k = this.poolSol * this.poolTok;
      const out = this.poolTok - k / (this.poolSol + net);
      this.poolSol += net; this.poolTok -= out;
      this.volume += solIn;
      return { tokens: out, sol: solIn };
    }
    return { tokens: 0, sol: 0 };
  }
  _sell(tokIn) {
    if (tokIn <= 0) return 0;
    if (this.phase === 'curve') {
      const k = this.vSol * this.vTok;
      const out = Math.min(this.vSol - k / (this.vTok + tokIn), this.realSol);
      this.vSol -= out; this.vTok += tokIn; this.realSol -= out; this.curveTokLeft += tokIn;
      this.volume += out;
      return out * (1 - CURVE_FEE);
    }
    if (this.phase === 'dex' && this.poolTok > 0) {
      const k = this.poolSol * this.poolTok;
      const out = this.poolSol - k / (this.poolTok + tokIn);
      this.poolSol -= out; this.poolTok += tokIn;
      this.volume += out;
      return out * (1 - DEX_FEE);
    }
    return 0;
  }

  _graduate() {
    this.phase = 'dex'; this.graduated = true;
    this.poolSol = Math.max(1, this.realSol - MIGRATION_FEE);
    this.poolTok = LP_TOK;
    this.realSol = 0;
    this.lp = 'burned';
    this.attnImp += 1.1;
    this._event('graduated', `$${this.ticker} graduated! ${fmtSOL(this.poolSol)} SOL + ${fmtNum(LP_TOK)} tokens seeded a DEX pool. LP tokens burned.`);
    this._burstChat('grad', 4);
  }

  // ---------- bookkeeping ----------
  _event(type, text, data = {}) { this.events.push({ type, text, t: this.t, ...data }); }
  _trade(side, sol, tokens, who) {
    const mc = this.mcapSol();
    this.trades.push({ t: this.t, side, sol, tokens, who: who.handle || shortAddr(who.addr || fakeAddr()), type: who.type || '', via: who.via || '', dev: !!who.dev, mcap: mc });
    if (this.trades.length > 80) this.trades.splice(0, this.trades.length - 80);
    this.recentVol.push([this.t, sol]);
    if (!who.dev) this.creatorFees += sol * CREATOR_FEE;
    if (side === 'buy' && !who.dev) this.recentBuys.push([this.t, sol]);
    this.lastTradeT = this.t;
    this._mark(mc, sol);
  }
  _mark(mc, vol = 0) {
    const ci = Math.floor(this.t / CANDLE_SEC);
    let c = this.candles[this.candles.length - 1];
    if (!c || c.i !== ci) {
      const o = c ? c.c : mc;
      // fill gaps so the chart has a continuous time axis
      if (c) for (let i = c.i + 1; i < ci; i++) this.candles.push({ i, o: c.c, h: c.c, l: c.c, c: c.c, v: 0 });
      c = { i: ci, o, h: Math.max(o, mc), l: Math.min(o, mc), c: mc, v: 0 };
      this.candles.push(c);
      if (this.candles.length > 400) this.candles.splice(0, this.candles.length - 400);
    }
    c.c = mc; c.h = Math.max(c.h, mc); c.l = Math.min(c.l, mc); c.v += vol;
    if (mc > this.athMcap) this.athMcap = mc;
  }
  _say(who, text, kind = 'holder') {
    this.chat.push({ t: this.t, who, text, kind });
    if (this.chat.length > 120) this.chat.splice(0, this.chat.length - 120);
  }
  _burstChat(mood, n, extra) {
    for (let i = 0; i < n; i++) {
      const txt = chatFill(pick(CHAT[mood]), this, extra);
      setTimeoutSim(this, rand(0.2, 4), () => this._say(pick(HANDLES), txt));
    }
  }

  _newHolder(type, r, extra = {}) {
    const cfg = TT[type];
    const h = {
      addr: fakeAddr(), handle: chance(0.55) ? pick(HANDLES) : null, type,
      tokens: r.tokens, cost: r.sol, proceeds: 0, avg: r.sol / r.tokens,
      tp: rand(cfg.tp[0], cfg.tp[1]), sl: rand(cfg.sl[0], cfg.sl[1]),
      hold: rand(cfg.hold[0], cfg.hold[1]), paper: cfg.paper, born: this.t, failed: false, ...extra,
    };
    this.holders.push(h);
    return h;
  }
  _spawnBuyer(type, sol, extra) {
    if (!this.isLive()) return null;
    const r = this._buy(sol);
    if (r.tokens <= 0) return null;
    const h = this._newHolder(type, r, extra);
    this._trade('buy', r.sol, r.tokens, h);
    if (type === 'whale') this._event('whale', `🐋 Whale bought ${fmtSOL(r.sol)} SOL of $${this.ticker}`);
    return h;
  }
  _holderSell(h, frac) {
    const tk = h.tokens * frac;
    const sol = this._sell(tk);
    h.tokens -= tk; h.proceeds += sol;
    this._trade('sell', sol, tk, h);
    if (h.tokens < 1) {
      h.tokens = 0;
      const pnl = h.proceeds - h.cost;
      this.exited.count++;
      if (pnl < 0) { this.exited.lossCount++; this.exited.lossSol -= pnl; } else this.exited.gainSol += pnl;
    }
  }

  // ---------- RugRadar ----------
  risk() {
    const flags = [];
    let s = 0;
    const add = (pts, level, label, detail) => { s += pts; flags.push({ level, label, detail }); };
    add(0, 'ok', 'Mint authority', 'Revoked: nobody can print more tokens.');
    if (this.phase === 'curve') add(0, 'ok', 'Liquidity', 'On bonding curve. LP will be burned automatically at graduation.');
    else if (this.lp === 'burned') add(0, 'ok', 'Liquidity: BURNED', 'LP tokens were sent to a burn address. Liquidity can never be pulled.');
    else if (this.lp === 'locked') {
      const left = this.lockUntil - this.t;
      add(left < 120 ? 18 : 8, left < 120 ? 'warn' : 'warn', `Liquidity: LOCKED (${fmtDur(left)} left)`, 'LP tokens are in a time-lock. When it expires the dev can pull everything. Short locks are a red flag.');
    } else if (this.phase === 'dex') add(34, 'bad', 'Liquidity: NOT LOCKED', 'The dev holds the LP tokens and can remove all liquidity at any moment (a "hard rug").');
    const devPct = this.dev.main.tokens / this.supply;
    if (devPct > 0.1) add(18, 'bad', `Dev holds ${fmtPct(devPct, false)}`, 'A big dev bag can be dumped on buyers.');
    else if (devPct > 0.04) add(9, 'warn', `Dev holds ${fmtPct(devPct, false)}`, 'Moderate dev holdings.');
    else add(0, 'ok', `Dev holds ${fmtPct(devPct, false)}`, 'Small or no dev bag.');
    const top = this.top10Pct();
    if (top > 0.4) add(14, 'bad', `Top 10 holders: ${fmtPct(top, false)}`, 'Supply is concentrated. A few wallets can crash the price.');
    else if (top > 0.25) add(7, 'warn', `Top 10 holders: ${fmtPct(top, false)}`, 'Somewhat concentrated supply.');
    else add(0, 'ok', `Top 10 holders: ${fmtPct(top, false)}`, 'Healthy distribution.');
    if (this.dev.soldAny) add(16, 'bad', `Dev sold ${fmtPct(Math.min(1, this.dev.soldFrac), false)} of bag`, 'The creator wallet is selling.');
    if (this.devHistory > 0) add(Math.min(36, 12 * this.devHistory), 'bad', `Dev wallet linked to ${this.devHistory} previous rug${this.devHistory > 1 ? 's' : ''}`, 'On-chain history never forgets.');
    if (this.t < 60 && this.isLive()) add(4, 'warn', 'Brand new token', 'Launched less than a minute ago.');
    return { score: clamp(Math.round(s), 0, 100), flags };
  }
  top10Pct() {
    const bags = this.holders.map((h) => h.tokens);
    bags.push(this.dev.main.tokens);
    bags.sort((a, b) => b - a);
    let s = 0; for (let i = 0; i < 10 && i < bags.length; i++) s += bags[i];
    return s / this.supply;
  }
  holderCount() {
    let n = 0; for (const h of this.holders) if (h.tokens > 0) n++;
    if (this.dev.main.tokens > 0) n++;
    return n;
  }

  // ---------- tick ----------
  tick(dt, env) {
    if (this.ended) return;
    this.t += dt;
    runSimTimers(this);
    const price0 = this.price();

    // price history (1s samples) for momentum
    this._phTimer -= dt;
    if (this._phTimer <= 0) {
      this._phTimer = 1; this.priceHist.push(price0);
      if (this.priceHist.length > 90) this.priceHist.shift();
      this._mark(this.mcapSol(), 0);
      const cut = this.t - 30;
      while (this.recentVol.length && this.recentVol[0][0] < cut) this.recentVol.shift();
      while (this.recentBuys.length && this.recentBuys[0][0] < cut) this.recentBuys.shift();
      const bh = this.holderCount(); if (bh > this.peakHolders) this.peakHolders = bh;
    }

    // lock expiry
    if (this.lp === 'locked' && this.t >= this.lockUntil) {
      this.lp = 'dev'; this.panic = Math.min(1, this.panic + 0.35);
      this._event('unlock', `LP lock on $${this.ticker} expired. You control the liquidity again.`);
      this._burstChat('unlock', 3);
    }
    if (!this.isLive()) return;

    // snipers
    while (this.snipeQueue.length && this.snipeQueue[0].at <= this.t) {
      const s = this.snipeQueue.shift();
      const h = this._spawnBuyer('sniper', s.sol);
      if (h && chance(0.6)) { h.hold = rand(2, 9); h.tp = rand(1.05, 1.35); }
    }
    // KOL pipeline
    for (const k of this.kolQueue) {
      if (k.stage === 0 && this.t >= k.buyAt) {
        k.stage = 1;
        this._spawnBuyer('kol', k.kol.bag, { handle: null, kolName: k.kol.handle });
      }
      if (k.stage === 1 && this.t >= k.postAt) {
        k.stage = 2;
        const reach = k.kol.reach * (0.75 + 0.5 * this.memeScore) * env.sentiment;
        this.attnImp += reach * 0.55; this.kolBoost += reach;
        this._event('kol', `${k.kol.handle} posted about $${this.ticker} to ${fmtNum(k.kol.followers)} followers.`);
        this._burstChat('kol', 4, { k: k.kol.handle });
      }
    }
    this.kolQueue = this.kolQueue.filter((k) => k.stage < 2);

    // attention dynamics
    this.attnImp *= Math.exp(-dt / 55);
    this.panic *= Math.exp(-dt / 16);
    this.kolBoost *= Math.exp(-dt / 22);
    this.chirpBoost *= Math.exp(-dt / 26);
    this.chirpSize = 1 + (this.chirpSize - 1) * Math.exp(-dt / 60);
    const vol30 = this.recentVol.reduce((a, v) => a + v[1], 0);
    const buy30 = this.recentBuys.reduce((a, v) => a + v[1], 0);
    const novelty = Math.exp(-this.t / 210);
    this.attnTrend = 0.32 * Math.tanh(buy30 / 70) * this.memeScore * novelty;
    if (chance(dt * Math.max(0, this.memeScore - 0.85) * 0.006 * env.sentiment)) {
      this.attnImp += rand(0.5, 1.2);
      this._event('viral', `$${this.ticker} is going viral on Chirp! Organic buyers incoming.`);
      this._burstChat('pump', 3);
    }
    if (!this.kothDone && this.phase === 'curve' && this.progress() >= 0.5) {
      this.kothDone = true; this.attnImp += 0.45;
      this._event('koth', `$${this.ticker} hit King of the Hill on PumpBin (50% of curve). Front page visibility!`);
    }

    // momentum / FOMO
    const ph = this.priceHist;
    const p20 = ph.length > 20 ? ph[ph.length - 21] : ph[0] || price0;
    const mom = price0 / Math.max(1e-18, p20);
    const fomo = clamp(1 + 0.8 * (mom - 1), 0.35, 1.9);
    const risk = this.risk().score;
    const mcNow = this.mcapSol();
    const ddF = 0.3 + 0.7 * Math.sqrt(clamp(mcNow / Math.max(1e-9, this.athMcap), 0, 1));
    let base = (this.attnImp + this.attnTrend + 0.02 * novelty) * env.sentiment * fomo * ddF * (1 - 0.85 * this.panic);
    if (this.dead) base = this.attnImp > 0.3 ? base : 0;
    const liqF = clamp(this.liquiditySol() / 80, 0.15, 2.5);

    for (const type of ['degen', 'smart', 'whale', 'diamond']) {
      const cfg = TT[type];
      const trust = clamp(1 - (risk / 100) * cfg.smart * 1.5, 0.03, 1);
      let lambda = base * cfg.w * trust * 1.25;
      if (type === 'whale') lambda *= liqF;
      const n = poisson(lambda * dt);
      for (let i = 0; i < n; i++) this._spawnBuyer(type, logRand(cfg.buy[0], cfg.buy[1]) * env.sizeMult);
    }
    if (this.kolBoost > 0.02) {
      const n = poisson(this.kolBoost * 2.0 * dt * (1 - 0.7 * this.panic));
      for (let i = 0; i < n; i++) this._spawnBuyer('follower', logRand(TT.follower.buy[0], TT.follower.buy[1]) * env.sizeMult);
    }
    // buyers arriving from your own Chirp posts
    if (this.chirpBoost > 0.02) {
      const n = poisson(this.chirpBoost * 1.9 * dt * (1 - 0.7 * this.panic) * env.sentiment);
      for (let i = 0; i < n; i++) if (this._spawnBuyer('chirp', logRand(TT.chirp.buy[0], TT.chirp.buy[1]) * env.sizeMult * this.chirpSize, { via: 'chirp' })) this.chirpBuys++;
    }
    // the occasional dip-buyer among existing holders
    if (this.panic < 0.3 && mom < 0.9 && chance(dt * 0.6 * base)) {
      const h = pick(this.holders);
      if (h && h.tokens > 0 && h.type !== 'sniper' && h.type !== 'kol' && h.type !== 'you') {
        const r = this._buy(logRand(0.05, 0.8) * env.sizeMult);
        if (r.tokens > 0) { h.avg = (h.cost + r.sol) / (h.tokens + r.tokens); h.tokens += r.tokens; h.cost += r.sol; this._trade('buy', r.sol, r.tokens, h); }
      }
    }

    // holder exits
    const price = this.price();
    for (const h of this.holders) {
      if (h.tokens <= 0 || h.type === 'you') continue;
      const ratio = price / h.avg;
      let rate = 1 / h.hold;
      if (ratio >= h.tp) rate += 0.5;
      if (ratio <= h.sl) rate += 0.35;
      rate += this.panic * h.paper * 0.9;
      if (Math.random() < rate * dt) {
        const frac = ratio >= h.tp ? rand(0.4, 1) : (ratio <= h.sl || this.panic > 0.5 ? 1 : rand(0.5, 1));
        this._holderSell(h, frac);
        if (!this.isLive()) break;
      }
    }
    if (this.holders.length > 500) this.holders = this.holders.filter((h) => h.tokens > 0 || h.type === 'you');

    // moods + chat
    const p5 = ph.length > 5 ? ph[ph.length - 6] : price0;
    const m5 = price / Math.max(1e-18, p5);
    this._mood = this.t < 25 ? 'launch' : this.panic > 0.45 ? 'devsold' : m5 > 1.08 ? 'pump' : m5 < 0.93 ? 'dip' : (this.t - this.lastTradeT > 25 ? 'dead' : 'calm');
    this._chatTimer -= dt;
    if (this._chatTimer <= 0) {
      const activity = clamp(base, 0.05, 3);
      this._chatTimer = rand(1.2, 4) / activity;
      if (this._mood !== 'devsold') this._say(pick(HANDLES), chatFill(pick(CHAT[this._mood]), this));
    }

    // death
    if (!this.dead && this.t > 90 && this.t - this.lastTradeT > 40 && this.attnImp < 0.08) {
      this.dead = true;
      this._event('dead', `$${this.ticker} died. No buyers left. Most coins end like this. You can still sell or pull, or shill hard to revive it.`);
      this._burstChat('dead', 2);
    } else if (this.dead && this.attnImp > 0.3) {
      this.dead = false; this.lastTradeT = this.t;
      this._event('revive', `$${this.ticker} is getting attention again.`);
    }
  }

  // ---------- dev actions ----------
  devSell(frac) {
    if (!this.isLive()) return 0;
    const main = this.dev.main;
    const tk = main.tokens * frac;
    if (tk <= 0) return 0;
    let sol = this._sell(tk);
    main.tokens -= tk;
    this._trade('sell', sol, tk, { handle: 'DEV', dev: true });
    sol = Math.max(0, sol - DEV_TX_FEE);
    this.devProceeds += sol;
    const f = tk / Math.max(1, main.start);
    this.dev.soldAny = true; this.dev.soldFrac += f;
    this.panic = Math.min(1, this.panic + 0.22 + f * 0.75);
    this._event('devsold', this.npc ? `The $${this.ticker} dev sold ${Math.round(frac * 100)}% of their bag.` : `Your dev wallet sold ${fmtNum(tk)} $${this.ticker} for ${fmtSOL(sol)} SOL. Everyone saw it.`);
    this._burstChat('devsold', 3 + Math.round(f * 4));
    this.rugMethod = this.rugMethod || 'devdump';
    return sol;
  }
  canPull() { return this.phase === 'dex' && this.type === 'custom' && this.lp === 'dev'; }
  pullLiquidity() {
    if (!this.canPull()) return 0;
    const sol = this.poolSol;
    this.poolSol = 0; this.poolTok = 0;
    this.devProceeds += sol;
    this.phase = 'rugged'; this.rugMethod = 'lp';
    this._mark(0, 0);
    this.trades.push({ t: this.t, side: 'sell', sol, tokens: 0, who: 'DEV', dev: true, mcap: 0, lp: true });
    this._event('rugged', `You pulled ${fmtSOL(sol)} SOL of liquidity from $${this.ticker}. The chart is a vertical line down.`);
    this._event('extract', null, { sol, method: 'lp' });
    this._burstChat('rug', 8);
    return sol;
  }
  lockLP(sec) {
    if (this.lp !== 'dev' || this.phase !== 'dex') return false;
    this.lp = 'locked'; this.lockUntil = this.t + sec; this.attnImp += 0.2;
    this._event('lock', `LP locked for ${fmtDur(sec)}. Buyers feel safer. When it expires you can pull.`);
    return true;
  }
  burnLP() {
    if (this.lp !== 'dev' || this.phase !== 'dex') return false;
    this.lp = 'burned'; this.attnImp += 0.35;
    this._event('burn', 'LP burned. Nobody can pull the liquidity now — including you.');
    return true;
  }
  // A Chirp post about the coin: a burst of buyers who saw it, plus lingering attention.
  shill(power, size = 1) {
    const eff = power * Math.pow(0.8, this.shills);
    this.chirpSize = Math.max(this.chirpSize, size);
    this.shills++;
    this.attnImp += eff * 0.55;
    this.chirpBoost += eff;
    if (this.dead && eff > 0.3) this.attnImp += 0.3;
    return eff;
  }
  // Bad press: a sleuth thread, getting ratioed, a "taking profits" post.
  fud(power, text) {
    this.panic = Math.min(1, this.panic + power);
    this.attnImp *= 1 - Math.min(0.6, power * 0.5);
    if (text) this._event('fud', text);
    this._burstChat('dip', 2 + Math.round(power * 4));
  }
  telePost(kind) {
    // posting in the community chat to steer the mood
    if (kind === 'calm') { this.panic *= 0.55; this._say('DEV', pick(['relax guys, just a shakeout 🫡', 'not selling, building', 'jeets out, we good']), 'dev'); }
    if (kind === 'hype') { this.attnImp += 0.12; this._say('DEV', pick(['WE ARE GOING TO 10M', 'raid time, everyone to Chirp 🚀', 'who is ready for dex?']), 'dev'); }
  }
  // Dev buys more of their own coin: bigger bag, volume, and a confidence signal.
  devBuy(sol) {
    if (!this.isLive() || sol <= 0) return 0;
    const r = this._buy(sol);
    if (r.tokens <= 0) return 0;
    const m = this.dev.main;
    m.tokens += r.tokens; m.start += r.tokens; m.cost += r.sol;
    this.devCost += r.sol;
    this._trade('buy', r.sol, r.tokens, { handle: 'DEV', dev: true });
    this.recentBuys.push([this.t, r.sol * 0.5]);
    this.attnImp += Math.min(0.3, r.sol * 0.04);
    this.panic *= 0.7;
    this._event('devbuy', `Dev bought ${fmtSOL(r.sol)} more SOL of $${this.ticker}. Holders love to see it.`);
    if (chance(0.7)) this._burstChat('pump', 2);
    return r.tokens;
  }
  // ---------- you as a trader in someone else's coin ----------
  you() { return this.holders.find((h) => h.type === 'you') || null; }
  traderBuy(sol) {
    if (!this.isLive() || sol <= 0) return 0;
    const r = this._buy(sol);
    if (r.tokens <= 0) return 0;
    let h = this.you();
    if (!h) { h = this._newHolder('you', r, { handle: 'YOU', hold: 1e9 }); }
    else { h.tokens += r.tokens; h.cost += r.sol; h.avg = h.cost / h.tokens; }
    this._trade('buy', r.sol, r.tokens, { handle: 'YOU' });
    return r.tokens;
  }
  traderSell(frac) {
    const h = this.you();
    if (!h || h.tokens <= 0 || !this.isLive()) return 0;
    const tk = h.tokens * frac;
    const sol = this._sell(tk);
    h.tokens -= tk; h.proceeds += sol;
    this._trade('sell', sol, tk, { handle: 'YOU' });
    return sol;
  }
  queueKol(kol) {
    const buyAt = this.t + rand(3, 8);
    this.kolQueue.push({ kol, stage: 0, buyAt, postAt: buyAt + rand(4, 9) });
  }

  // ---------- end of life ----------
  close(solUsd) {
    if (this.ended) return this.result;
    this.ended = true; this.closedAt = this.t;
    const pNow = this.price();
    let victims = this.exited.lossCount, loss = this.exited.lossSol;
    for (const h of this.holders) {
      if (h.tokens <= 0) continue;
      const l = h.cost - h.proceeds - h.tokens * pNow;
      if (l > 0.005) { victims++; loss += l; }
    }
    const devLeft = this.devTokens() > 0 && this.isLive() ? this.quoteSell(this.devTokens()) : 0;
    this.result = {
      id: this.id, name: this.name, ticker: this.ticker, kind: this.kind, hue: this.hue, type: this.type,
      peakMcapUsd: this.athMcap * solUsd, devCost: this.devCost, devProceeds: this.devProceeds,
      profit: this.devProceeds - this.devCost, unsold: devLeft,
      victims, victimLossSol: loss, method: this.rugMethod || (this.dead ? 'died' : 'abandoned'),
      graduated: this.graduated,
      life: this.t, volume: this.volume, holders: this.peakHolders, fees: this.creatorFees,
    };
    return this.result;
  }
}

// lightweight per-coin timers that run on sim time (so pausing works)
function setTimeoutSim(coin, sec, fn) { (coin._timers || (coin._timers = [])).push({ at: coin.t + sec, fn }); }
function runSimTimers(coin) {
  if (!coin._timers || !coin._timers.length) return;
  const due = coin._timers.filter((x) => x.at <= coin.t);
  if (!due.length) return;
  coin._timers = coin._timers.filter((x) => x.at > coin.t);
  for (const d of due) d.fn();
}

// ---------- launch helpers ----------
function launchPumpCoin(o, env) {
  const c = new Coin({ ...o, type: 'pump' });
  c.devCost += PUMP_LAUNCH_FEE;
  if (o.devBuy > 0) {
    const r = c._buy(o.devBuy);
    c.dev.main.tokens = r.tokens; c.dev.main.start = r.tokens; c.dev.main.cost = r.sol; c.devCost += r.sol;
    c._trade('buy', r.sol, r.tokens, { handle: 'DEV', dev: true });
  }
  c.attnImp = 0.11 * c.memeScore * c.metaMult;
  queueSnipers(c, env);
  c._event('launch', `$${c.ticker} is live on PumpBin. Bonding curve open. Snipers are watching.`);
  c._burstChat('launch', 3);
  return c;
}

function launchCustomCoin(o, env) {
  const c = new Coin({ ...o, type: 'custom' });
  c.phase = 'dex';
  c.poolSol = o.lpSol; c.poolTok = SUPPLY * o.lpPct; c.lpSeed = o.lpSol;
  c.dev.main.tokens = SUPPLY * (1 - o.lpPct); c.dev.main.start = c.dev.main.tokens;
  c.lp = o.lp || 'dev';
  if (c.lp === 'locked') c.lockUntil = o.lockSec || 180;
  c.devCost += CUSTOM_DEPLOY_FEE + o.lpSol;
  c.attnImp = 0.26 * c.memeScore * c.metaMult + Math.min(0.5, o.lpSol / 80);
  queueSnipers(c, env);
  c._mark(c.mcapSol(), 0);
  c._event('launch', `$${c.ticker} deployed. Pool seeded with ${fmtSOL(o.lpSol)} SOL. You hold the keys.`);
  c._burstChat('launch', 3);
  return c;
}

// Sniper bots buy in the first seconds. Most are flippers: they dump within
// seconds, usually before a human dev can react.
function queueSnipers(c, env) {
  const n = Math.round(randi(0, 4) * (c.antiSnipe ? 0.25 : 1) * (env.sentiment ?? 1) * clamp(c.memeScore, 0.7, 1.2));
  for (let i = 0; i < n; i++) c.snipeQueue.push({ at: rand(0.3, 3.5), sol: logRand(TT.sniper.buy[0], TT.sniper.buy[1]) });
  c.snipeQueue.sort((a, b) => a.at - b.at);
}

// how "good" a meme is: hidden roll from the name, nudged by ticker shape
function memeScoreFor(name, ticker, kind, meta) {
  const r = mulberry32(hashStr(name.toLowerCase() + '|' + ticker.toUpperCase() + '|' + kind))();
  let s = 0.7 + r * 0.6;
  const tl = ticker.length;
  if (tl >= 3 && tl <= 5) s += 0.06;
  if (tl > 7) s -= 0.08;
  const lower = name.toLowerCase();
  const kw = { FROGS: ['frog', 'ribbit', 'pep', 'feels'], DOGS: ['dog', 'inu', 'doge', 'wif', 'bonk', 'shib'], CATS: ['cat', 'mog', 'pop', 'meow', 'michi'], 'AI AGENTS': ['ai', 'gpt', 'agent', 'goat', 'terminal'], SPACE: ['moon', 'mars', 'luna'], 'CHILL VIBES': ['chill', 'lowkey', 'unbothered'], 'FART COINS': ['fart', 'toot', 'gas'], GIGACHAD: ['chad', 'giga', 'sigma'], ANIMALS: ['hippo', 'squirrel', 'peanut', 'monke', 'pengu', 'pnut'] };
  if ((kw[meta] || []).some((k) => lower.includes(k))) s += 0.12;
  return clamp(s, 0.6, 1.45);
}

// ---- 03-textures.js ----
// ============================================================
// TEXTURES — procedural, tileable canvas textures + normal maps
// Everything is generated at boot, so the game ships no image files.
// ============================================================
function ValueNoise(seed) {
  const rnd = mulberry32(seed);
  const vals = new Float32Array(256);
  const perm = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { vals[i] = rnd(); perm[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 256; i++) perm[256 + i] = perm[i];
  const lat = (ix, iy, p) => {
    ix = ((ix % p) + p) % p; iy = ((iy % p) + p) % p;
    return vals[perm[(perm[ix & 255] + (iy & 255)) & 511]];
  };
  function noise(x, y, p) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = lat(xi, yi, p), b = lat(xi + 1, yi, p), c = lat(xi, yi + 1, p), d = lat(xi + 1, yi + 1, p);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // tileable fbm on [0,1)^2; px = lattice cells per tile at the base octave
  function fbm(u, v, px = 4, oct = 5, _py = px, gain = 0.5) {
    let s = 0, amp = 0.5, n = 0, f = px;
    for (let o = 0; o < oct; o++) { s += amp * noise(u * f, v * f, f); n += amp; amp *= gain; f *= 2; }
    return s / n;
  }
  // anisotropic version with independent periods
  function fbm2(u, v, px, py, oct = 4, gain = 0.5) {
    let s = 0, amp = 0.5, n = 0, fx = px, fy = py;
    for (let o = 0; o < oct; o++) {
      s += amp * noise2(u * fx, v * fy, fx, fy); n += amp; amp *= gain; fx *= 2; fy *= 2;
    }
    return s / n;
  }
  const lat2 = (ix, iy, px, py) => {
    ix = ((ix % px) + px) % px; iy = ((iy % py) + py) % py;
    return vals[perm[(perm[ix & 255] + (iy & 255)) & 511]];
  };
  function noise2(x, y, px, py) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = lat2(xi, yi, px, py), b = lat2(xi + 1, yi, px, py), c = lat2(xi, yi + 1, px, py), d = lat2(xi + 1, yi + 1, px, py);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  return { noise, fbm, fbm2, rnd };
}

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let TEX_SIZE = 1024;

function newCanvas(w, h = w) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}

// Build color canvas + normal canvas from per-pixel callbacks.
// fn(u, v, x, y) -> [r,g,b, height, rough]
function genTexture(w, h, fn, opts = {}) {
  const col = newCanvas(w, h), cctx = col.getContext('2d');
  const img = cctx.createImageData(w, h);
  const height = new Float32Array(w * h);
  const rough = opts.rough ? new Uint8ClampedArray(w * h) : null;
  const out = [0, 0, 0, 0, 0];
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      fn(u, v, x, y, out);
      const i = y * w + x, j = i * 4;
      img.data[j] = out[0]; img.data[j + 1] = out[1]; img.data[j + 2] = out[2]; img.data[j + 3] = 255;
      height[i] = out[3];
      if (rough) rough[i] = out[4] * 255;
    }
  }
  cctx.putImageData(img, 0, 0);
  const res = { color: col, height, w, h };
  if (opts.normal !== false) res.normal = heightToNormal(height, w, h, opts.strength ?? 2);
  if (rough) {
    const rc = newCanvas(w, h), rctx = rc.getContext('2d'), ri = rctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) { const r = rough[i]; ri.data[i * 4] = r; ri.data[i * 4 + 1] = r; ri.data[i * 4 + 2] = r; ri.data[i * 4 + 3] = 255; }
    rctx.putImageData(ri, 0, 0);
    res.rough = rc;
  }
  return res;
}

function heightToNormal(hgt, w, h, strength) {
  const c = newCanvas(w, h), ctx = c.getContext('2d'), img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const ym = ((y - 1 + h) % h) * w, yp = ((y + 1) % h) * w, y0 = y * w;
    for (let x = 0; x < w; x++) {
      const xm = (x - 1 + w) % w, xp = (x + 1) % w;
      const dx = (hgt[y0 + xp] - hgt[y0 + xm]) * strength;
      const dy = (hgt[yp + x] - hgt[ym + x]) * strength;
      let nx = -dx, ny = dy, nz = 1;
      const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      const j = (y0 + x) * 4;
      img.data[j] = (nx * 0.5 + 0.5) * 255; img.data[j + 1] = (ny * 0.5 + 0.5) * 255; img.data[j + 2] = (nz * 0.5 + 0.5) * 255; img.data[j + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function toTex(canvas, { srgb = true, repeat = [1, 1], aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = aniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}
function texSet(gen, repeat = [1, 1]) {
  return {
    map: toTex(gen.color, { repeat }),
    normalMap: gen.normal ? toTex(gen.normal, { srgb: false, repeat }) : null,
    roughnessMap: gen.rough ? toTex(gen.rough, { srgb: false, repeat }) : null,
  };
}

// ---------- surfaces ----------
function genConcrete(S) {
  const N = ValueNoise(11), N2 = ValueNoise(12);
  const g = genTexture(S, S, (u, v, x, y, o) => {
    const n1 = N.fbm(u, v, 4, 6);
    const n2 = N2.fbm(u, v, 32, 3);
    const stain = smooth(0.56, 0.74, N.fbm(u + 0.37, v + 0.11, 2, 4));
    const wet = smooth(0.6, 0.7, N2.fbm(u, v, 3, 3));
    const speck = (N2.noise(u * 512, v * 512, 512) > 0.93) ? -0.08 : 0;
    let b = 0.5 + (n1 - 0.5) * 0.12 + (n2 - 0.5) * 0.12 + speck * 0.6;
    b *= 1 - stain * 0.14 - wet * 0.05;
    o[0] = clamp(b * 255 * 1.02, 0, 255); o[1] = clamp(b * 255 * 1.0, 0, 255); o[2] = clamp(b * 255 * 0.95, 0, 255);
    o[3] = n2 * 0.7 + n1 * 0.3; o[4] = clamp(0.88 - stain * 0.25 - wet * 0.3 + (n2 - 0.5) * 0.1, 0.3, 1);
  }, { rough: true, strength: 3 });
  // cracks
  const ctx = g.color.getContext('2d');
  const rnd = mulberry32(7);
  ctx.strokeStyle = 'rgba(30,28,26,0.55)'; ctx.lineWidth = Math.max(1, S / 700);
  for (let k = 0; k < 4; k++) {
    let x = rnd() * S, y = rnd() * S, a = rnd() * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 0; i < 60; i++) { a += (rnd() - 0.5) * 0.9; x += Math.cos(a) * S / 120; y += Math.sin(a) * S / 120; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  return g;
}

// Painted cinder block, mapped to one full wall height (bottom grime baked in).
// tile covers 1.6m wide x 2.4m tall: 4 blocks x 12 courses, running bond.
function genCinder(W, H) {
  const N = ValueNoise(21), N2 = ValueNoise(22);
  const bw = W / 4, bh = H / 12, mort = Math.max(2, W / 110);
  return genTexture(W, H, (u, v, x, y, o) => {
    const row = Math.floor(y / bh);
    const off = (row % 2) * bw * 0.5;
    const bx = ((x + off) % bw), by = y % bh;
    const edge = Math.min(bx, bw - bx, by, bh - by);
    const isMort = edge < mort;
    const bevel = smooth(mort, mort * 2.6, edge);
    const pores = N2.fbm(u, v, 48, 3);
    const pit = pores < 0.33 ? (0.33 - pores) * 2.2 : 0;
    const paintWear = smooth(0.62, 0.78, N.fbm(u, v, 3, 5));
    const n = N.fbm(u, v, 8, 4);
    let r, gC, b;
    if (isMort) { const m = 0.56 + (n - 0.5) * 0.15; r = m * 0.97; gC = m * 0.95; b = m * 0.9; }
    else {
      const paint = 0.8 + (n - 0.5) * 0.08 - pit * 0.35;
      const raw = 0.55 + (n - 0.5) * 0.2 - pit * 0.3;
      const base = lerp(paint, raw, paintWear * 0.7);
      r = base * 0.98; gC = base * 0.97; b = base * 0.93;
    }
    // grime: darker near floor + water tide line + streaks from top
    const fromBottom = 1 - v;
    const grime = smooth(0.22, 0.0, fromBottom) * 0.38 + smooth(0.06, 0.0, Math.abs(fromBottom - 0.16)) * 0.08 * N.fbm(u, 0.5, 6, 3);
    const streak = smooth(0.7, 0.9, N.fbm2(u, v, 24, 2, 3)) * smooth(0.5, 0.0, v) * 0.15;
    const dark = 1 - grime - streak;
    o[0] = clamp(r * dark * 255, 0, 255); o[1] = clamp(gC * dark * 255, 0, 255); o[2] = clamp(b * dark * 230, 0, 255);
    o[3] = (isMort ? 0 : 0.55 * bevel + 0.45) - pit * 0.35 + pores * 0.08;
    o[4] = isMort ? 0.95 : lerp(0.72, 0.92, paintWear);
  }, { rough: true, strength: 4 });
}

function genWood(S, opts = {}) {
  const N = ValueNoise(opts.seed || 31);
  const c1 = opts.light || [196, 150, 98], c2 = opts.dark || [128, 84, 46];
  const planks = opts.planks || 1;
  return genTexture(S, S, (u, v, x, y, o) => {
    const pk = Math.floor(u * planks), pu = (u * planks) % 1;
    const seedOff = pk * 0.37;
    const warp = N.fbm(u, v + seedOff, 2, 4) * 3.0;
    const ring = 0.5 + 0.5 * Math.sin((pu * 3 + warp + seedOff * 5) * Math.PI * 2 * (opts.rings || 3));
    const fine = N.fbm2((u + seedOff) % 1, v, 64, 2, 3);
    const knot = opts.knots ? smooth(0.82, 0.9, N.fbm(u, v, 4, 3)) : 0;
    let t = clamp(ring * 0.55 + fine * 0.45 + knot * 0.8, 0, 1);
    const gap = planks > 1 ? smooth(0.0, 0.012, Math.min(pu, 1 - pu)) : 1;
    o[0] = lerp(c1[0], c2[0], t) * (0.6 + 0.4 * gap); o[1] = lerp(c1[1], c2[1], t) * (0.6 + 0.4 * gap); o[2] = lerp(c1[2], c2[2], t) * (0.6 + 0.4 * gap);
    o[3] = fine * 0.3 + (1 - ring) * 0.15 + gap * 0.6;
    o[4] = (opts.rough ?? 0.7) + (fine - 0.5) * 0.15;
  }, { rough: true, strength: 2 });
}

// greyscale fabric patterns, tinted by material.color
function genKnit(S) {
  const N = ValueNoise(41);
  return genTexture(S, S, (u, v, x, y, o) => {
    const rib = Math.abs(Math.sin(u * Math.PI * 96));
    const stitch = Math.abs(Math.sin(v * Math.PI * 128 + Math.sin(u * Math.PI * 96) * 1.2));
    const fuzz = N.fbm(u, v, 64, 3);
    const h = rib * 0.6 + stitch * 0.25 + fuzz * 0.3;

    o[0] = o[1] = o[2] = clamp(b * 255, 0, 255); o[3] = h; o[4] = 0.95;

}

    const tw = 0.5 + 0.5 * Math.sin((u * 220 + v * 220) * Math.PI);
    const fuzz = N.fbm(u, v, 128, 2);
    const fade = N.fbm(u, v, 3, 4);
    const weft = N.noise(u * 512, v * 1024, 512) > 0.7 ? 0.25 : 0;
    const b = 0.55 + tw * 0.2 + weft + (fade - 0.5) * 0.35 + (fuzz - 0.5) * 0.1;
    o[0] = clamp(b * 160, 0, 255); o[1] = clamp(b * 185, 0, 255); o[2] = clamp(b * 235, 0, 255);
    o[3] = tw * 0.7 + fuzz * 0.3; o[4] = 0.92;
  }, { strength: 1.5 });
}
function genWeave(S, seed = 61) {
  const N = ValueNoise(seed);
  return genTexture(S, S, (u, v, x, y, o) => {
    const a = Math.sin(u * Math.PI * 160), b = Math.sin(v * Math.PI * 160);
    const over = (Math.floor(u * 80) + Math.floor(v * 80)) % 2 ? Math.abs(a) : Math.abs(b);
    const fuzz = N.fbm(u, v, 64, 3);
    const wear = N.fbm(u, v, 4, 4);
    const br = 0.7 + over * 0.2 + (fuzz - 0.5) * 0.15 + (wear - 0.5) * 0.2;
    o[0] = o[1] = o[2] = clamp(br * 255, 0, 255); o[3] = over * 0.8 + fuzz * 0.2; o[4] = 0.95;
  }, { strength: 1.4 });
}
function genSkin(S) {
  const N = ValueNoise(71);
  return genTexture(S, S, (u, v, x, y, o) => {
    const pores = N.fbm(u, v, 96, 2);
    const mott = N.fbm(u, v, 6, 4);
    const b = 0.93 + (mott - 0.5) * 0.08 - (pores < 0.35 ? 0.04 : 0);
    o[0] = clamp(b * 255, 0, 255); o[1] = clamp(b * 248, 0, 255); o[2] = clamp(b * 244, 0, 255);
    o[3] = pores * 0.5; o[4] = 0.55 + (pores - 0.5) * 0.2;
  }, { strength: 0.6, rough: true });
}
function genHair(S) {
  const N = ValueNoise(81);

    const strands = N.fbm2(u, v, 160, 6, 3);
    const clump = N.fbm2(u, v, 24, 3, 3);
    const b = 0.55 + strands * 0.5 + (clump - 0.5) * 0.3;
    o[0] = o[1] = o[2] = clamp(b * 255, 0, 255); o[3] = strands * 0.7 + clump * 0.3; o[4] = 0.55;
  }, { strength: 2.5, rough: true });
}
function genLeather(S) {
  const N = ValueNoise(91);
  return genTexture(S, S, (u, v, x, y, o) => {
    const grain = N.fbm(u, v, 48, 3);
    const crease = smooth(0.48, 0.5, N.fbm(u, v, 4, 4)) * smooth(0.52, 0.5, N.fbm(u, v, 4, 4));
    const b = 0.85 + (grain - 0.5) * 0.15 - crease * 0.3;
    o[0] = o[1] = o[2] = clamp(b * 255, 0, 255); o[3] = grain * 0.6 - crease; o[4] = 0.45 + (grain - 0.5) * 0.2;

}
function genPaintedMetal(S, base, rust = 0.2) {

    const n = N.fbm(u, v, 8, 5);
    const r = smooth(1 - rust * 0.5, 1 - rust * 0.3, N.fbm(u + 0.5, v, 6, 5)) * rust * 2;
    const drip = smooth(0.75, 0.9, N.fbm2(u, v, 32, 1, 3)) * v * 0.25;
    const b = 0.95 + (n - 0.5) * 0.08 - drip;
    o[0] = lerp(base[0] * b, 120, r); o[1] = lerp(base[1] * b, 64, r); o[2] = lerp(base[2] * b, 30, r);
    o[3] = n * 0.2 + r * 0.6; o[4] = lerp(0.42, 0.9, r) + (n - 0.5) * 0.1;

}
function genGalvanized(S) {
  const N = ValueNoise(111);

    const cell = N.noise(u * 40, v * 40, 40);
    const n = N.fbm(u, v, 16, 3);
    const seam = smooth(0.02, 0.0, Math.abs(((u * 4 + v * 0.0) % 1) - 0.5) - 0.48);
    const b = 0.62 + cell * 0.18 + (n - 0.5) * 0.08 - seam * 0.2;
    o[0] = o[1] = clamp(b * 255, 0, 255); o[2] = clamp(b * 262, 0, 255);
    o[3] = cell * 0.2 + seam; o[4] = 0.35 + cell * 0.25;

}

  const N = ValueNoise(121);

    const n = N.fbm(u, v, 8, 4);
    const fib = N.fbm2(u, v, 96, 8, 2);
    const corr = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * 70);
    const tape = Math.abs(v - 0.5) < 0.07 ? 1 : 0;
    const b = 0.85 + (n - 0.5) * 0.2 + (fib - 0.5) * 0.08;
    if (tape) { o[0] = 205 * b; o[1] = 170 * b; o[2] = 120 * b; o[4] = 0.35; }
    else { o[0] = 182 * b; o[1] = 138 * b; o[2] = 92 * b; o[4] = 0.9; }
    o[3] = corr * 0.15 + fib * 0.2 + tape * 0.15;
  }, { strength: 1.2, rough: true });
}
function genInsulation(S) {
  const N = ValueNoise(131);
  return genTexture(S, S, (u, v, x, y, o) => {
    const f = N.fbm(u, v, 12, 6, 12, 0.6);
    const b = 0.75 + (f - 0.5) * 0.6;
    o[0] = clamp(250 * b, 0, 255); o[1] = clamp(170 * b, 0, 255); o[2] = clamp(175 * b, 0, 255);
    o[3] = f; o[4] = 1;
  }, { strength: 5, rough: true });
}
function genMattress(S) {
  const N = ValueNoise(141);
  const g = genTexture(S, S, (u, v, x, y, o) => {
    const du = (u * 6) % 1, dv = (v * 6) % 1;
    const d = Math.min(Math.abs(du - dv), Math.abs(du + dv - 1));
    const quilt = smooth(0.0, 0.08, d);

    o[3] = quilt * 0.8 + n * 0.2; o[4] = 0.95;

}
function genRug(S) {
  const N = ValueNoise(151);

    const cx = Math.abs(u - 0.5), cy = Math.abs(v - 0.5);
    const box = Math.max(cx, cy * 1.0);
    const dia = cx + cy;
    let c = [128, 28, 36];
    if (box > 0.46) c = [210, 175, 110];
    else if (box > 0.43) c = [30, 40, 70];
    else if (box > 0.4) c = [210, 175, 110];
    else if (dia < 0.16) c = [30, 40, 70];
    else if (dia < 0.2) c = [210, 175, 110];
    else if (Math.abs(Math.sin(u * 40) * Math.sin(v * 40)) > 0.85) c = [180, 120, 60];

    const wear = smooth(0.55, 0.75, N.fbm(u, v, 3, 4));
    const b = 0.85 + (pile - 0.5) * 0.25 - wear * 0.2;
    o[0] = c[0] * b; o[1] = c[1] * b; o[2] = c[2] * b; o[3] = pile; o[4] = 1;
  }, { strength: 2 });
}

// ---------- 2D art: meme coin icons (also used by the UI) ----------
// ---------- coin logos from Fluent 3D emoji (MIT, Microsoft) ----------
const EMOJI = {};
const EMOJI_FILES = ['dog_face', 'dog', 'frog', 'cat_face', 'weary_cat', 'hippopotamus', 'chipmunk', 'monkey_face', 'penguin', 'goat', 'robot', 'relieved_face', 'dashing_away', 'smiling_face_with_sunglasses', 'full_moon_face', 'billed_cap', 'sunglasses', 'peanuts', 'crown', 'top_hat', 'gem_stone', 'rocket', 'fire'];
function loadEmoji() {
  return Promise.all(EMOJI_FILES.map((n) => new Promise((res) => {
    const im = new Image();
    im.onload = () => { EMOJI[n] = im; res(); };
    im.onerror = () => res();
    im.src = 'assets/emoji/' + n + '.png';
  })));
}
// base art + fixed overlays per meme archetype: [name, cx, cy, size, rotation]
const KIND_ART = {
  dogwifhat: [['dog_face', 0.5, 0.56, 0.74], ['billed_cap', 0.5, 0.2, 0.52, -0.25]],
  shiba: [['dog', 0.5, 0.53, 0.8]],
  frog: [['frog', 0.5, 0.53, 0.8]],
  mogcat: [['cat_face', 0.5, 0.54, 0.76], ['sunglasses', 0.5, 0.5, 0.52]],
  popcat: [['weary_cat', 0.5, 0.53, 0.8]],
  hippo: [['hippopotamus', 0.5, 0.54, 0.82]],
  squirrel: [['chipmunk', 0.47, 0.5, 0.76], ['peanuts', 0.74, 0.76, 0.34, 0.3]],
  monkey: [['monkey_face', 0.5, 0.53, 0.8]],
  penguin: [['penguin', 0.5, 0.54, 0.8]],
  goat: [['goat', 0.5, 0.54, 0.82]],
  robot: [['robot', 0.5, 0.53, 0.8]],
  chill: [['relieved_face', 0.5, 0.53, 0.78]],
  fart: [['dashing_away', 0.5, 0.53, 0.8]],
  chad: [['smiling_face_with_sunglasses', 0.5, 0.53, 0.78]],
  moon: [['full_moon_face', 0.5, 0.52, 0.8]],

const HAT_FREE = new Set(['shiba', 'frog', 'popcat', 'hippo', 'monkey', 'penguin', 'goat', 'robot', 'chill', 'chad', 'moon']);
function drawMemeIcon(ctx, kind, hue, S, seed = 1) {
  const art = KIND_ART[kind];
  if (!art || !EMOJI[art[0][0]]) return drawMemeIconVector(ctx, kind, hue, S, seed);
  const r = mulberry32(seed * 7919 + 13);
  const cx = S / 2, cy = S / 2;
  ctx.save();

  bg.addColorStop(0, `hsl(${hue},62%,58%)`); bg.addColorStop(1, `hsl(${(hue + 24) % 360},58%,24%)`);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, S / 2, 0, 7); ctx.fill();

  else if (extra > 0.8) layers.push([pick(['gem_stone', 'fire', 'rocket']), 0.78, 0.78, 0.28, 0]);

    const im = EMOJI[n]; if (!im) return;
    ctx.save();
    ctx.translate(x * S, y * S); ctx.rotate(rot);
    if (i === 0) { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = S * 0.06; ctx.shadowOffsetY = S * 0.025; }

}

function drawMemeIconVector(ctx, kind, hue, S, seed = 1) {

// ---------- posters ----------
function drawPoster(kind, W = 512, H = 720) {
  const c = newCanvas(W, H), ctx = c.getContext('2d');
  const N = ValueNoise(hashStr(kind));
  if (kind === 'hodl') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b1037'); g.addColorStop(0.55, '#e0567a'); g.addColorStop(1, '#ffb547');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(W / 2, H * 0.52, W * 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#16102a'; ctx.beginPath(); ctx.moveTo(0, H * 0.75);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H * 0.62 + Math.sin(x * 0.02) * 30 + N.noise(x / 40, 0, 64) * 60);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${W * 0.26}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('HODL', W / 2, H * 0.22);
    ctx.font = `${W * 0.045}px Georgia, serif`; ctx.fillText('Diamond hands are forged under pressure.', W / 2, H * 0.92);
  } else if (kind === 'frog') {
    ctx.fillStyle = '#e9e2cf'; ctx.fillRect(0, 0, W, H);
    const ic = newCanvas(400); drawMemeIcon(ic.getContext('2d'), 'frog', 140, 400, 3);
    ctx.drawImage(ic, W / 2 - 200, H * 0.14, 400, 400);
    ctx.fillStyle = '#141014'; ctx.font = `900 ${W * 0.13}px Impact, "Arial Black", sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('FEELS GOOD', W / 2, H * 0.84);
    ctx.font = `${W * 0.05}px "Courier New", monospace`; ctx.fillText('(when number go up)', W / 2, H * 0.92);
  } else if (kind === 'chart') {
    ctx.fillStyle = '#0c0f14'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#1d2530'; ctx.lineWidth = 2;
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    let p = H * 0.8;
    for (let i = 0; i < 18; i++) {
      const x = 24 + i * 26, o = p; p -= (Math.random() - 0.25) * 40; const up = p < o;

function postChirp(type, coin) {
  const pt = POST_TYPES[type];
  if (!pt) return 'Unknown post type.';
  if (pt.needsCoin && (!coin || !coin.isLive())) return 'Pick a live coin to post about.';
  const cost = Math.max(2, pt.stamina - (S.owned.mechKeyboard ? 2 : 0));
  if (S.stamina < cost) return 'Too tired to post. Energy drink?';
  if (pt.costSol && S.sol < pt.costSol) return 'Not enough SOL for the giveaway.';
  S.stamina -= cost;
  if (pt.costSol) S.sol -= pt.costSol;
  let q = logRand(0.55, 1.6);
  if (pt.variance) q = chance(0.5) ? logRand(0.25, 0.9) : logRand(0.9, 2.6);
  const viral = chance(0.025 + Math.max(0, q - 1.4) * 0.08);
  const viralMult = viral ? rand(4, 14) : 1;
  const impressions = Math.round((S.followers * rand(0.2, 0.65) + rand(40, 140)) * Math.max(0.3, q) * viralMult * (pt.mult || 1));
  const likes = Math.round(impressions * rand(0.012, 0.045));
  const followRate = 0.004 + 0.026 / (1 + S.followers / 500);
  const boost = (S.owned.mo ? 1.25 : 1) * (S.owned.toilet ? 1.05 : 1);
  let gain = Math.max(pt.follow > 0 ? 1 : 0, Math.round(impressions * followRate * rand(0.6, 1.4) * pt.follow * boost));
  if (type === 'giveaway') gain = Math.round(20 + S.followers * rand(0.04, 0.08));
  const ratioed = !viral && q < 0.5 && chance(0.35);
  if (ratioed) gain = -Math.round(S.followers * rand(0.005, 0.02));
  S.followers = Math.max(10, S.followers + gain);
  S.stats.tweets++;
  const tick = coin ? '$' + coin.ticker : '';
  const tpl = { shill: SHILL_TEXT, alpha: ALPHA_TEXT, thread: THREAD_TEXT, meme: MEME_TEXT, shitpost: SHITPOSTS, giveaway: ['🎁 0.1 SOL GIVEAWAY 🎁 follow + RT + drop your wallet. 24h.'] }[type];
  const textOut = pick(tpl).replace('${t}', tick);
  let effect = 0;
  if (coin && pt.needsCoin) {
    effect = shillPower() * pt.mult * q * (viral ? Math.min(4, viralMult * 0.5) : 1);
    if (ratioed) coin.fud(0.15, `Your $${coin.ticker} post got ratioed. Holders are spooked.`);
    else coin.shill(effect, shillSize());
    if (pt.linger) coin.attnImp += effect * 0.4;

const ROOM = { x0: -5, x1: 5, z0: -4, z1: 4, h: 2.5 };

// Planar UVs in world meters (good for boxes / flat-faced meshes)
function planarUV(geo, scale = 1, grainY = false) {
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const ax = Math.abs(nor.getX(i)), ay = Math.abs(nor.getY(i)), az = Math.abs(nor.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = z; v = y; } else if (ay >= az) { u = x; v = z; } else { u = x; v = y; }
    if (grainY) { const t = u; u = v; v = t; }
    uv.setXY(i, u / scale, v / scale);
  }
  uv.needsUpdate = true;
  return geo;
}

// ============================================================
// CHARACTERS — procedural humans with faces, cloth and posing
// Units are meters; a character stands ~1.78m tall facing +z.
// Limb pivots point down -y; rotation.x < 0 swings a limb forward.
// ============================================================
let CHAR_TEX = null;
function charTextures() {
  if (CHAR_TEX) return CHAR_TEX;
  const s = Math.min(TEX_SIZE, 512);
  CHAR_TEX = {
    knit: texSet(genKnit(s), [2, 2]),
    denim: texSet(genDenim(s), [2, 2]),
    hair: texSet(genHair(s / 2), [2, 1]),
    skin: genSkin(256),
    weave: texSet(genWeave(s / 2, 77), [3, 3]),
    leather: texSet(genLeather(s / 2)),
  };
  return CHAR_TEX;
}

// paint the head's color map: skin + blush + stubble + lip tint
function paintFace(spec) {
  const W = 512, H = 256;
  const c = newCanvas(W, H), ctx = c.getContext('2d');
  const sk = new THREE.Color(spec.skin);
  const base = `rgb(${sk.r * 255 | 0},${sk.g * 255 | 0},${sk.b * 255 | 0})`;
  ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(charTextures().skin.color, 0, 0, W, H);
  ctx.drawImage(charTextures().skin.color, W / 2, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const fx = W * 0.25; // face center (+z) in sphere UVs
  // cheeks
  for (const s of [-1, 1]) {
    const g = ctx.createRadialGradient(fx + s * W * 0.055, H * 0.6, 2, fx + s * W * 0.055, H * 0.6, W * 0.05);
    g.addColorStop(0, 'rgba(200,80,80,0.22)'); g.addColorStop(1, 'rgba(200,80,80,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // eye sockets slightly darker
  for (const s of [-1, 1]) {
    const g = ctx.createRadialGradient(fx + s * W * 0.055, H * 0.47, 1, fx + s * W * 0.055, H * 0.47, W * 0.035);

// ---------- sculpted head ----------
// One smooth mesh: proportions, brow, sockets, cheekbones, nose, lips, chin.
const HEAD = { sx: 0.8, sy: 1.16, sz: 0.98 };
function sculpt(x, y, z) {
  x *= HEAD.sx; y *= HEAD.sy; z *= HEAD.sz;
  const jaw = smooth(0.0, -0.11, y);
  x *= 1 - jaw * 0.28;
  if (z < 0) z *= 1 - jaw * 0.38;
  if (z < 0 && y > -0.02) z *= 1.07;
  if (z > 0.056) z = 0.056 + (z - 0.056) * 0.55;
  const f = smooth(0.02, 0.06, z);
  if (f > 0) {
    const g = (cx, cy, sx, sy) => Math.exp(-(((x - cx) / sx) ** 2 + ((y - cy) / sy) ** 2));
    let dz = 0;
    dz += 0.006 * g(0, 0.036, 0.05, 0.011);
    dz -= 0.009 * (g(0.031, 0.011, 0.015, 0.01) + g(-0.031, 0.011, 0.015, 0.01));
    dz += 0.004 * (g(0.046, -0.014, 0.016, 0.016) + g(-0.046, -0.014, 0.016, 0.016));
    if (y < 0.034 && y > -0.036) {
      const t = clamp((0.032 - y) / 0.05, 0, 1);
      const prof = y > -0.017 ? 0.003 + 0.018 * Math.pow(t, 1.5) : 0.021 * smooth(-0.034, -0.017, y);
      const w = 0.0055 + 0.0075 * t;
      dz += prof * Math.exp(-((x / w) ** 2));
    }
    dz += 0.006 * (g(0.0115, -0.02, 0.0055, 0.005) + g(-0.0115, -0.02, 0.0055, 0.005));
    dz += 0.0035 * g(0, -0.038, 0.017, 0.005);
    dz += 0.0045 * g(0, -0.051, 0.015, 0.0045);
    dz -= 0.0022 * g(0, -0.0445, 0.02, 0.0016);
    dz -= 0.002 * g(0, -0.062, 0.02, 0.004);
    dz += 0.006 * g(0, -0.086, 0.022, 0.012);
    z += dz * f;
  }
  return [x, y, z];
}

function headGeometry() {
  if (HEAD_GEO) return HEAD_GEO;
  const g = new THREE.SphereGeometry(0.1, 96, 72);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const [x, y, z] = sculpt(p.getX(i), p.getY(i), p.getZ(i)); p.setXYZ(i, x, y, z); }

}

function headSurfZ(x, y) {
  const p = headGeometry().attributes.position;
  let best = 0, bd = Infinity;
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i); if (z < 0.02) continue;
    const d = (p.getX(i) - x) ** 2 + (p.getY(i) - y) ** 2;
    if (d < bd) { bd = d; best = z; }
  }
  return best;
}

function headUV(x, y, W, H) {
  const th = Math.acos(clamp(y / HEAD.sy / 0.1, -1, 1));
  const xo = x / (HEAD.sx * (1 - smooth(0.0, -0.11, y) * 0.28));

    for (const k of t) {
      const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k);

  update(dt, camPos) {
    this.t += dt;
    const t = this.t, j = this.j, now = performance.now();
    let P = { ...Person.POSES[this.state] || Person.POSES.stand };
    P.L = [...P.L]; P.R = [...P.R]; P.LL = [...P.LL]; P.RL = [...P.RL];
    const seated = this.state === 'sit' || this.state === 'type' || this.state === 'couch';
    if (this.emote && now > this.emoteUntil) this.emote = null;
    const talking = now < this.talkUntil;
    // emotes override arms
    if (this.emote === 'cheer') { P.L = [-0.4, 0, 2.6 + Math.sin(t * 10) * 0.15, -0.4]; P.R = [-0.4, 0, -2.6 - Math.sin(t * 10) * 0.15, -0.4]; P.headX = -0.2; P.curl = 0.9; }
    if (this.emote === 'facepalm') { P.R = [-1.25, -0.5, -0.1, -2.25]; P.headX = 0.35; P.neck = 0.2; }
    if (this.emote === 'shrug') { P.L = [-0.2, 0.4, 0.5, -1.4]; P.R = [-0.2, -0.4, -0.5, -1.4]; P.headX = -0.05; }
    if (this.emote === 'point') { P.R = [-1.45, -0.2, -0.1, -0.1]; P.curl = 0.9; }
    // talking gestures
    if (talking && !this.emote && !seated && this.state !== 'phone' && this.state !== 'count') {
      P.L = [-0.3 + Math.sin(t * 2.3) * 0.15, 0.1, 0.18, -0.9 + Math.sin(t * 3.1) * 0.25];
      P.R = [-0.35 + Math.sin(t * 2.7 + 1) * 0.2, -0.1, -0.18, -1.0 + Math.sin(t * 2.2) * 0.3];
    }
    const rate = 7;
    const d = (k, v) => (this.cur[k] = damp(this.cur[k] ?? v, v, rate, dt));
    // breathing / idle sway
    const breathe = Math.sin(t * 1.6) * 0.5 + 0.5;
    const sway = seated ? 0 : Math.sin(t * 0.55) * 0.025;
    j.hips.position.y = d('hipsY', P.hipsY) + (this.emote === 'cheer' ? Math.abs(Math.sin(t * 10)) * 0.05 : 0);
    j.hips.rotation.x = d('hipsRx', P.hipsRx);
    j.hips.rotation.z = sway;
    j.spine.rotation.x = d('spine', P.spine) + breathe * 0.012;
    j.chest.rotation.x = d('chest', P.chest);
    j.chest.scale.set(1 + breathe * 0.012, 1, 1 + breathe * 0.02);
    j.neck.rotation.x = d('neck', P.neck);
    // head look-at
    let yaw = 0, pitch = 0;
    if (this.lookTarget) {
      const hp = new THREE.Vector3(); j.neck.getWorldPosition(hp);
      const local = this.lookTarget.clone().sub(hp);
      const ry = this.root.rotation.y;
      const lx = Math.cos(ry) * local.x - Math.sin(ry) * local.z;
      const lz = Math.sin(ry) * local.x + Math.cos(ry) * local.z;
      yaw = Math.atan2(lx, lz);
      pitch = -Math.atan2(local.y - 0.1, Math.hypot(lx, lz));
