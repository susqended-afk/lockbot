  if (S.loc === 'basement' && S.day % 3 === 0 && !S.owned.momCar && !S.owned.momHouse) {
    const rent = S.cash > 20000 ? 500 : S.cash > 2000 ? 120 : 40;
    S.cash -= rent;
    rep.lines.push(['Mom', `"Grocery money." -${fmtUSD(rent)}`]);
  }
  const cyc = rollCycle();
  const drift = S.cycle.phase === 'bull' ? 0.05 : S.cycle.phase === 'bear' ? -0.06 : 0;
  const s0 = S.solPrice;
  S.solPrice = clamp(S.solPrice * Math.exp(gauss() * 0.06 + drift + (150 - S.solPrice) / 1500), 60, 520);
  rep.lines.push(['SOL price', `${fmtUSD(s0)} → ${fmtUSD(S.solPrice)}`]);
  S.sentiment = S.cycle.phase === 'bull' ? rand(1.2, 1.6) : S.cycle.phase === 'bear' ? rand(0.45, 0.75) : clamp(0.55 + Math.random() * 0.95, 0.5, 1.5);
  if (cyc) rep.lines.push(['Market cycle', cyc]);
  rep.lines.push(['Market mood', S.cycle.phase === 'bull' ? 'Bull run: buyers everywhere' : S.cycle.phase === 'bear' ? 'Bear market: nobody is buying' : S.sentiment > 1.15 ? 'Euphoric: everyone is aping' : S.sentiment < 0.8 ? 'Bearish: nobody is buying' : 'Normal']);

let simAcc = 0, chadT = 160, netT = 0;
function gameTick(dt) {
  if (!S || S.ended) return;
  simAcc += dt;
  const env = coinEnv();
  while (simAcc >= SIM_DT) {
    simAcc -= SIM_DT;
    for (const c of LIVE) {
      if (c.ended) continue;
      c.tick(SIM_DT, env);
      if (c.tweetedAt != null && !c.calledPaid && c.mcapSol() > c.tweetMcap * 3) {
        c.calledPaid = true;
        const g = Math.round(S.followers * 0.05 + 30);

        pushFeed({ who: 'Chirp', text: `You called $${c.ticker} before a 3x. +${g} followers.`, kind: 'good' });
      }

  }
  for (const c of LIVE) while (c.events.length) emit('coinevent', { coin: c, ev: c.events.shift(), mine: true });
  for (const c of ECO) {
    const holding = (c.you()?.tokens || 0) > 0;
    while (c.events.length) { const ev = c.events.shift(); if (holding || c.id === FOCUS) emit('coinevent', { coin: c, ev, mine: false }); }
  }
  ecoTick(dt);
  for (const p of S.posts) if (p.age < 30) p.age += dt;
  S.clock += dt;
  if (S.clock >= 24 * 60) S.clock -= 24 * 60;
  chadT -= dt;
  if (chadT <= 0) { chadT = rand(150, 260); text('Chad', pick(CHAD_TIPS())); }
  netT -= dt;
  if (netT <= 0) { netT = 5; S.netHist.push(Math.round(netWorth())); if (S.netHist.length > 120) S.netHist.shift(); }
  checkObjectives();
  storyTick(dt);
}

    S = Object.assign(newGameState(), d.S);

    FOCUS = d.FOCUS; COIN_SEQ = Math.max(COIN_SEQ, d.seq || 1);
    return true;
  } catch (e) { return false; }
}

function rollCycle() {
  const c = S.cycle, prev = c.phase;
  if (c.forced) { c.phase = c.forced; c.days = randi(2, 3); c.forced = null; }
  else if (c.days > 0) { c.days--; if (c.days === 0) c.phase = 'normal'; }
  else { const r = Math.random(); if (r < 0.16) { c.phase = 'bull'; c.days = randi(2, 4); } else if (r < 0.3) { c.phase = 'bear'; c.days = randi(2, 3); } }
  if (c.phase === prev) return null;
  S.story.cycleNews = c.phase === 'normal' ? 'normal:' + prev : c.phase;
  return c.phase === 'bull' ? 'A bull run started' : c.phase === 'bear' ? 'A bear market hit' : prev === 'bull' ? 'The bull run cooled off' : 'The bear market is over';
}
function forecastCycle() {
  const c = S.cycle;
  if (c.forced) return c.forced === 'bull' ? 'bull run coming' : 'bear coming';
  if (c.days > 1) return `${c.phase} continues`;
  if (c.days === 1) return 'back to normal';
  return 'calm';
}

function moveHome(id) {
  const prev = S.loc;
  S.loc = id;
  const ch = LOCS[id].chapter;
  if (ch > S.chapter) { S.chapter = ch; S.chapterDay = S.day; S.story.chT = S.story.t || 0; }
  objDone(id);
  if (S.mode === 'story' && id === 'apartment') S.cycle.forced = 'bull';
  if (S.mode === 'story' && id === 'penthouse') S.cycle.forced = 'bull';
  const lines = {

    penthouse: ['Mom', 'Forty floors?! Do they have railings? Send pictures.'],

}

// ---------------- event queue ----------------
// Events are stored as [type, arg] so a save can rebuild them.
function queueEvent(type, arg = null, front = false) {
  const q = S.story.q || (S.story.q = []);
  if (q.some(([t, a]) => t === type && a === arg)) return;
  if (front) q.unshift([type, arg]); else q.push([type, arg]);
}
function nextEvent() {
  const q = S.story.q || [];
  while (q.length) {
    const [type, arg] = q.shift();
    const ev = EV[type]?.(arg);
    if (ev) return ev;
  }
  return null;
}

function planarUV(geo, scale = 1, grainY = false) {
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const ax = Math.abs(nor.getX(i)), ay = Math.abs(nor.getY(i)), az = Math.abs(nor.getZ(i));
    let u, v;
    if (ax >= ay && ax >= az) { u = z; v = y; } else if (ay >= az) { u = x; v = z; } else { u = x; v = y; }
    if (grainY) { const t = u; u = v; v = t; }
    uv.setXY(i, u / scale, v / scale);
  }
  uv.needsUpdate = true;
  return geo;
}

const TEXCACHE = {};
const KEEP_TEX = new Set();
function cachedTex(key, make) {
  if (!TEXCACHE[key]) {
    const set = make(); TEXCACHE[key] = set;
    for (const t of Object.values(set)) if (t && t.isTexture) KEEP_TEX.add(t);
  }
  return TEXCACHE[key];
}
function repSet(set, rx, ry) {
  const o = {};
  for (const [k, t] of Object.entries(set)) { if (!t) { o[k] = t; continue; } const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; o[k] = c; }

}

function disposeWorld(scene, W) {
  if (!W) return;
  scene.remove(W.root);
  const mats = new Set(), geos = new Set();
  W.root.traverse((o) => {
    if (o.userData.shared) return;
    if (o.geometry) geos.add(o.geometry);
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => mats.add(m));
    if (o.isLight && o.shadow?.map) o.shadow.map.dispose();
  });
  for (const g of geos) g.dispose();
  for (const m of mats) {
    for (const v of Object.values(m)) if (v && v.isTexture && !KEEP_TEX.has(v) && !v.userData?.keep) v.dispose();
    m.dispose();
  }
}

  // a wall plane along one side of the room, with rectangular holes [a0, a1, y0, y1] in world coords
  const wallSide = (side, mat, holes = [], uvs = 1.6) => {
    const len = side === 'n' || side === 's' ? B.x1 - B.x0 : B.z1 - B.z0;
    const toS = (a) => (side === 'n' ? a - B.x0 : side === 'e' ? a - B.z0 : side === 's' ? B.x1 - a : B.z1 - a);

    shape.moveTo(0, 0); shape.lineTo(len, 0); shape.lineTo(len, H); shape.lineTo(0, H); shape.lineTo(0, 0);
    for (const [a0, a1, y0, y1] of holes) {
      const s0 = Math.min(toS(a0), toS(a1)), s1 = Math.max(toS(a0), toS(a1));
      const p = new THREE.Path(); p.moveTo(s0, y0); p.lineTo(s0, y1); p.lineTo(s1, y1); p.lineTo(s1, y0); p.lineTo(s0, y0);
      shape.holes.push(p);
    }
    const g = new THREE.ShapeGeometry(shape);
    const pos = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / uvs, pos.getY(i) / uvs);

    const inward = side === 's' || side === 'e' ? -1 : 1;
    for (let i = 0; i <= n; i++) {
      const [x, y, z] = P(a0 + i * d, (y0 + y1) / 2, inward * 0.03);
      box(ns ? 0.05 : 0.08, y1 - y0, ns ? 0.08 : 0.05, M.mullion, x, y, z);

// ---------- sculpted head ----------
// One smooth mesh: proportions, brow, sockets, cheekbones, nose, lips, chin.
const HEAD = { sx: 0.8, sy: 1.16, sz: 0.98 };
function sculpt(x, y, z) {
  x *= HEAD.sx; y *= HEAD.sy; z *= HEAD.sz;
  const jaw = smooth(0.0, -0.11, y);
  x *= 1 - jaw * 0.28;
  if (z < 0) z *= 1 - jaw * 0.38;
  if (z < 0 && y > -0.02) z *= 1.07;
  if (z > 0.056) z = 0.056 + (z - 0.056) * 0.55;
  const f = smooth(0.02, 0.06, z);
  if (f > 0) {
    const g = (cx, cy, sx, sy) => Math.exp(-(((x - cx) / sx) ** 2 + ((y - cy) / sy) ** 2));
    let dz = 0;
    dz += 0.006 * g(0, 0.036, 0.05, 0.011);
    dz -= 0.009 * (g(0.031, 0.011, 0.015, 0.01) + g(-0.031, 0.011, 0.015, 0.01));
    dz += 0.004 * (g(0.046, -0.014, 0.016, 0.016) + g(-0.046, -0.014, 0.016, 0.016));
    if (y < 0.034 && y > -0.036) {
      const t = clamp((0.032 - y) / 0.05, 0, 1);
      const prof = y > -0.017 ? 0.003 + 0.018 * Math.pow(t, 1.5) : 0.021 * smooth(-0.034, -0.017, y);
      const w = 0.0055 + 0.0075 * t;
      dz += prof * Math.exp(-((x / w) ** 2));
    }
    dz += 0.006 * (g(0.0115, -0.02, 0.0055, 0.005) + g(-0.0115, -0.02, 0.0055, 0.005));
    dz += 0.0035 * g(0, -0.038, 0.017, 0.005);
    dz += 0.0045 * g(0, -0.051, 0.015, 0.0045);
    dz -= 0.0022 * g(0, -0.0445, 0.02, 0.0016);
    dz -= 0.002 * g(0, -0.062, 0.02, 0.004);
    dz += 0.006 * g(0, -0.086, 0.022, 0.012);
    z += dz * f;
  }
  return [x, y, z];
}
let HEAD_GEO = null;
function headGeometry() {
  if (HEAD_GEO) return HEAD_GEO;
  const g = new THREE.SphereGeometry(0.1, 96, 72);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const [x, y, z] = sculpt(p.getX(i), p.getY(i), p.getZ(i)); p.setXYZ(i, x, y, z); }
  g.computeVertexNormals();
  HEAD_GEO = g;
  return g;
}
// depth of the head's front surface at (x, y)
function headSurfZ(x, y) {
  const p = headGeometry().attributes.position;
  let best = 0, bd = Infinity;
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i); if (z < 0.02) continue;
    const d = (p.getX(i) - x) ** 2 + (p.getY(i) - y) ** 2;
    if (d < bd) { bd = d; best = z; }
  }
  return best;
}
// canvas position of a front-of-head point (for painting the face texture)
function headUV(x, y, W, H) {
  const th = Math.acos(clamp(y / HEAD.sy / 0.1, -1, 1));
  const xo = x / (HEAD.sx * (1 - smooth(0.0, -0.11, y) * 0.28));
  const phi = Math.acos(clamp(-xo / (0.1 * Math.max(1e-4, Math.sin(th))), -1, 1));

// a shell over part of the head: hair, beards, hats
function headShell(keep, offset) {
  const geo = headGeometry();
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = geo.attributes.uv, idx = geo.index;
  const P = [], N = [], U = [];
  for (let i = 0; i < idx.count; i += 3) {
    const t = [idx.getX(i), idx.getX(i + 1), idx.getX(i + 2)];
    if (!t.every((k) => keep(pos.getX(k), pos.getY(k), pos.getZ(k)))) continue;
    for (const k of t) {
      const x = pos.getX(k), y = pos.getY(k), z = pos.getZ(k);
      const off = typeof offset === 'function' ? offset(x, y, z) : offset;
      P.push(x + nor.getX(k) * off, y + nor.getY(k) * off, z + nor.getZ(k) * off);
      N.push(nor.getX(k), nor.getY(k), nor.getZ(k)); U.push(uv.getX(k), uv.getY(k));
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));

// y above which hair grows: forehead in front, above the ears on the sides, nape at the back
function hairline(x, z, front = 0.05, back = -0.062, ears = 0.012) {
  let th = lerp(back, front, smooth(0.0, 0.07, z));
  const side = smooth(0.045, 0.07, Math.abs(x)) * (1 - smooth(0.0, 0.045, Math.abs(z)));
  return lerp(th, Math.max(th, ears), side);

    this.t = Math.random() * 10;
    this.blinkT = rand(1, 4); this.blink = 0;

    this.lookTarget = null; this.lookW = 0;

  _build() {
    const s = this.spec, M = this.M, j = this.j;
    const G = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
    const add = (parent, geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
    const cap = (r, l, seg = 16) => new THREE.CapsuleGeometry(r, l, 8, seg);
    const sc = s.build || 1; // width scale
    j.hips = G(this.root, 0, 0.94, 0);

    const pel = add(j.hips, new THREE.SphereGeometry(0.13, 24, 18), M.pants, 0, -0.02, 0); pel.scale.set(1.18 * sc, 0.75, 0.92);

    }
    if (s.logo) {

    j.head = G(j.neck, 0, 0.1, 0.012);
    const H = j.head;

    const ER = 0.0122;
    for (const sx of [-1, 1]) {

      const lash = add(upper, new THREE.TorusGeometry((ER + 0.0007) * Math.sin(Math.PI * 0.46), 0.0008, 4, 24, Math.PI), M.black, 0, (ER + 0.0007) * Math.cos(Math.PI * 0.46), 0);

        const temple = add(F, new THREE.BoxGeometry(0.0025, 0.0025, 0.085), gm, sx * 0.0485, 0.014, gz - 0.043); temple.rotation.y = sx * 0.22;
      }
      add(F, new THREE.BoxGeometry(0.012, 0.0025, 0.0025), gm, 0, 0.015, gz + 0.001);
    }
    if (s.headphones) {
      const band = add(F, new THREE.TorusGeometry(0.128, 0.008, 8, 40, Math.PI), M.black, 0, 0.0, -0.01);
      band.scale.x = 0.72;
      for (const sx of [-1, 1]) {
        const cup = add(F, new THREE.CylinderGeometry(0.033, 0.033, 0.026, 24), M.black, sx * 0.09, 0.0, -0.008); cup.rotation.z = Math.PI / 2;
        const glow = add(F, new THREE.TorusGeometry(0.027, 0.004, 8, 24), new THREE.MeshStandardMaterial({ color: s.accent || 0x38e08c, emissive: s.accent || 0x38e08c, emissiveIntensity: 0.8 }), sx * 0.104, 0, -0.008);
        glow.rotation.y = Math.PI / 2;

    // arms
    const armSide = (sx) => {
      const sh = G(j.chest, sx * 0.175 * sc, 0.19, 0.0);
      const shoulderBall = add(sh, new THREE.SphereGeometry(0.062, 18, 14), M.top, 0, -0.01, 0);
      shoulderBall.scale.set(1, 0.9, 0.9);
      const upper = add(sh, cap(0.054, 0.2), M.top, 0, -0.13, 0);
      const el = G(sh, 0, -0.27, 0);
      add(el, new THREE.SphereGeometry(0.05, 14, 10), M.top, 0, 0, 0);
      add(el, cap(0.048, 0.17), M.top, 0, -0.11, 0);
      const cuff = add(el, new THREE.CylinderGeometry(0.04, 0.042, 0.045, 18), M.top2, 0, -0.215, 0);
      const wr = G(el, 0, -0.245, 0);
      add(wr, new THREE.CylinderGeometry(0.026, 0.03, 0.03, 14), M.skinFlat, 0, 0.005, 0);
      // hand
      const hand = G(wr, 0, -0.015, 0);
      const palm = add(hand, new RoundedBoxGeometry(0.075, 0.085, 0.03, 3, 0.013), M.skinFlat, 0, -0.04, 0.0);
      palm.rotation.y = sx * 0.0;
      const fingers = [];
      for (let i = 0; i < 4; i++) {
        const fx = (i - 1.5) * 0.0175;
        const f = G(hand, fx, -0.08, 0.0);
        const len = [0.046, 0.054, 0.05, 0.04][i];
        add(f, cap(0.0078, len * 0.5, 8), M.skinFlat, 0, -len * 0.25, 0);
        const f2 = G(f, 0, -len * 0.5, 0);
        add(f2, cap(0.0072, len * 0.38, 8), M.skinFlat, 0, -len * 0.2, 0);
        fingers.push([f, f2]);
      }
      const th = G(hand, sx * -0.034, -0.03, 0.012);
      add(th, cap(0.0095, 0.03, 8), M.skinFlat, 0, -0.022, 0);
      th.rotation.z = sx * -0.6; th.rotation.y = sx * 0.6;
      if (s.watch && sx < 0) add(wr, new THREE.CylinderGeometry(0.032, 0.032, 0.018, 18), M.gold, 0, 0.01, 0);
      return { sh, el, wr, hand, fingers, thumb: th };
    };
    // character's left is +x (facing +z)
    j.L = armSide(1); j.R = armSide(-1);
    // legs
    const legSide = (sx) => {
      const hip = G(j.hips, sx * 0.09 * sc, -0.03, 0);
      add(hip, cap(0.075, 0.3), M.pants, 0, -0.2, 0);
      const kn = G(hip, 0, -0.43, 0);
      add(kn, new THREE.SphereGeometry(0.062, 14, 10), M.pants, 0, 0, 0);
      add(kn, cap(0.058, 0.32), M.pants, 0, -0.2, 0);
      const hem = add(kn, new THREE.CylinderGeometry(0.06, 0.064, 0.04, 18), M.pants, 0, -0.375, 0);

      const sole = add(an, new RoundedBoxGeometry(0.11, 0.03, 0.27, 2, 0.012), M.sole, 0, -0.072, 0.045);
      const tongue = add(an, new THREE.SphereGeometry(0.03, 12, 8), M.sole, 0, -0.005, 0.07); tongue.scale.set(1, 0.6, 1.4);

    j.LL = legSide(1); j.RL = legSide(-1);
    if (s.phone) {

      add(ph, new RoundedBoxGeometry(0.075, 0.155, 0.009, 2, 0.008), M.black);
      const scr = add(ph, new THREE.PlaneGeometry(0.068, 0.145), new THREE.MeshBasicMaterial({ color: 0x9fd7ff, toneMapped: false }), 0, 0, -0.0048);
      scr.rotation.y = Math.PI;

      cs.position.set(0, -0.08, 0.04); cs.rotation.x = Math.PI / 2;

  }

  _hair(F) {
    const s = this.spec, M = this.M;
    const add = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); F.add(m); return m; };
    const hm = M.hair.clone(); hm.side = THREE.DoubleSide;
    const style = s.hairStyle;
    const hatOn = !!s.hat;
    if (style === 'short' || style === 'messy' || style === 'buzz') {
      const thick = style === 'buzz' ? () => 0.0022 : style === 'messy' ? (x, y) => 0.006 + 0.016 * smooth(-0.02, 0.1, y) : (x, y) => 0.004 + 0.011 * smooth(-0.02, 0.1, y);
      const keep = (x, y, z) => y > hairline(x, z, style === 'buzz' ? 0.056 : 0.05) || (Math.abs(x) > 0.064 && z > 0.0 && z < 0.034 && y > -0.016);
      add(headShell(keep, thick), hm);
      if (style !== 'buzz' && !hatOn) {
        // fringe tufts break up the hairline silhouette
        const rnd = mulberry32(hashStr(s.name));
        for (let i = 0; i < (style === 'messy' ? 16 : 9); i++) {
          const x = (rnd() - 0.5) * 0.1, y = 0.052 + rnd() * 0.02;
          const z = headSurfZ(x, y) + 0.004;
          const t = add(new THREE.ConeGeometry(0.011, 0.04, 7), hm, x, y + 0.006, z);
          t.rotation.set(2.3 + rnd() * 0.4, 0, (rnd() - 0.5) * 0.8);
        }
      }
    } else if (style === 'curly') {
      const keep = (x, y, z) => y > hairline(x, z, 0.054, -0.05, 0.02);
      add(headShell(keep, 0.008), hm);
      const rnd = mulberry32(hashStr(s.name));
      const n = 170, geo = new THREE.SphereGeometry(0.019, 10, 8);
      const inst = new THREE.InstancedMesh(geo, M.hair, n);
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
      const hp = headGeometry().attributes.position, hn = headGeometry().attributes.normal;
      let k = 0, tries = 0;
      while (k < n && tries < 20000) {
        tries++;
        const vi = Math.floor(rnd() * hp.count);
        const x = hp.getX(vi), y = hp.getY(vi), z = hp.getZ(vi);
        if (!(y > hairline(x, z, 0.06, -0.04, 0.03))) continue;
        const o = 0.012 + rnd() * 0.012;
        p.set(x + hn.getX(vi) * o, y + hn.getY(vi) * o, z + hn.getZ(vi) * o);
        const s0 = 0.75 + rnd() * 0.6; sc.set(s0, s0, s0);
        q.setFromEuler(new THREE.Euler(rnd() * 3, rnd() * 3, rnd() * 3));
        m4.compose(p, q, sc); inst.setMatrixAt(k++, m4);
      }
      inst.count = k;
      F.add(inst);
    }
    if (s.hat === 'beanie') {
      const bm = new THREE.MeshPhysicalMaterial({ color: s.hatColor, map: charTextures().knit.map, normalMap: charTextures().knit.normalMap, roughness: 0.95, sheen: 1, sheenColor: new THREE.Color(s.hatColor).lerp(new THREE.Color(0xffffff), 0.3), side: THREE.DoubleSide });
      const hl = (x, z) => lerp(-0.004, 0.06, smooth(0.0, 0.07, z));
      add(headShell((x, y, z) => y > hl(x, z), (x, y) => 0.016 + 0.01 * smooth(0.04, 0.11, y)), bm);
      add(headShell((x, y, z) => y > hl(x, z) - 0.002 && y < hl(x, z) + 0.026, 0.022), bm);
    }
    if (s.hat === 'cap') {
      const cm = new THREE.MeshStandardMaterial({ color: s.hatColor, map: charTextures().weave.map, normalMap: charTextures().weave.normalMap, roughness: 0.85, side: THREE.DoubleSide });
      const hl = (x, z) => lerp(0.018, 0.058, smooth(0.0, 0.07, z));
      add(headShell((x, y, z) => y > hl(x, z), 0.019), cm);
      // brim worn backwards
      const brim = add(new THREE.CylinderGeometry(0.068, 0.068, 0.005, 32, 1, false, Math.PI / 2, Math.PI), cm, 0, 0.03, -0.075);
      brim.rotation.x = 0.12; brim.scale.set(0.95, 1, 1);
      add(new THREE.SphereGeometry(0.008, 10, 8), cm, 0, 0.136, -0.004);
    }
    if (s.beard) {
      const keep = (x, y, z) => z > -0.022 && y > -0.135 && (y < -0.028 || (Math.abs(x) > 0.05 && y < 0.004 && z < 0.06)) && !(Math.abs(x) < 0.023 && y > -0.058 && y < -0.034);
      add(headShell(keep, (x, y) => 0.0035 + 0.004 * smooth(-0.04, -0.12, y)), hm);
    }
  }

  // ---------- posing ----------
  static POSES = {

  setState(s) { this.state = s; }
  say(ms = 2500) { this.talkUntil = performance.now() + ms; }
  doEmote(kind, ms = 2500) { this.emote = kind; this.emoteUntil = performance.now() + ms; }

  update(dt, camPos) {
    this.t += dt;
    const t = this.t, j = this.j, now = performance.now();
    let P = { ...Person.POSES[this.state] || Person.POSES.stand };
    P.L = [...P.L]; P.R = [...P.R]; P.LL = [...P.LL]; P.RL = [...P.RL];
    const seated = this.state === 'sit' || this.state === 'type' || this.state === 'couch';
    if (this.emote && now > this.emoteUntil) this.emote = null;
    const talking = now < this.talkUntil;
    // emotes override arms
    if (this.emote === 'cheer') { P.L = [-0.4, 0, 2.6 + Math.sin(t * 10) * 0.15, -0.4]; P.R = [-0.4, 0, -2.6 - Math.sin(t * 10) * 0.15, -0.4]; P.headX = -0.2; P.curl = 0.9; }
    if (this.emote === 'facepalm') { P.R = [-1.25, -0.5, -0.1, -2.25]; P.headX = 0.35; P.neck = 0.2; }
    if (this.emote === 'shrug') { P.L = [-0.2, 0.4, 0.5, -1.4]; P.R = [-0.2, -0.4, -0.5, -1.4]; P.headX = -0.05; }

const AUDIO = {
  ctx: null, master: null, vol: 0.7,
  init() {
    if (this.ctx) { this.ctx.resume?.(); return; }

      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.vol; this.master.connect(this.ctx.destination);

      const src = this.ctx.createBufferSource(); src.buffer = n; src.loop = true;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
      const g = this.ctx.createGain(); g.gain.value = 0.05;
      src.connect(lp); lp.connect(g); g.connect(this.master); src.start();
      const hum = this.ctx.createOscillator(); hum.frequency.value = 60; const hg = this.ctx.createGain(); hg.gain.value = 0.006;
      hum.connect(hg); hg.connect(this.master); hum.start();

      const fan = this.ctx.createBufferSource(); fan.buffer = n; fan.loop = true;
      const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
      this.fanGain = this.ctx.createGain(); this.fanGain.gain.value = 0.0;

    } catch (e) { this.ctx = null; }
  },
  noiseBuf(sec) {
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate * sec, this.ctx.sampleRate);
    const d = b.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    return b;
  },
  setVolume(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    if (!this.ctx) return;

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  noise(dur, freq = 1000, vol = 0.1, q = 1, delay = 0) {

// PLAYER — first person (pointer lock + WASD, or touch sticks)
// ============================================================
class Player {
  constructor(camera, dom, world) {
    this.cam = camera; this.dom = dom; this.W = world;
    this.pos = new THREE.Vector3(-0.6, 0, -1.4);
    this.yaw = Math.PI * 0.95; this.pitch = -0.08;
    this.eye = 1.63; this.bob = 0; this.stepAcc = 0;
    this.keys = {}; this.locked = false; this.enabled = true;
    this.touch = { move: new THREE.Vector2(), lookId: null, moveId: null, last: null, origin: null };
    this.sens = 1;
    this.target = null; // current interactable under the crosshair
    this.tween = null;
    this.isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
    this._bind();
  }
  _bind() {
    addEventListener('keydown', (e) => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      this.keys[e.code] = true;
      if (e.code === 'Tab') e.preventDefault();
    });
    addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === this.dom;
      emit('lockchange', { locked: this.locked });
    });
    addEventListener('mousemove', (e) => {
      if (!this.locked || !this.enabled) return;
      this.yaw -= e.movementX * 0.0022 * this.sens;
      this.pitch = clamp(this.pitch - e.movementY * 0.0022 * this.sens, -1.45, 1.45);
    });
  }
  lock() { if (this.isTouch) return; try { const p = this.dom.requestPointerLock?.(); p?.catch?.(() => {}); } catch (e) { /* not allowed here */ } }
  unlock() { if (document.pointerLockElement) document.exitPointerLock?.(); }
  // touch sticks are wired by the UI layer
  touchStart(id, x, y, side) {
    if (side === 'left' && this.touch.moveId == null) { this.touch.moveId = id; this.touch.origin = { x, y }; this.touch.move.set(0, 0); return 'move'; }
    if (side === 'right' && this.touch.lookId == null) { this.touch.lookId = id; this.touch.last = { x, y }; return 'look'; }
    return null;
  }
  touchMove(id, x, y) {
    if (id === this.touch.moveId) {
      const dx = x - this.touch.origin.x, dy = y - this.touch.origin.y, R = 55;
      const l = Math.hypot(dx, dy), k = l > R ? R / l : 1;
      this.touch.move.set((dx * k) / R, (dy * k) / R);
      return { dx: dx * k, dy: dy * k };

      this.yaw -= (x - this.touch.last.x) * 0.0055 * this.sens;
      this.pitch = clamp(this.pitch - (y - this.touch.last.y) * 0.0055 * this.sens, -1.45, 1.45);
      this.touch.last = { x, y };
    }
    return null;
  }
  touchEnd(id) {
    if (id === this.touch.moveId) { this.touch.moveId = null; this.touch.move.set(0, 0); }
    if (id === this.touch.lookId) this.touch.lookId = null;
  }
  // smooth camera move (sitting at the PC etc.)
  tweenTo(pos, lookAt, dur = 0.6, done) {
    const from = { p: this.cam.position.clone(), q: this.cam.quaternion.clone() };
    const m = new THREE.Matrix4().lookAt(pos, lookAt, new THREE.Vector3(0, 1, 0));

  collide(p) {

    const B = this.W.bounds || ROOM;
    p.x = clamp(p.x, B.x0 + r, B.x1 - r);
    p.z = clamp(p.z, B.z0 + r, B.z1 - r);
    const boxes = this.W.colliders.concat(this.W.dynColliders || []);
    for (let pass = 0; pass < 2; pass++) for (const b of boxes) {
      const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
      const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
      if (d2 < r * r) {
        if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + (dx / d) * r; p.z = cz + (dz / d) * r; }

          p.x += opts[0][0]; p.z += opts[0][1];

      if (!n.root.visible) continue;
      const dx = p.x - n.root.position.x, dz = p.z - n.root.position.z, d = Math.hypot(dx, dz), rr = r + 0.25;

    const k = this.keys;
    let fx = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
    let sx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);

    if (moving) {
      this.bob += dt * (run ? 11 : 7.5);
      this.stepAcc += dt * speed;
      if (this.stepAcc > 0.75) { this.stepAcc = 0; AUDIO.sfx('step'); }
    } else this.bob = damp(this.bob, Math.round(this.bob / Math.PI) * Math.PI, 6, dt);
    const by = Math.sin(this.bob * 2) * 0.025 * (moving ? 1 : 0), bx = Math.cos(this.bob) * 0.015 * (moving ? 1 : 0);

    const dir = new THREE.Vector3(); this.cam.getWorldDirection(dir);
    let best = null, bestScore = Infinity;
    for (const it of interactables) {
      if (it.enabled && !it.enabled()) continue;
      const to = it.pos.clone().sub(this.cam.position);
      const d = to.length();
      if (d > it.r + 0.4) continue;
      to.normalize();
      const ang = Math.acos(clamp(to.dot(dir), -1, 1));
      const lim = Math.atan2(it.size || 0.45, d) + 0.18;
      if (ang > lim) continue;
      const score = ang * 2 + d * 0.3;
      if (score < bestScore) { bestScore = score; best = it; }
    }
    this.target = best;
  }
  setStand(pos, yaw) { this.pos.copy(pos); this.yaw = yaw; this.pitch = -0.05; }
}

// album art: gradient sleeve with the track's 3D emoji
function drawAlbumArt(ctx, tr, S) {
  const [emo, hue] = tr.art;
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, `hsl(${hue},70%,58%)`); g.addColorStop(1, `hsl(${(hue + 50) % 360},65%,22%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  ctx.globalAlpha = 0.12; ctx.strokeStyle = '#fff'; ctx.lineWidth = S * 0.004;
  for (let i = 1; i < 9; i++) { ctx.beginPath(); ctx.arc(S * 0.5, S * 0.5, S * 0.06 * i, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  const im = EMOJI[emo];
  if (im) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = S * 0.06; ctx.shadowOffsetY = S * 0.03; ctx.drawImage(im, S * 0.2, S * 0.17, S * 0.6, S * 0.6); ctx.restore(); }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, S * 0.82, S, S * 0.18);
  ctx.fillStyle = '#fff'; ctx.font = `800 ${S * 0.07}px Manrope, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(tr.title.toUpperCase(), S * 0.06, S * 0.91);
}

  { id: 'curve', title: 'Bonding curves (PumpBin)', body: `
<p>Launchpads like PumpBin don't need anyone to provide liquidity at launch. Instead the coin trades against a <b>bonding curve</b>: a formula that sets the price from how many tokens are already sold.</p>
<p>PumpBin uses a constant-product curve over <i>virtual</i> reserves, the same model real launchpads use:</p>
<pre>virtual SOL   = 30 SOL
virtual tokens = 1,073,000,000
price = virtualSOL / virtualTokens
tokens out = vTok − (vSol × vTok) / (vSol + SOL in)</pre>
<p>Total supply is 1B. 793.1M tokens are sold on the curve. Starting price ≈ 0.000000028 SOL (market cap ≈ 28 SOL). Every buy pushes the price up, every sell pushes it down. There's a 1% fee each way.</p>
<p>When all 793.1M curve tokens are sold (about <b>85 SOL</b> raised) the coin <b>graduates</b>: the raised SOL and the last 206.9M tokens seed a DEX pool and the LP tokens are burned. Market cap at graduation is about 410 SOL (~$61K at $150/SOL). Halfway there you hit "King of the Hill" and get front-page visibility.</p>
<p><b>Why the dev bag matters:</b> the creator buys first, at the lowest price on the curve. 1 SOL at launch buys ~34M tokens (3.4% of supply). If the coin reaches graduation those tokens are worth ~14 SOL on paper. Selling them is a different story (see Liquidity).</p>` },
  { id: 'amm', title: 'Liquidity pools & price impact', body: `
<p>After graduation (or on a custom launch) the coin trades in an automated market maker (AMM) pool holding SOL on one side and tokens on the other. The pool keeps <b>x · y = k</b> constant.</p>
<pre>Pool: 80 SOL × 200M tokens  (price 0.0000004 SOL)
You sell 20M tokens:
  new tokens = 220M
  new SOL    = 80 × 200 / 220 = 72.73
  you get    = 7.27 SOL (minus 0.25% fee)
At the old spot price it "should" be 8 SOL. That 9% gap is price impact.</pre>
<p>Bigger sells relative to the pool get worse prices. That's why the Terminal shows <b>"if sold now"</b>, a real quote, next to your bag's paper value. Dumping a big bag into a thin pool crashes the chart and gets you much less than the market cap suggests.</p>` },
  { id: 'mcap', title: 'Market cap is not money', body: `
<p>Market cap = price × total supply. It's the number everyone brags about, but nobody can sell at it. A coin can show a $500K market cap with $40K of liquidity in the pool. If holders all tried to sell, they'd split roughly that $40K.</p>
<p>Real exit value is always limited by liquidity, and every sell drains it for the next seller. First out gets paid. Last out holds the bag.</p>` },
  { id: 'snipers', title: 'Snipers & the dev bag', body: `
<p><b>Snipers</b> are bots that buy new tokens in the first second or two, hoping to dump on the first real buyers. Most flip within seconds. As a dev you'll often see your chart jump at launch, then dip as they exit. The RGB gaming PC's fast launch relay keeps most of them out.</p>
<p>Your <b>dev bag</b> is visible to everyone on RugRadar. A big bag gives you more upside, but buyers know you could dump it on them, so careful wallets buy less.</p>` },
  { id: 'chirp', title: 'Chirp, followers & KOLs', body: `
<p>Memecoins run on attention. Every post you make on Chirp reaches some share of your followers. A few of them buy, and you can watch those buys arrive in the trade feed tagged <b>via Chirp</b>.</p>
<p>Reach grows faster than linearly with followers, and bigger accounts bring bigger buyers. A 40-follower account moves nothing. 10K followers move a launch. 1M can graduate almost anything. Credibility multiplies everything: when coins you shill get rugged, people unfollow and your credibility drops.</p>
<p><b>KOLs</b> (key opinion leaders) are influencers who sell promotion. In practice many buy your coin before posting and sell into their own followers. That's exactly what happens in RUGGED, and some just take the money and block you.</p>` },
  { id: 'rugs', title: 'Rug pulls', body: `
<p>A <b>rug pull</b> is when the people behind a coin take the money and leave holders with worthless tokens. The common kinds:</p>
<p><b>Dev dump.</b> The creator sells their whole bag into the buyers. It shows on chain as "DEV SOLD" and the chart collapses.</p>
<p><b>Liquidity pull.</b> Only possible when the dev controls the pool's LP tokens. Removing liquidity takes the SOL out of the pool and nobody can sell anymore. Locking LP delays this. Burning LP makes it impossible.</p>
<p>RugRadar also warns about contract tricks you'll see on real tokens, like unrevoked mint authority (more tokens can be printed) and honeypots (buys work, sells don't).</p>
<p>In RUGGED a rug pays more than running a coin honestly, but bagholders call you out. You lose followers and credibility, and your rug count shows up on every coin you launch after that.</p>` },
  { id: 'radar', title: 'How to spot a rug (RugRadar)', body: `
<ul>
<li><b>Mint authority</b> should be revoked.</li>
<li><b>LP</b> should be burned, or at least locked for a long time.</li>
<li><b>Dev holdings</b> and the <b>top 10 holders</b> shouldn't control a huge share.</li>
<li><b>Dev history:</b> a creator linked to previous rugs is the biggest red flag of all.</li>
<li><b>Dev selling:</b> a creator wallet that's dumping is a warning sign.</li>
</ul>
<p>Smart money in RUGGED reads RugRadar and stays away from risky coins. Degens mostly don't. Your risk score directly changes who buys.</p>` },
  { id: 'fees', title: 'Creator fees & running a real coin', body: `
<p>Launchpads pay creators a small cut of trading volume. In RUGGED that's <b>0.3% of every trade</b> on your coin, on the curve and on the DEX. Claim it any time in the Terminal.</p>
<p>A coin that keeps trading for a long time earns fees the whole way. If you don't rug, holders who made money follow you, and a coin that graduates gives your credibility a big boost. Bigger following means more reach on your next launch.</p>
<p>Taking some profit is normal. Selling more than half your bag on your holders counts as a rug.</p>` },
  { id: 'rep', title: 'Followers & credibility', body: `
<p>Your reach on Chirp depends on followers × credibility. Credibility goes up when you call coins that run and when your coins graduate. It drops when you rug, especially coins you shilled with a "100x" call. It recovers a little each day.</p>
<p>Every rug is also public history. RugRadar shows "Dev linked to N rugs" on all your future launches, and careful buyers stay away.</p>` },
  { id: 'glossary', title: 'Glossary', body: `
<p><b>Ape</b>: buy without thinking. <b>Jeet</b>: someone who sells fast. <b>CA</b>: contract address. <b>LP</b>: liquidity pool / its ownership tokens. <b>Mcap</b>: market cap. <b>ATH</b>: all-time high. <b>Bags</b>: your holdings. <b>Exit liquidity</b>: the people you sell to. <b>CTO</b>: community takeover after the dev leaves. <b>KOL</b>: paid influencer. <b>DYOR</b>: do your own research. <b>WAGMI / NGMI</b>: we're all gonna make it / not gonna make it. <b>Rekt</b>: wrecked.</p>` },
  { id: 'real', title: 'Real talk', body: `
<p>RUGGED is satire. In the real world rug pulls are fraud, and the people holding the bag lost real money. Use what you learn here to recognize rugs, not to run them.</p>` },
];

  newDraft() {

  updateHUD() {
    if (!S) return;
    $('#h-cash').textContent = fmtUSD(S.cash);
    $('#h-sol').textContent = `${fmtSOL(S.sol)} SOL`;
    $('#h-foll').textContent = fmtNum(S.followers);
    $('#h-cred').textContent = Math.round(S.cred * 100) + '%';
    $('#h-cred').dataset.level = S.cred < 0.6 ? 'bad' : S.cred < 0.9 ? 'warn' : 'ok';
    $('#h-stam').style.width = Math.min(100, S.stamina / staminaMax() * 100) + '%';
    $('#h-stamv').textContent = Math.round(S.stamina);
    $('#h-day').textContent = `DAY ${S.day}`;
    const ph = S.cycle?.phase || 'normal';
    $('#h-loc').innerHTML = `${h(LOCS[S.loc]?.name || '')}${ph !== 'normal' ? ` <i class="cyc ${ph}">${ph === 'bull' ? 'BULL' : 'BEAR'}</i>` : ''}`;
    $('#h-time').textContent = clockText();
    $('#coinbar').innerHTML = LIVE.map((c) => {
      const ph = c.priceHist, ch = ph.length > 10 ? c.price() / ph[ph.length - 11] - 1 : 0;
      return `<div class="tick ${ch >= 0 ? 'up' : 'down'}">${coinIcon(c, 18)}<b>$${h(c.ticker)}</b><span>${usdC(c.mcapSol())}</span><i>${fmtPct(ch)}</i></div>`;

  // ---------------- Trenches ----------------

    cols.fresh.sort((a, b) => a.t - b.t); cols.stretch.sort((a, b) => b.progress() - a.progress()); cols.grad.sort((a, b) => b.mcapSol() - a.mcapSol());

  live_terminal() {
    const c = focusCoin(); if (!c) return;
    const sp = S.solPrice, mine = isMine(c);
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.innerHTML = v; };
    set('t-mcap', fmtUSD(c.mcapSol() * sp));
    set('t-price', '$' + fmtPrice(c.price() * sp));
    set('t-liq', fmtUSD(c.liquiditySol() * sp, { compact: true }));
    set('t-vol', fmtUSD(c.volume * sp, { compact: true }));
    set('t-hold', c.holderCount());
    const r = c.risk();
    set('t-risk', `<span class="risk r${r.score > 45 ? 3 : r.score > 20 ? 2 : 1}">${r.score}</span>`);
    const phase = c.phase === 'curve' ? '<span class="badge info">Bonding curve</span>' : c.phase === 'dex' ? (c.type === 'custom' ? '<span class="badge brand">Custom pool</span>' : '<span class="badge up">Graduated</span>') : '<span class="badge down">Rugged</span>';
    const prof = c.npc && (S.owned.serverRack || (c.npc.step > 0 && c.npc.profile === 'rugger')) ? `<span class="badge ${c.npc.profile === 'rugger' ? 'down' : c.npc.profile === 'flipper' ? 'warn' : 'up'}">Dev: ${DEV_PROFILES[c.npc.profile]}</span>` : '';
    set('t-badges', phase + (mine ? ' <span class="badge brand">Your coin</span>' : '') + (c.dead ? ' <span class="badge">Dead</span>' : '') + (prof ? ' ' + prof : ''));
    set('t-age', fmtDur(c.t) + ' old');
    const cw = document.getElementById('t-curvewrap');
    if (cw) { cw.hidden = c.phase !== 'curve'; set('t-curvetxt', `${Math.round(c.progress() * 100)}% → ${usdC(410)}`); const b = document.getElementById('t-curve'); if (b) b.style.width = c.progress() * 100 + '%'; }
    set('t-mood', { launch: 'Launch frenzy', pump: '<span class="up">Pumping</span>', calm: 'Ranging', dip: '<span class="down">Dipping</span>', devsold: '<span class="down">Panic</span>', dead: 'Dead' }[c._mood] || '');
    if (mine) {
      const tok = c.dev.main.tokens, q = c.isLive() ? c.quoteSell(tok) : 0, fees = c.creatorFees - c.feesClaimed;
      const pnl = c.devProceeds + q + fees - c.devCost - c.extraCosts;
      set('t-bag', `${fmtNum(tok)} <small class="dim">${fmtPct(tok / c.supply, false)}</small>`);
      set('t-quote', `${fmtSOL(q)} <small class="dim">SOL</small>`);
      set('t-fees', `${fmtSOL(fees)} <small class="dim">SOL</small>`);
      set('t-pnl', `<span class="${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${fmtSOL(pnl)}</span>`);
      const claim = document.getElementById('t-claim'); if (claim) claim.disabled = fees < 0.0005;
      const sold = Math.min(1, c.dev.soldFrac);
      const mt = document.getElementById('t-meter'); if (mt) mt.dataset.level = c.rugged ? 'bad' : sold > 0.3 ? 'warn' : 'ok';
      const rb = document.getElementById('t-rugbar'); if (rb) rb.style.width = Math.max(2, sold * 100) + '%';
      set('t-rugtxt', c.rugged ? 'You rugged this coin.' : `Sold ${Math.round(sold * 100)}% of your bag · rug line at 50%`);
      if (c.type === 'custom') {
        set('t-pool', `${fmtSOL(c.poolSol)} SOL`);
        const cc = document.getElementById('t-custom');
        const sig = [c.lp, c.phase, Math.ceil(Math.max(0, c.lockUntil - c.t) / 5)].join();
        if (cc && cc.dataset.sig !== sig) {
          cc.dataset.sig = sig;
          let b = '';
          if (c.phase !== 'dex') b = '<span class="mut">The pool is empty.</span>';
          else if (c.lp === 'dev') b = `<button class="btn danger" data-act="pull">Pull liquidity</button><button class="btn" data-act="burn">Burn LP</button><button class="btn" data-act="lock" data-sec="120">${ic('lock')}Lock 2 min</button><button class="btn" data-act="lock" data-sec="300">${ic('lock')}Lock 5 min</button>`;
          else if (c.lp === 'locked') b = `<button class="btn" disabled>${ic('lock')}Locked · ${fmtDur(c.lockUntil - c.t)}</button>`;
          else b = '<span class="mut">LP burned. Nobody can pull it, including you.</span>';
          cc.innerHTML = b;
        }
      }
    } else {
      const y = c.you(), tok = y?.tokens || 0, v = positionValue(c);
      const cost = y ? y.cost - (y.costBooked || 0) : 0, pnl = y ? v + y.proceeds - y.cost : 0;
      set('t-hold2', tok > 0 ? `${fmtNum(tok)}` : '—');
      set('t-val', tok > 0 ? `${fmtSOL(v)} <small class="dim">SOL</small>` : '—');
      set('t-cost', y ? `${fmtSOL(cost)} <small class="dim">SOL</small>` : '—');
      set('t-tpnl', y ? `<span class="${pnl >= 0 ? 'up' : 'down'}">${pnl >= 0 ? '+' : ''}${fmtSOL(pnl)}</span>` : '—');
      const fl = document.getElementById('t-flags');
      const fsig = r.flags.map((x) => x.label).join('|');
      if (fl && fl.dataset.sig !== fsig) { fl.dataset.sig = fsig; fl.innerHTML = r.flags.filter((x) => x.level !== 'ok').slice(0, 4).map((x) => `<div class="flag ${x.level}"><i></i><div><b>${h(x.label)}</b></div></div>`).join('') || '<div class="flag ok"><i></i><div><b>No red flags right now</b><p>That can change the moment the dev sells.</p></div></div>'; }
    }
    // bottom tab
    const tab = document.getElementById('t-tab');
    if (tab) {
      if (this.termTab === 'trades') tab.innerHTML = `<div class="trades">${c.trades.slice(-14).reverse().map((t) => `<div class="trade ${t.side}${t.dev ? ' dev' : ''}${t.who === 'YOU' ? ' you' : ''}"><span class="side">${t.side === 'buy' ? 'Buy' : 'Sell'}</span><b>${h(t.who)}</b><em class="${t.via === 'chirp' ? 'via' : ''}">${t.via === 'chirp' ? 'via Chirp' : t.type === 'kol' ? 'KOL' : t.type === 'whale' ? 'Whale' : t.type === 'sniper' ? 'Sniper bot' : t.lp ? 'Liquidity pulled' : ''}</em><i>${fmtSOL(t.sol)} SOL</i><small>${usdC(t.mcap)}</small></div>`).join('')}</div>`;
      else if (this.termTab === 'holders') {
        const bags = c.holders.filter((x) => x.tokens > 0).map((x) => ({ who: x.type === 'you' ? 'YOU' : (x.handle || shortAddr(x.addr)), t: x.tokens, cls: x.type === 'you' ? 'you' : '' }));
        if (c.dev.main.tokens > 0) bags.push({ who: mine ? 'DEV (you)' : 'DEV', t: c.dev.main.tokens, cls: 'dev' });
        bags.sort((a, b) => b.t - a.t);
        const top = bags[0]?.t || 1;
        tab.innerHTML = `<div class="holders">${bags.slice(0, 12).map((b, i) => `<div class="holder ${b.cls}"><span class="dim">${i + 1}</span><span>${h(b.who)}</span><div class="hb"><i style="width:${b.t / top * 100}%"></i></div><span>${fmtPct(b.t / c.supply, false)}</span></div>`).join('') || '<div class="empty"><p>No holders yet.</p></div>'}</div>`;
      } else {
        const n = c.chat.length;
        if (tab.dataset.n != n || tab.dataset.id != c.id) {
          tab.dataset.n = n; tab.dataset.id = c.id;
          tab.innerHTML = `<div class="chatbox" id="t-chatbox">${c.chat.slice(-40).map((x) => `<div class="cmsg ${x.kind}"><b>${h(x.who)}</b><span>${h(x.text)}</span></div>`).join('')}</div>`;
          const cb = document.getElementById('t-chatbox'); if (cb) cb.scrollTop = cb.scrollHeight;
        }
      }
    }
    const cv = document.getElementById('t-chart');
    if (cv) {
      const rr = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
      const w = Math.max(50, Math.round(rr.width * dpr)), hh = Math.max(50, Math.round(rr.height * dpr));
      if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; }
      drawChart(cv.getContext('2d'), c, w, hh, { axis: true, scale: dpr, volume: true });
    }
  },

  live_chirp() {

        ctx.clearRect(0, 0, w, hh);
        if (MUSIC.analyser) MUSIC.analyser.getByteFrequencyData(MUSIC.fft);
        const n = 48, bw = w / n;
        for (let i = 0; i < n; i++) {
          const v = MUSIC.on && MUSIC.fft ? MUSIC.fft[Math.floor(i * 1.6) + 1] / 255 : 0.02;
          const bh = Math.max(3, v * hh * 0.95);

          ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(i * bw + 2, hh - bh, bw - 4, bh, 3); ctx.fill();

        this._viz = requestAnimationFrame(loop);
      };
      this._viz = requestAnimationFrame(loop);

  // ---------------- input ----------------
  onInput(e) {
    const t = e.target, d = this.draft;
    if (t.id === 'mu-vol') { MUSIC.setVolume(+t.value); SET.music = +t.value; saveSettings(); return; }
    if (t.id === 'pc-search') { this.search = t.value; if (this.app !== 'trenches') { this.app = 'trenches'; this.renderPC(); const s = $('#pc-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); } else { this._sig = null; this.live(true); } return; }

    const map = { 'pb-dev': 'devBuy', 'pb-lpsol': 'lpSol', 'pb-lppct': 'lpPct' };
    if (map[t.id]) {
      d[map[t.id]] = parseFloat(t.value);
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('lbl-lpsol', fmtSOL(d.lpSol) + ' SOL'); set('lbl-lppct', Math.round(d.lpPct * 100) + '%'); set('lbl-cost', fmtSOL(launchCost(d)) + ' SOL');
      if (t.id === 'pb-dev') { const tk = new Coin({ name: 'x', ticker: 'x', kind: 'x' }).quoteBuy(d.devBuy); set('lbl-devtok', `${fmtSOL(d.devBuy)} SOL buys ≈ ${fmtNum(tk)} tokens (${fmtPct(tk / SUPPLY, false)} of supply) at the lowest price on the curve. You also earn 0.3% of all volume as creator fees.`); }

  act(fn) { const err = fn(); if (err) { this.toast(err, 'bad'); AUDIO.sfx('error'); } return !err; },

    AUDIO.sfx('click');
    const refresh = () => { if (this.pcOpen) this.renderAppKeep(); if (this.phoneOpen) this.renderPhone(); };
    switch (a) {
      case 'app': this.app = b.dataset.app; this.renderPC(); break;
      case 'open': FOCUS = +b.dataset.id; this.app = 'terminal'; this.tradeMode = 'buy'; this.renderPC(); break;
      case 'focus': FOCUS = +b.dataset.id; this.renderApp(); break;
      case 'copy-ca': try { navigator.clipboard.writeText(c.addr).catch(() => {}); } catch (err) { /* ignore */ } this.toast('Contract address copied'); break;
      case 'ttab': this.termTab = b.dataset.v; this.renderAppKeep(); break;

      case 'dtype': d.type = b.dataset.v; this.renderAppKeep(); break;
      case 'kind': d.kind = b.dataset.v; this.renderAppKeep(); break;
      case 'usename': d.name = b.dataset.n; d.ticker = b.dataset.t; this.renderAppKeep(); break;
      case 'dlp': d.lp = b.dataset.v; this.renderAppKeep(); break;
      case 'devamt': d.devBuy = +b.dataset.v; this.renderAppKeep(); break;

      case 'devbuy': if (c && this.act(() => devBuyMore(c, +b.dataset.sol))) { AUDIO.sfx('buy'); this.toast(`Bought ${b.dataset.sol} SOL more of $${c.ticker}`, 'good'); refresh(); } break;
      case 'sell': {
        if (!c) break;
        const frac = +b.dataset.frac;
        const after = c.dev.soldFrac + (c.dev.main.tokens * frac) / Math.max(1, c.dev.main.start);
        const doSell = () => { const sol = devSell(c, frac); if (sol > 0) { AUDIO.sfx('cash'); this.toast(`Sold for ${fmtSOL(sol)} SOL (${usdOf(sol)})`, 'good'); } refresh(); };
        if (!c.rugged && after >= 0.5 && c.holderCount() > 3) this.confirm(`<h3>Rug $${h(c.ticker)}?</h3><p class="mut">Selling past half your bag dumps on ${c.holderCount() - 1} holders. They'll call you out: you lose followers and credibility, and RugRadar flags your next coins.</p>`, 'Dump it', doSell);

      case 'close-coin':

          const doClose = () => { const r = closeCoin(c); this.toast(`Closed $${r.ticker}: ${r.profit >= 0 ? '+' : ''}${fmtSOL(r.profit)} SOL`, r.profit >= 0 ? 'good' : 'bad'); this.app = 'home'; this.renderPC(); };
          if (c.isLive() && c.dev.main.tokens > 1 && c.quoteSell(c.dev.main.tokens) > 0.01) this.confirm(`<h3>Close $${h(c.ticker)}?</h3><p class="mut">Your remaining bag (about ${fmtSOL(c.quoteSell(c.dev.main.tokens))} SOL right now) stays in the coin. Unclaimed creator fees are claimed for you.</p>`, 'Close it', doClose, 'primary');

        break;

function clockAt(m) {
  m = Math.floor(m) % (24 * 60); const hh = Math.floor(m / 60), mm = m % 60;
  return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`;
}
function clockText() { return clockAt(S.clock); }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }

function drawSpark(ctx, vals, w, h, color, fill) {
  ctx.clearRect(0, 0, w, h);
  if (!vals || vals.length < 2) return;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-12) { hi = lo * 1.01 + 1e-9; lo *= 0.99; }
  const X = (i) => (i / (vals.length - 1)) * w, Y = (v) => h - 4 - ((v - lo) / (hi - lo)) * (h - 8);
  ctx.beginPath(); vals.forEach((v, i) => (i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  if (fill) {
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, color + '40'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fill();
  }
}

// Candles of market cap in USD (what memecoin screeners show)
function drawChart(ctx, coin, w, h, o = {}) {
  const sc = o.scale || 1;
  const axis = o.axis ? 66 * sc : 0;
  const volH = o.volume ? h * 0.16 : 0;
  const pad = { l: 8 * sc, r: axis + 8 * sc, t: 12 * sc, b: (o.axis ? 10 : 6) * sc + volH };
  ctx.fillStyle = '#0c1016'; ctx.fillRect(0, 0, w, h);
  const cs = coin.candles.slice(-(o.max || 90));
  if (!cs.length) return;
  const sp = S.solPrice;
  let lo = Infinity, hi = -Infinity, vmax = 0;
  for (const c of cs) { lo = Math.min(lo, c.l); hi = Math.max(hi, c.h); vmax = Math.max(vmax, c.v); }
  if (hi - lo < hi * 0.02) { hi *= 1.05; lo *= 0.95; }
  const span = hi - lo; hi += span * 0.08; lo = Math.max(0, lo - span * 0.08);
  const X = (i) => pad.l + (i + 0.5) * ((w - pad.l - pad.r) / cs.length);
  const Y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1 * sc;
  ctx.font = `500 ${11 * sc}px "JetBrains Mono", ui-monospace, monospace`; ctx.fillStyle = '#687387'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * (i / 4), y = Y(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    if (axis) ctx.fillText(fmtUSD(v * sp, { compact: true }), w - axis + 6 * sc, y);
  }
  const cw = Math.max(1, ((w - pad.l - pad.r) / cs.length) * 0.64);
  cs.forEach((c, i) => {
    const up = c.c >= c.o, x = X(i);
    ctx.fillStyle = ctx.strokeStyle = up ? '#1fd18a' : '#ff4d61';
    ctx.lineWidth = Math.max(1, sc);
    ctx.beginPath(); ctx.moveTo(x, Y(c.h)); ctx.lineTo(x, Y(c.l)); ctx.stroke();
    const y1 = Y(Math.max(c.o, c.c)), y2 = Y(Math.min(c.o, c.c));
    ctx.fillRect(x - cw / 2, y1, cw, Math.max(1 * sc, y2 - y1));
    if (volH && vmax > 0 && c.v > 0) { ctx.globalAlpha = 0.35; ctx.fillRect(x - cw / 2, h - (c.v / vmax) * volH, cw, (c.v / vmax) * volH); ctx.globalAlpha = 1; }
  });
  // dev / your trades as markers
  const i0 = cs[0].i;
  for (const t of coin.trades) {
    const you = t.who === 'YOU';
    if (!t.dev && !you) continue;
    const k = Math.floor(t.t / CANDLE_SEC) - i0;
    if (k < 0 || k >= cs.length) continue;
    const x = X(k), buy = t.side === 'buy';
    const y = buy ? Y(cs[k].l) + 10 * sc : Y(cs[k].h) - 10 * sc;
    ctx.fillStyle = you ? '#4aa8ff' : buy ? '#1fd18a' : '#ffb547';
    ctx.beginPath(); ctx.arc(x, y, 6 * sc, 0, 7); ctx.fill();
    ctx.fillStyle = '#0c1016'; ctx.font = `700 ${8 * sc}px Manrope, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(you ? (buy ? 'B' : 'S') : 'D', x, y + 0.5 * sc);
    ctx.textAlign = 'left';
  }
  const last = cs[cs.length - 1], ly = Y(last.c), lup = last.c >= last.o;
  ctx.setLineDash([3 * sc, 4 * sc]); ctx.strokeStyle = lup ? 'rgba(31,209,138,0.5)' : 'rgba(255,77,97,0.5)';
  ctx.beginPath(); ctx.moveTo(pad.l, ly); ctx.lineTo(w - pad.r, ly); ctx.stroke(); ctx.setLineDash([]);
  if (axis) {
    ctx.fillStyle = lup ? '#1fd18a' : '#ff4d61';
    ctx.beginPath(); ctx.roundRect(w - axis + 2 * sc, ly - 9 * sc, axis - 6 * sc, 18 * sc, 4 * sc); ctx.fill();
    ctx.fillStyle = '#0c1016'; ctx.font = `600 ${11 * sc}px "JetBrains Mono", monospace`; ctx.fillText(fmtUSD(last.c * sp, { compact: true }), w - axis + 7 * sc, ly);
  }
}

// ---------- photo textures (brick walls, hardwood) ----------
let PHOTO = null;
async function loadPhotos() {
  if (PHOTO) return PHOTO;
  const L = new THREE.TextureLoader();
  const load = (f, srgb) => new Promise((res) => L.load('assets/' + f, (t) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (srgb) t.colorSpace = THREE.SRGBColorSpace; KEEP_TEX.add(t); res(t); }, undefined, () => res(null)));
  const [bd, bb, br, wd, wb, wr] = await Promise.all([load('brick_diffuse.jpg', true), load('brick_bump.jpg'), load('brick_roughness.jpg'), load('hardwood2_diffuse.jpg', true), load('hardwood2_bump.jpg'), load('hardwood2_roughness.jpg')]);
  PHOTO = { brick: bd && { d: bd, b: bb, r: br }, hardwood: wd && { d: wd, b: wb, r: wr } };
  return PHOTO;
}
async function applyPhotoTextures(W) {
  const P = await loadPhotos();
  for (const p of W.photo) {
    const set = P[p.set]; if (!set) continue;
    const c = (t) => { if (!t) return null; const n = t.clone(); n.repeat.set(p.repeat[0], p.repeat[1]); n.needsUpdate = true; return n; };
    const m = p.mat;
    m.map = c(set.d); m.bumpMap = c(set.b); m.bumpScale = p.bump; m.roughnessMap = c(set.r); m.normalMap = null;
    m.color.set(p.tint); m.needsUpdate = true;
  }
}
let SOFA = null;
async function loadSofa() {
  try {
    if (!SOFA) {
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      // .glb when served from the repo; a base64 .js module where only scripts are served
      let buf = null;
      try { const r = await fetch('assets/sofa.glb'); if (r.ok) buf = await r.arrayBuffer(); } catch (e) { /* fall through */ }
      if (!buf) { const m = await import('./assets/sofa.js'); const b = atob(m.default); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); buf = u.buffer; }
      const gltf = await new GLTFLoader().parseAsync(buf, '');
      const sofa = gltf.scene;
      const box = new THREE.Box3().setFromObject(sofa), size = box.getSize(new THREE.Vector3());
      sofa.scale.setScalar(2.0 / Math.max(size.x, size.z));
      const b2 = new THREE.Box3().setFromObject(sofa), c = b2.getCenter(new THREE.Vector3());
      sofa.position.set(-c.x, -b2.min.y, -c.z);
      sofa.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } if (o.isLight) o.visible = false; o.userData.shared = true; });
      SOFA = new THREE.Group(); SOFA.add(sofa); SOFA.userData.shared = true;
    }
    attachSofa(WORLD);
  } catch (e) { /* keep the placeholder couch */ }
}
function attachSofa(W) {
  if (!SOFA || !W.couchGroup) return;
  const s = SOFA.clone(true);
  s.rotation.y = Math.PI;
  W.couchPlaceholder.visible = false;
  W.couchGroup.add(s);
}

let evOpen = false;
function presentEvents() {
  if (evOpen || moving || !G.started || G.paused) return;
  if (G.mode !== 'walk' && G.mode !== 'pc') return;
  if (!$('#modal').hidden || player.tween) return;
  const ev = nextEvent(); if (!ev) return;
  evOpen = true;
  const prev = G.mode;
  if (prev === 'walk') { player.unlock(); G.mode = 'modal'; }
  AUDIO.sfx(ev.finale ? 'launch' : 'notify');
  UI.eventModal(ev, (choice) => {
    let r = null;
    try { r = choice.fx(); } catch (err) { console.error(err); }
    const res = typeof r === 'string' ? { text: r } : r || {};
    if (res.next) queueEvent(res.next[0], res.next[1] ?? null, true);
    const finish = () => {
      evOpen = false;
      UI.updateHUD(); UI.updateObjective();
      if (UI.pcOpen) UI.renderAppKeep();
      if (res.after) { res.after(); return; }
      if (S.ended) return;
      if (prev === 'walk' && !res.next) { G.mode = 'walk'; player.lock(); } else if (prev === 'walk') G.mode = 'walk';
    };
    if (res.text) UI.modal(`<p>${h(res.text)}</p>`, [['ok', 'OK', 'primary']], finish);
    else finish();
  });
}

    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.code === 'KeyE' && G.mode === 'walk') interact(player.target);
    if ((e.code === 'Tab' || e.code === 'KeyQ') && G.started && (G.mode === 'walk' || UI.phoneOpen)) { e.preventDefault(); UI.togglePhone(); }
    if (e.code === 'Escape') {
      if (G.mode === 'pc') leavePC();
      else if (G.mode === 'dialog') dialogTopic('bye');
      else if (UI.phoneOpen) UI.togglePhone(false);
    }
  });
  // touch controls
  const tz = $('#touch');
  if (player.isTouch) {
    tz.hidden = false; document.body.classList.add('touch');
    const stick = $('#stick'), knob = $('#knob');
    tz.addEventListener('touchstart', (e) => {
      AUDIO.init();
      for (const t of e.changedTouches) {
        if (t.target.closest('button')) continue;
        const side = t.clientX < innerWidth * 0.45 ? 'left' : 'right';
        const r = player.touchStart(t.identifier, t.clientX, t.clientY, side);
        if (r === 'move') { stick.hidden = false; stick.style.left = t.clientX + 'px'; stick.style.top = t.clientY + 'px'; knob.style.transform = 'translate(-50%,-50%)'; }
      }
    }, { passive: true });
    tz.addEventListener('touchmove', (e) => { for (const t of e.changedTouches) { const r = player.touchMove(t.identifier, t.clientX, t.clientY); if (r) knob.style.transform = `translate(calc(-50% + ${r.dx}px), calc(-50% + ${r.dy}px))`; } e.preventDefault(); }, { passive: false });
    const end = (e) => { for (const t of e.changedTouches) { if (t.identifier === player.touch.moveId) stick.hidden = true; player.touchEnd(t.identifier); } };
    tz.addEventListener('touchend', end); tz.addEventListener('touchcancel', end);
    $('#use-btn').addEventListener('click', () => interact(player.target));
    $('#phone-btn').addEventListener('click', () => { if (G.started && (G.mode === 'walk' || UI.phoneOpen)) UI.togglePhone(); });
    $('#menu-btn').addEventListener('click', () => { if (G.mode === 'walk') { G.paused = true; G.mode = 'pause'; showPause(); } });
  }
  $('#pc-close').addEventListener('click', () => leavePC());
  addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}

// ---------- loop ----------
let last = performance.now(), saveT = 0, hudT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.frame++;
  if (!G.paused && S) {
    gameTick(dt);
    if (G.mode === 'walk') player.update(dt, interactables());
    else if (player.tween) player.update(dt, []);
    const tgt = G.mode === 'walk' ? player.target : null;
    UI.prompt(tgt ? tgt.label() : null);
    hudT += dt; if (hudT > 0.25) { hudT = 0; UI.updateHUD(); }
    UI.live();
    saveT += dt; if (saveT > 20) { saveT = 0; saveGame(); }
    AUDIO.updateFan(Math.hypot(camera.position.x - WORLD.DESK.x, camera.position.z - WORLD.DESK.z));
    if (G.frame % 20 === 0) presentEvents();
  }
  if (!S || !WORLD) return;
  // crew + world animate even in menus; skip heavy 3D while the PC covers the screen
  const covered = G.mode === 'pc' && !player.tween;
  if (covered && G.frame % 6) { updateScreens(dt); return; }
  const t = now / 1000;
  for (const p of Object.values(CREW)) {
    if (!p.root.visible) continue;
    const d = p.root.position.distanceTo(camera.position);
    p.lookTarget = d < 3.2 || G.dialogWith ? camera.position.clone() : null;
    p.update(dt, camera.position);
  }
  WORLD.update(dt, t, {});
  if (WORLD.speakerMat) WORLD.speakerMat.emissiveIntensity = 0.25 + MUSIC.level() * 5;
  updateScreens(dt);
  composer.render();
}

// hot-reload support for the artifact viewer
(function start() {
  const hot = window.claude?.hot;
  hot?.snapshot?.(() => { saveGame(); return {}; });
  boot().catch((e) => { setLoading('Something broke: ' + e.message, 100); console.error(e); });
})();

// test hook (only with #debug in the URL)
if (location.hash.includes('debug')) {
  window.__rug = { get S() { return S; }, get LIVE() { return LIVE; }, get ECO() { return ECO; }, get G() { return G; }, UI, MUSIC, tradeBuy, devBuyMore, spawnNpcCoin, CREW, sitAtPC, leavePC, interact, launchCoin, postChirp, devSell, closeCoin, gameTick, cashOut, buyItem, trySleep, placeCrew,
    rebuildWorld, moveHome, queueEvent, nextEvent, storyTick, startCeleb, activateRival, endGame, LOCS, travelHome, presentEvents, newGame, startPlaying, saveGame, loadGame,
    player: () => player, camera: () => camera, world: () => WORLD };
}
